  _invConfirm(idx, present) {
    if (!this._invState) return;
    this._invState.items[idx].confirmed = present;
    this._invState.items[idx].missing = !present;
    this._invState.items[idx].checked = true;
    this._invState.items[idx].counted_qty = null;  // reset eventuale conta precedente
    const row = document.getElementById(`invRow${idx}`);
    row.className = `inv-item-row ${present ? 'inv-row-confirmed' : 'inv-row-missing'}`;
    document.getElementById(`invOk${idx}`).className = `inv-btn ${present ? 'inv-ok' : ''}`;
    document.getElementById(`invMiss${idx}`).className = `inv-btn ${!present ? 'inv-miss' : ''}`;
    const cnt = document.getElementById(`invCnt${idx}`); if (cnt) cnt.className = 'inv-btn';
    const info = document.getElementById(`invCountInfo${idx}`); if (info) info.innerHTML = '';
  },

  /* v1.7.0 — conta fisica diversa: applica delta qty (FIX+/FIX- con qty_delta) */
  async _invCount(idx) {
    if (!this._invState) return;
    const it = this._invState.items[idx];
    const sysQty = it.qty || 1;
    const inp = await Dialog.qty({
      title: 'Conta fisica',
      message: 'Inserire il numero di colli effettivamente contati a scaffale.',
      details: Dialog.kv([
        ['Articolo', it.article_code],
        ['Lotto', it.lot_code],
        ['Quantità a sistema', `${sysQty} Coll.`]
      ]),
      value: sysQty, min: 0, max: 99999
    });
    if (inp === null) return;
    const counted = parseInt(inp);
    if (isNaN(counted) || counted < 0) return this.toast('Numero non valido', 'error');
    it.counted_qty = counted;
    it.checked = true;
    if (counted === 0) {
      it.confirmed = false; it.missing = true;
    } else if (counted === sysQty) {
      it.confirmed = true; it.missing = false;
    } else {
      it.confirmed = false; it.missing = false;  // delta non-zero
    }
    const row = document.getElementById(`invRow${idx}`);
    const delta = counted - sysQty;
    let cls = 'inv-row-confirmed';
    if (counted === 0) cls = 'inv-row-missing';
    else if (delta !== 0) cls = '';
    row.className = `inv-item-row ${cls}`;
    document.getElementById(`invOk${idx}`).className = 'inv-btn';
    document.getElementById(`invMiss${idx}`).className = 'inv-btn';
    const cnt = document.getElementById(`invCnt${idx}`); if (cnt) cnt.className = 'inv-btn inv-ok';
    const info = document.getElementById(`invCountInfo${idx}`);
    if (info) {
      const sign = delta > 0 ? '+' : '';
      const color = delta === 0 ? 'var(--sx-success)' : (delta > 0 ? 'var(--sx-warning)' : 'var(--sx-danger)');
      info.innerHTML = ` · Contati: <strong style="color:${color}">${counted} (${sign}${delta})</strong>`;
    }
  },

  _invAddExtra() {
    if (!this._invState) return;
    const art = Validate.clean(document.getElementById('mInvExtraArt')?.value, true);
    const lot = Validate.clean(document.getElementById('mInvExtraLot')?.value);
    const qtyRaw = document.getElementById('mInvExtraQty')?.value;
    const qty = parseInt(qtyRaw);
    const errs = [Validate.article(art), Validate.lot(lot)].filter(Boolean);
    if (errs.length) return this.toast(errs[0], 'error');
    if (!qty || qty < 1) return this.toast('Numero colli non valido (minimo 1)', 'error');
    // Check articolo esistente per descrizione
    const artInfo = Store.getArticle(art);
    if (!artInfo) return this.toast(`Articolo ${art} non in anagrafica. Usa Configurazione o "Posiziona" per crearlo`, 'error');
    // Evita duplicato extras
    if (this._invState.extras.find(e => e.article_code === art && e.lot_code === lot)) return this.toast('Item già nella lista extra', 'warning');
    this._invState.extras.push({ article_code: art, article_description: artInfo.description, lot_code: lot, qty });
    document.getElementById('mInvExtraArt').value = '';
    document.getElementById('mInvExtraLot').value = '';
    document.getElementById('mInvExtraQty').value = '1';
    this._renderInvExtras();
    document.getElementById('mInvExtraArt').focus();
  },

  _renderInvExtras() {
    const el = document.getElementById('mInvExtras');
    if (!this._invState?.extras.length) { el.innerHTML = ''; return; }
    let html = '';
    this._invState.extras.forEach((ex, idx) => {
      const exQty = ex.qty || 1;
      html += `<div class="inv-item-row inv-row-extra">
        <div class="inv-info">
          <div class="inv-code" style="color:var(--sx-warning)">${this._esc(ex.article_code)} <span style="font-weight:400">${this._esc(ex.article_description || '')}</span></div>
          <div class="inv-lot">Lotto: ${this._esc(ex.lot_code)} · <strong style="color:var(--sx-warning)">${exQty} Coll.</strong></div>
        </div>
        <button class="btn btn-sm btn-danger btn-icon" onclick="App._invRemoveExtra(${idx})">✕</button>
      </div>`;
    });
    el.innerHTML = html;
  },

  _invRemoveExtra(idx) { if (this._invState) { this._invState.extras.splice(idx,1); this._renderInvExtras(); } },

  /* Fix B2: alert item non verificati
     v1.7.0: gestione conta fisica diversa con FIX+/FIX- e qty_delta. */
  async _execInventario() {
    if (!this._requireOperator('le rettifiche inventariali')) return;   // v2.0.1 [B7]
    if (!this._invState) return;
    const { loc, items, extras } = this._invState;
    const unchecked = items.filter(i => !i.checked);
    if (unchecked.length > 0) {
      const msg = `⚠ ${unchecked.length} item non verificati.\n\nOK = considera quantità di sistema CORRETTE (nessuna azione)\nAnnulla = torna alla verifica`;
      if (!await Dialog.confirm({
        title: 'Item non verificati',
        message: msg,
        confirmLabel: 'Considera corrette le quantità di sistema',
        cancelLabel: 'Torna alla verifica',
        danger: true
      })) return;
    }
    let corrections = 0;
    for (const it of items) {
      const sysQty = it.qty || 1;
      // Caso 1: missing totale → FIX- intero
      if (it.missing) {
        const removed = await Store.removeItem(loc, it.item_key);
        if (removed) {
          await this._logMov(MOV.FIX_OUT, it.article_code, it.article_description, it.lot_code, loc, null, Store.getCurrentIdentity().initials, 'Mancante a inventario', '', sysQty, -sysQty, 0);   // v2.0.1 [B7] operatore esplicito
          corrections++;
        }
      }
      // Caso 2: conta fisica diversa (counted_qty != null)
      else if (typeof it.counted_qty === 'number') {
        const delta = it.counted_qty - sysQty;
        if (delta === 0) continue;  // nessuna azione
        if (delta < 0) {
          // FIX-: rimuovi |delta| colli
          const removed = await Store.removeItem(loc, it.item_key, Math.abs(delta));
          if (removed) {
            await this._logMov(MOV.FIX_OUT, it.article_code, it.article_description, it.lot_code, loc, null, Store.getCurrentIdentity().initials, `Conta fisica: ${it.counted_qty}/${sysQty}`, '', sysQty, delta, it.counted_qty);   // v2.0.1 [B7]
            corrections++;
          }
        } else {
          // FIX+: aggiungi delta colli (incrementa record esistente)
          const res = await Store.addItem(loc, it.article_code, it.article_description, it.lot_code, it.expiry_date || '', '', delta);
          if (res.ok) {
            await this._logMov(MOV.FIX_IN, it.article_code, it.article_description, it.lot_code, loc, null, Store.getCurrentIdentity().initials, `Conta fisica: ${it.counted_qty}/${sysQty}`, '', sysQty, delta, it.counted_qty);   // v2.0.1 [B7]
            corrections++;
          }
        }
      }
      // Caso 3: confirmed=true → nessuna azione
    }
    // Extras: nuovi item trovati fisicamente
    for (const ex of extras) {
      const exQty = ex.qty || 1;
      const res = await Store.addItem(loc, ex.article_code, ex.article_description, ex.lot_code, '', '', exQty);
      if (res.ok) {
        await this._logMov(MOV.FIX_IN, ex.article_code, ex.article_description, ex.lot_code, loc, null, Store.getCurrentIdentity().initials, 'Item extra trovato a inventario', '', res.qty_before, exQty, res.qty_after);   // v2.0.1 [B7]
        corrections++;
      }
    }
    if (corrections === 0) this.toast('Nessuna correzione — inventario confermato ✓', 'info');
    else this.toast(`✓ ${corrections} correzion${corrections === 1 ? 'e applicata' : 'i applicate'}`, 'success');
    this.updateSyncIndicator();
    this._invState = null;
    this._loadInv();
    this._refreshSessionLog();
  },

  // v1.8.0: identificazione obbligatoria con ARTICOLO + LOTTO
  _qLookup() {
    const art = Validate.clean(document.getElementById('pQArt')?.value, true);
    const lot = Validate.clean(document.getElementById('pQLot')?.value);
    const info = document.getElementById('pQInfo');
    const form = document.getElementById('pQForm');
    if (!art) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Scansiona prima il codice articolo</div>`;
      document.getElementById('pQArt')?.focus();
      return;
    }
    if (!lot) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Scansiona il codice lotto — entrambi i campi sono obbligatori</div>`;
      document.getElementById('pQLot')?.focus();
      return;
    }
    const allItems = Store.findItemLocations(art);
    const matched = allItems.filter(it => it.lot_code === lot);
    if (!matched.length) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Item ${this._esc(art)}#${this._esc(lot)} non trovato in magazzino</div>`;
      form.style.display = 'none';
      return;
    }
    const available = matched.filter(it => !Store.isItemQuarantined(it.item_key));
    if (!available.length) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-purple);margin-top:0.2rem">⚠ L'item ${this._esc(art)}#${this._esc(lot)} è già in quarantena</div>`;
      form.style.display = 'none';
      return;
    }
    if (available.length === 1) { this._qSelectItem(available[0]); return; }
    // Stesso articolo+lotto in più ubicazioni → selezione ubicazione
    let html = '<div style="max-height:180px;overflow-y:auto;margin-top:0.3rem"><div style="font-size:0.68rem;color:var(--sx-text-muted);margin-bottom:0.3rem">Stesso item in più ubicazioni — seleziona la partenza:</div>';
    for (const it of available) {
      const p = App._payload(it);
      html += `<div class="inv-item-row" style="cursor:pointer" onclick="App._qSelectEnc('${p}')">
        <div class="inv-info">
          <div class="inv-code" style="color:var(--sx-purple)">${this._esc(it.article_code)} <span style="color:var(--sx-text-muted);font-weight:400;font-size:0.72rem">${this._esc(it.article_description || '')}</span></div>
          <div class="inv-lot">L:${this._esc(it.lot_code)} · 📍 ${this._esc(it.location_code)}</div>
        </div>
        <span style="color:var(--sx-purple);font-size:0.72rem">🚫 Blocca</span>
      </div>`;
    }
    info.innerHTML = html + '</div>';
    form.style.display = 'none';
  },

  _qSelectItem(item) {
    // Verifica esistenza
    const full = Store.getItemsAtLocation(item.location_code).find(i => i.item_key === item.item_key);
    if (!full) return this.toast('Item non più disponibile', 'error');
    this._qState = { item: full };

      <strong style="color:var(--sx-purple)">${this._esc(full.article_code)}</strong>

    </div>`;
    const nearest = Store.findNearestBlockedLocation(full.location_code);
    this._qState.nearestBlocked = nearest;
    const bi = document.getElementById('pQBlockedInfo');

      bi.innerHTML = `<div class="mov-preview mov-preview-err" style="margin-bottom:0.5rem">

      </div>`;
    } else {
      bi.innerHTML = `<div class="mov-preview mov-preview-warn" style="margin-bottom:0.5rem">

    document.getElementById('pQReason')?.focus();
  },

  /* ═══════════════════════════════════════════════════════════════════
     v2.7.0 [G5] — IL BLOCCO QUALITA' HA UN SOLO CORPO
     © Andrea Sacchetti — Dietopack S.r.l.

     Come per il cambio ubicazione: due porte, un solo corpo. Il form di
     Movimenta identifica l'item scansionando articolo e lotto; la scheda
     dell'ubicazione ce l'ha gia' in mano. Da qui in giu' e' identico alla
     v2.6.0, decisione 3-c compresa: lo spostamento in area NC viene SEMPRE
     tentato e blocked_location riporta sempre la posizione REALE.

     Ritorna { ok:true, record, blockedLoc, moved } oppure { ok:false }.
     ═══════════════════════════════════════════════════════════════════ */
  async _quarantineItemCore(item, { reason, operator, refDept, refPerson = '', nearest = undefined }) {
    const errs = [Validate.reason(reason), Validate.operator(operator), Validate.refDept(refDept)].filter(Boolean);
    if (errs.length) { this.toast(errs[0], 'error'); return { ok: false }; }
    if (nearest === undefined) nearest = Store.findNearestBlockedLocation(item.location_code);
    const backup = { ...item };

    /* ═══════════════════════════════════════════════════════════════════
       v2.0.1 [B1] — COERENZA TRA UBICAZIONE DICHIARATA E POSIZIONE REALE
       © Andrea Sacchetti — Dietopack S.r.l.

       PRIMA: lo spostamento avveniva solo con `nearest && !nearest.hasItems`,
       ma blocked_location veniva comunque valorizzata con nearest.code.
       Se l'area NC era già occupata — cioè quasi sempre, in un magazzino reale —
       il sistema dichiarava la merce in quarantena in un'ubicazione dove non era
       mai arrivata, lasciandola di fatto in ubicazione produttiva. Il record
       risultava formalmente corretto e sostanzialmente falso: il difetto più
       grave dell'intera v2.0.0 in ottica audit.

       ORA (decisione 3-c): l'ubicazione NC accoglie più item, quindi lo
       spostamento viene SEMPRE tentato. Se non esiste alcuna ubicazione
       bloccata configurata, la merce resta dov'è e blocked_location riporta
       l'ubicazione REALE, che viene contestualmente marcata come bloccata.
       In nessun caso il record dichiara una posizione diversa da quella vera.
       ═══════════════════════════════════════════════════════════════════ */
    let blockedLoc;
    let moved = false;
    if (nearest) {
      const qtyToMove = item.qty || 1;
      const removed = await Store.removeItem(item.location_code, item.item_key);
      if (!removed) { this.toast('Item non più disponibile — operazione annullata', 'error'); return { ok: false }; }
      try {
        const res = await Store.addItem(nearest.code, item.article_code, item.article_description, item.lot_code, item.expiry_date || '', 'QUARANTENA: ' + reason, qtyToMove);
        if (!res.ok) throw new Error('addItem non riuscito');
        moved = true;
        blockedLoc = nearest.code;
        await this._logMov(MOV.MOVE, item.article_code, item.article_description, item.lot_code, item.location_code, nearest.code, operator, 'Spostamento in quarantena', '', qtyToMove, 0, qtyToMove);
      } catch (err) {
        await Store.restoreItem(backup);
        this.toast(`Spostamento in area NC fallito (${err.message || 'errore'}) — operazione annullata, nessuna quarantena registrata`, 'error');
        return { ok: false };
      }
    } else {
      // Nessuna ubicazione NC configurata: la merce resta dov'è e QUELLA ubicazione
      // viene bloccata. Il record resta veritiero, il blocco è comunque effettivo.
      blockedLoc = item.location_code;
      try {
        await Store.setLocationStatus(item.location_code, 'blocked', `QUARANTENA ${item.article_code}#${item.lot_code}: ${reason}`);
      } catch (err) {
        console.error('[WM] blocco ubicazione origine:', err);
      }
    }

    // Crea record quarantena
    const qRecord = await Store.quarantineItem({
      item_key: item.item_key,
      article_code: item.article_code,
      article_description: item.article_description || '',
      lot_code: item.lot_code,
      original_location: item.location_code,
      blocked_location: blockedLoc,
      reason, operator, reference_dept: refDept, reference_person: refPerson
    });

    await this._logMov(MOV.QUAR, item.article_code, item.article_description, item.lot_code, item.location_code, blockedLoc, operator, reason);
    // v2.0.1 [B1] — il messaggio riflette la posizione REALE registrata
    this.toast(`🚫 ${item.article_code}#${item.lot_code} in QUARANTENA → ${blockedLoc}`, 'success');
    if (moved) {
      this.toast(`⚠ Trasferire FISICAMENTE la merce da ${item.location_code} a ${blockedLoc}`, 'warning');
    } else {
      this.toast(`⚠ Nessuna ubicazione NC configurata: ${blockedLoc} è stata BLOCCATA e la merce resta qui`, 'warning');
    }
    this.updateSyncIndicator();

    // Stampa automatica cartello NC
    this._printNCCardFromRecord(qRecord);
    this._refreshSessionLog();
    return { ok: true, record: qRecord, blockedLoc, moved };
  },

  /* Fix B4: rollback preserva metadati.
     v2.7.0 [G5]: il corpo e' in _quarantineItemCore(); qui resta la porta
     d'ingresso del form di Movimenta — lettura dei campi e reset. */
  async _execQuarantena() {
    if (!this._requireOperator('la messa in quarantena')) return;   // v2.0.1 [B7]
    if (!this._qState?.item) return this.toast('Seleziona un item', 'error');
    const out = await this._quarantineItemCore(this._qState.item, {
      reason:    Validate.clean(document.getElementById('pQReason')?.value),
      operator:  Validate.clean(document.getElementById('pQOperator')?.value),
      refDept:   Validate.clean(document.getElementById('pQRefDept')?.value),
      refPerson: Validate.clean(document.getElementById('pQRefPerson')?.value),
      nearest:   this._qState.nearestBlocked
    });
    if (!out.ok) return;
    this._qState = null;
    this._formQuarantena(document.getElementById('movFormArea'));
  },

  // Un item conforme non può stazionare in un'ubicazione bloccata o NC.
  async _releaseQuarantine(q_id) {
    if (!await Dialog.confirm({
      title: 'Rilasciare l\u2019item dalla quarantena?',
      message: 'Dopo il rilascio sarà obbligatorio scansionare un\u2019ubicazione di destinazione CONFORME (non bloccata) dove riposizionare l\u2019item.',
      confirmLabel: 'Rilascia',
      icon: '\u2705'
    })) return;

    // Recupera il record di quarantena
    const allQ = Store.getQuarantineHistory();
    const qRec = allQ.find(q => q.q_id === q_id);
    if (!qRec) return this.toast('Record quarantena non trovato', 'error');

    // Mostra il dialog per scansione ubicazione destinazione
    this._showReleaseDestDialog(q_id, qRec);
  },

  /* Esegue il rilascio e lo spostamento fisico verso l'ubicazione destinazione conforme. */
  async _execReleaseDest(q_id) {
    if (!this._requireOperator('il rilascio dalla quarantena')) return;   // v2.0.1 [B7]
    const dest = Validate.clean(document.getElementById('releaseDestLoc')?.value, true)?.replace(/'/g, '-');
    if (!dest) return this.toast('Scansiona l\'ubicazione di destinazione', 'error');
    const locErr = Validate.location(dest);
    if (locErr) return this.toast(locErr, 'error');
    if (!Store.locationExists(dest)) return this.toast(`Ubicazione ${dest} non trovata — scansiona un\'ubicazione valida`, 'error');

    // Blocco critico: l'ubicazione destinazione NON può essere bloccata o riservata NC
    const destStatus = Store.getLocationStatus(dest);
    if (destStatus === 'blocked') {
      return this.toast(`❌ UBICAZIONE BLOCCATA — ${dest} non è idonea per item conformi. Scansiona un\'ubicazione libera o occupata normale.`, 'error');
    }
    if (destStatus === 'disabled') {
      return this.toast(`❌ Ubicazione ${dest} disattivata. Scansiona un\'ubicazione attiva.`, 'error');
    }

    // v2.0.1 [B6] — identificazione obbligatoria: esecutore + responsabile
    const relOperator = Validate.clean(document.getElementById('releaseOperator')?.value);
    const relRefPerson = Validate.clean(document.getElementById('releaseRefPerson')?.value);
    const relErr = Validate.operator(relOperator);
    if (relErr) return this.toast(`Operatore esecutore: ${relErr}`, 'error');
    if (!relRefPerson) return this.toast('Indicare il responsabile che autorizza il rilascio', 'error');
    if (relRefPerson.length > Validate.MAX.OPERATOR) return this.toast(`Responsabile: max ${Validate.MAX.OPERATOR} caratteri`, 'error');

    // Rilascia il record di quarantena nel DB
    const rec = await Store.releaseQuarantine(q_id, { released_by: relOperator, released_ref_person: relRefPerson });
    if (!rec) return this.toast('Rilascio quarantena fallito', 'error');

    // Determina la posizione attuale dell'item (blocked_location o original_location)
    const currentLoc = rec.blocked_location !== 'DA DEFINIRE' ? rec.blocked_location : rec.original_location;
    const itemKey = rec.item_key;

    // Sposta l'item dall'ubicazione bloccata alla destinazione conforme
    let moved = false;
    let moveErr = '';
    const srcItems = Store.getItemsAtLocation(currentLoc);
    const srcItem = srcItems.find(i => i.item_key === itemKey);

    if (srcItem) {
      const qtyToMove = srcItem.qty || 1;
      const backup = { ...srcItem };
      const removed = await Store.removeItem(currentLoc, itemKey);
      if (removed) {
        const res = await Store.addItem(dest, srcItem.article_code, srcItem.article_description, srcItem.lot_code, srcItem.expiry_date || '', (srcItem.notes || '').replace(/^QUARANTENA:\s*/i, '').trim(), qtyToMove);
        if (res.ok) {
          moved = true;
          await this._logMov(MOV.MOVE, srcItem.article_code, srcItem.article_description, srcItem.lot_code, currentLoc, dest, relOperator, 'Rilascio quarantena → riposizionamento conforme', rec.q_id, qtyToMove, 0, qtyToMove);   // v2.0.1 [B6]
        } else {
          await Store.restoreItem(backup);
          moveErr = `Impossibile posizionare in ${dest} — item ripristinato in ${currentLoc}`;
        }
      } else {
        moveErr = `Item non trovato fisicamente in ${currentLoc} — aggiorna manualmente l\'ubicazione`;
      }
    } else {
      moveErr = `Item non trovato in ${currentLoc} — verifica manualmente l\'ubicazione fisica`;
    }

    // v2.0.1 [B6] — prima questo movimento veniva registrato senza operatore
    await this._logMov(MOV.Q_REL, rec.article_code, rec.article_description, rec.lot_code, currentLoc, dest,
      relOperator, `Rilascio autorizzato da: ${relRefPerson}`, rec.q_id);

    document.getElementById('releaseDestOverlay')?.remove();
    if (moved) {
      this.toast(`✓ ${rec.article_code}#${rec.lot_code} rilasciato e spostato in ${dest}`, 'success');
    } else {
      this.toast(`✓ ${rec.article_code}#${rec.lot_code} rilasciato${moveErr ? ` — ⚠ ${moveErr}` : ''}`, moveErr ? 'warning' : 'success');
    }
    this._formQuarantena(document.getElementById('movFormArea'));
    this._refreshSessionLog();
  },

            <div class="form-row" style="margin-bottom:0">

                <label>📅 Data Ritiro Prevista <span style="font-size:0.65rem;color:var(--sx-text-muted);font-weight:400">(consigliato per alert)</span></label>
                <input class="input" type="text" inputmode="numeric" placeholder="gg/mm/aaaa" maxlength="10" id="pResExpected" value="${this._esc(this._dateISOtoIT(this._returnsExpectedDate))}"
                  oninput="App._dateMaskInput(this)" onblur="App._dateMaskBlur(this)"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();App._dateMaskBlur(this);App._persistResiHeader();document.getElementById('pResCarrier')?.focus();}">
              </div>
              <div class="form-group">
                <label>Vettore (opz.)</label>
                <input class="input" id="pResCarrier" placeholder="Es: BRT, GLS, vettore proprio" maxlength="${Validate.MAX.OPERATOR}" value="${this._esc(this._returnsCarrier)}"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();App._returnsCarrier=this.value;document.getElementById('pResArt')?.focus();}">
              </div>
            </div>
          </div>
          <!-- INSERIMENTO RIGA -->
          <div class="form-group" style="margin-bottom:0.4rem">
            <label>① Scansiona Articolo <span class="req">*</span></label>
            <input class="input input-mono" id="pResArt" placeholder="Scansiona barcode articolo" maxlength="${Validate.MAX.ARTICLE_CODE}" style="text-transform:uppercase"
              onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('pResLot')?.focus();}">
          </div>
          <div class="form-group" style="margin-bottom:0.4rem">
            <label>② Scansiona Lotto <span class="req">*</span></label>
            <input class="input input-mono" id="pResLot" placeholder="Scansiona barcode lotto" maxlength="${Validate.MAX.LOT_CODE}"
              onkeydown="if(event.key==='Enter'){event.preventDefault();App._resiLookup();}">
            <div id="pResInfo"></div>
          </div>
          <div id="pResDetails" class="hidden">
            <div id="pResItemPreview"></div>
            <div style="display:flex;gap:0.4rem;margin-bottom:0.4rem;align-items:flex-end">
              <div class="form-group" style="width:130px"><label>Qty da rendere <span class="req">*</span></label><input class="input input-mono" id="pResQty" type="number" min="1" step="1" value="1" style="text-align:center;font-weight:700"
                onkeydown="if(event.key==='Enter'){event.preventDefault();App._resiAddToCart();}"></div>
              <div style="font-size:0.7rem;color:var(--sx-text-muted);padding-bottom:0.4rem">Disponibili (esclusi pendenti): <strong id="pResAvail" style="color:var(--sx-teal)">—</strong> Coll.</div>
            </div>
            <div class="form-group" style="margin-bottom:0.5rem">
              <label>Note riga (opz.)</label>
              <input class="input" id="pResNotes" maxlength="${Validate.MAX.NOTES}" placeholder="Es: motivo del reso, riferimento DDT origine">
            </div>
            <button class="btn" style="width:100%;background:var(--sx-teal);color:#fff;border-color:var(--sx-teal);padding:0.5rem;font-weight:700" onclick="App._resiAddToCart()">+ AGGIUNGI AL CARRELLO</button>
          </div>
          <!-- CARRELLO — v2.1.0: sezione autonoma, aggiornata senza ridisegno del modulo -->
          <section id="resCartZone">${this._resiCartZoneHTML()}</section>
          <div id="pResFeedback" style="margin-top:0.4rem"></div>
        </div>
      </details>
      <div style="margin-top:0.6rem"><button class="btn" onclick="App.cancelMov()">✕ Chiudi</button></div>
    </div>`;
    if (!cart.length && !pending.length) document.getElementById('pResDdt')?.focus();
  },

  /* Rendering della lista DDT pendenti per i Resi (analogo a renderQuarantineList).
     Ogni documento mostra: testata + righe + bottoni EVADI/STAMPA/ANNULLA.
     v2.0.0+ — Ordinamento per priorità alert: SCADUTI in cima, poi urgenti, poi resto. */
  _renderPendingResiList(pending) {
    if (!pending.length) {
      return `<div style="padding:0.5rem 0.7rem;background:var(--sx-card-alt);border:1px dashed var(--sx-border);border-radius:var(--radius);font-size:0.74rem;color:var(--sx-text-muted);text-align:center">Nessun DDT reso pendente — registrane uno nuovo qui sotto</div>`;
    }
    // v2.0.0+ — sort by alert priority (sortKey ascending: overdue/today/tomorrow/soon/ok/none)
    const sorted = pending.slice().sort((a, b) => {
      const sa = pickupAlertStatus(a).sortKey;
      const sb = pickupAlertStatus(b).sortKey;
      if (sa !== sb) return sa - sb;
      return b.created_at - a.created_at;  // a parità → più recente in alto
    });
    return sorted.map(d => this._renderPendingDocCard(d, 'RES')).join('');
  },

  /* Lookup item in giacenza per il reso pendente.
     Esclude: quarantena, qty completamente già prenotata in altri DDT pendenti. */
  _resiLookup() {
    const art = Validate.clean(document.getElementById('pResArt')?.value, true);
    const lot = Validate.clean(document.getElementById('pResLot')?.value);
    const info = document.getElementById('pResInfo');
    const details = document.getElementById('pResDetails');
    if (!art) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Scansiona prima il codice articolo</div>`;
      document.getElementById('pResArt')?.focus();
      return;
    }
    if (!lot) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Scansiona il codice lotto — entrambi i campi sono obbligatori</div>`;
      document.getElementById('pResLot')?.focus();
      return;
    }
    const artErr = Validate.article(art);
    if (artErr) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ ${this._esc(artErr)}</div>`; details.classList.add('hidden'); return; }
    const lotErr = Validate.lot(lot);
    if (lotErr) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ ${this._esc(lotErr)}</div>`; details.classList.add('hidden'); return; }
    const allItems = Store.findItemLocations(art);
    const matched = allItems.filter(it => it.lot_code === lot);
    if (!matched.length) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Item ${this._esc(art)}#${this._esc(lot)} non trovato in magazzino</div>`;
      details.classList.add('hidden');
      return;
    }
    const notQuar = matched.filter(it => !Store.isItemQuarantined(it.item_key));
    if (!notQuar.length) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-purple);margin-top:0.2rem">⚠ L'item ${this._esc(art)}#${this._esc(lot)} è in quarantena — non utilizzabile per reso</div>`;
      details.classList.add('hidden');
      return;
    }
    // Calcola qty disponibile per ciascuna ubicazione = qty totale - qty già prenotata (pending) - qty già nel carrello corrente
    const inCartByKey = {};
    for (const c of this._returnsCart) {
      const k = `${c.location_code}#${c.item_key}`;
      inCartByKey[k] = (inCartByKey[k] || 0) + c.qty;
    }
    const enriched = notQuar.map(it => {
      const totalQty = it.qty || 1;
      const pendingQty = Store.getPendingQtyForItem(it.location_code, it.item_key);
      const cartQty = inCartByKey[`${it.location_code}#${it.item_key}`] || 0;
      const availableQty = Math.max(0, totalQty - pendingQty - cartQty);
      return { ...it, _totalQty: totalQty, _pendingQty: pendingQty, _availableQty: availableQty };
    });
    const usable = enriched.filter(it => it._availableQty > 0);
    if (!usable.length) {
      info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-warning);margin-top:0.2rem">⚠ Tutta la giacenza di ${this._esc(art)}#${this._esc(lot)} è già impegnata (DDT pendenti / carrello)</div>`;
      details.classList.add('hidden');
      return;
    }
    if (usable.length === 1) { this._resiSelectItem(usable[0]); return; }
    let html = '<div style="max-height:200px;overflow-y:auto;margin-top:0.3rem"><div style="font-size:0.68rem;color:var(--sx-text-muted);margin-bottom:0.3rem">Item presente in più ubicazioni — seleziona da quale prelevare:</div>';
    for (const it of usable) {
      const p = App._payload(it);
      const pendBadge = it._pendingQty > 0 ? ` <span class="badge badge-amber">${it._pendingQty} prenotati</span>` : '';
      html += `<div class="inv-item-row" style="cursor:pointer" onclick="App._resiSelectEnc('${p}')">
        <div class="inv-info">
          <div class="inv-code" style="color:var(--sx-teal)">${this._esc(it.article_code)} <span style="color:var(--sx-text-muted);font-weight:400;font-size:0.72rem">${this._esc(it.article_description || '')}</span></div>
          <div class="inv-lot">L:${this._esc(it.lot_code)} · 📍 ${this._esc(it.location_code)} · <strong>${it._availableQty}/${it._totalQty} Coll. dispon.</strong>${pendBadge}${it.expiry_date ? ` · scad. ${this._esc(it.expiry_date)}` : ''}</div>
        </div>
        <span style="color:var(--sx-teal);font-size:0.72rem">↩️ Seleziona</span>
      </div>`;
    }
    info.innerHTML = html + '</div>';
    details.classList.add('hidden');
  },

  _resiSelectEnc(p) { this._resiSelectItem(JSON.parse(decodeURIComponent(p))); },

  _resiSelectItem(item) {
    // Re-verify availability live
    const full = Store.getItemsAtLocation(item.location_code).find(i => i.item_key === item.item_key);
    if (!full) return this.toast('Item non più disponibile in giacenza', 'error');
    const totalQty = full.qty || 1;
    const pendingQty = Store.getPendingQtyForItem(item.location_code, item.item_key);
    const cartQty = this._returnsCart
      .filter(c => c.location_code === item.location_code && c.item_key === item.item_key)
      .reduce((s, c) => s + c.qty, 0);
    const availableQty = Math.max(0, totalQty - pendingQty - cartQty);
    if (availableQty <= 0) {
      document.getElementById('pResInfo').innerHTML = `<div style="font-size:0.75rem;color:var(--sx-warning);margin-top:0.2rem">⚠ Giacenza tutta impegnata in DDT pendenti / carrello</div>`;
      return;
    }
    this._returnsState = { item: full, availableQty, totalQty, pendingQty };
    const expBadge = full.expiry_date ? ` · scad. ${this._esc(full.expiry_date)}` : '';
    const pendBadge = pendingQty > 0 ? ` · <span style="color:var(--sx-warning)">${pendingQty} prenotati</span>` : '';
    document.getElementById('pResInfo').innerHTML = '';
    document.getElementById('pResItemPreview').innerHTML = `<div class="mov-preview" style="background:var(--grad-soft-teal);border-color:var(--sx-teal);margin-bottom:0.4rem">
      <strong style="color:var(--sx-teal)">${this._esc(full.article_code)}</strong>
      <span style="color:var(--sx-text-muted)">${this._esc(full.article_description || '')}</span><br>
      <span style="font-size:0.72rem;color:var(--sx-text-muted)">Lotto: <strong>${this._esc(full.lot_code)}</strong> · Ubic: <strong class="mono">${this._esc(full.location_code)}</strong> · Disp. effettiva: <strong style="color:var(--sx-teal)">${availableQty} Coll.</strong> (tot. ${totalQty}${pendBadge})${expBadge}</span>
    </div>`;
    const qe = document.getElementById('pResQty');
    if (qe) { qe.value = availableQty; qe.max = availableQty; }
    const av = document.getElementById('pResAvail'); if (av) av.textContent = availableQty;
    const notesEl = document.getElementById('pResNotes'); if (notesEl) notesEl.value = '';
    document.getElementById('pResDetails').classList.remove('hidden');
    qe?.focus();
    qe?.select();
  },

  _resiAddToCart() {
    if (!this._returnsState?.item) return this.toast('Identifica prima un item in giacenza', 'error');
    const item = this._returnsState.item;
    const availableQty = this._returnsState.availableQty;
    const notes = Validate.clean(document.getElementById('pResNotes')?.value);
    const qtyRaw = document.getElementById('pResQty')?.value;
    const qty = parseInt(qtyRaw);
    if (!qty || qty < 1) return this.toast('Numero di colli non valido (minimo 1)', 'error');
    if (qty > availableQty) return this.toast(`Qty richiesta (${qty}) supera la disponibilità effettiva (${availableQty})`, 'error');
    if (Validate.notes(notes)) return this.toast(Validate.notes(notes), 'error');
    if (!this._returnsCart.length && !this._returnsStartTime) this._returnsStartTime = Date.now();
    this._returnsCart.push({
      article_code: item.article_code,
      article_description: item.article_description || '',
      lot_code: item.lot_code,
      location_code: item.location_code,
      item_key: item.item_key,
      expiry_date: item.expiry_date || '',
      qty,
      qty_at_creation: availableQty,
      notes
    });
    this.toast(`+ ${item.article_code}#${item.lot_code} (${qty}/${availableQty} Coll.) da ${item.location_code}`, 'success');
    for (const id of ['pResArt','pResLot','pResNotes']) { const e = document.getElementById(id); if (e) e.value = ''; }
    const qe = document.getElementById('pResQty'); if (qe) qe.value = '1';
    document.getElementById('pResItemPreview').innerHTML = '';
    document.getElementById('pResDetails')?.classList.add('hidden');
    this._returnsState = null;
    this._persistResiHeader();
    this._updateResiCart();
    this.setPrimaryScanField('pResArt');
  },

  _persistResiHeader() {
    this._returnsDdtNum = Validate.clean(document.getElementById('pResDdt')?.value) || this._returnsDdtNum;
    this._returnsSupplier = Validate.clean(document.getElementById('pResSupplier')?.value) || this._returnsSupplier;
    this._returnsCarrier = Validate.clean(document.getElementById('pResCarrier')?.value) || this._returnsCarrier;
    // v2.0.0+ — data di ritiro prevista (può essere svuotata, quindi NO || fallback)
    // v2.3.0 [D1] — il campo è in gg/mm/aaaa: lo stato interno resta ISO (pickupAlertStatus)
    const expectedEl = document.getElementById('pResExpected');
    if (expectedEl) {
      const iso = this._dateITtoISO(expectedEl.value, 'Data ritiro');
      this._returnsExpectedDate = iso === null ? '' : iso;
    }
  },

  _resiRemoveFromCart(idx) {
    this._returnsCart.splice(idx, 1);
    this._persistResiHeader();
    this._updateResiCart();
  },

  async _resiClearCart() {
    if (!await Dialog.confirm({
      title: 'Svuotare il carrello bozza?',
      message: 'Le righe inserite vengono eliminate. La testata del DDT viene mantenuta.',
      confirmLabel: 'Svuota', danger: true
    })) return;
    this._returnsCart = [];
    this._returnsStartTime = null;
    this._returnsState = null;
    this._persistResiHeader();
    this._updateResiCart();
  },

  /* v2.1.0 — contenuto della sola zona carrello resi */
  _resiCartZoneHTML() {
    const n = this._returnsCart.length;
    const totalColli = this._returnsCart.reduce((s, r) => s + (r.qty || 0), 0);
    return `<div style="display:flex;justify-content:space-between;align-items:center;margin:0.7rem 0 0.35rem">
        <strong style="font-size:0.92rem">🛒 Carrello Bozza <span style="color:var(--sx-teal)">(${n})</span>${n ? ` <span class="dlg-chip">${totalColli} Coll.</span>` : ''}</strong>
        ${n ? '<button class="btn btn-sm btn-ghost" onclick="App._resiClearCart()">Svuota</button>' : ''}
      </div>
      <div class="pick-cart">${this._renderResiCart()}</div>
      ${n ? `<button class="btn" style="width:100%;margin-top:0.6rem;font-weight:800;min-height:var(--md-touch);background:var(--sx-teal);color:#fff;border-color:var(--sx-teal)" onclick="App._saveResiPending()">📥 REGISTRA DDT PENDENTE (${n} righe)</button>` : ''}`;
  },

  _updateResiCart() {
    const zone = document.getElementById('resCartZone');
    if (zone) zone.innerHTML = this._resiCartZoneHTML();
    else this._formResi(document.getElementById('movFormArea'));   // ripiego
  },

  _renderResiCart() {
    if (!this._returnsCart.length) return '<div class="pick-cart-empty">Carrello vuoto — scansiona articolo e lotto, identifica in giacenza, poi aggiungi</div>';
    return this._returnsCart.map((it, i) => {
      const expBadge = it.expiry_date ? ` · scad. ${this._esc(it.expiry_date)}` : '';
      const notesBadge = it.notes ? ` · <span style="color:var(--sx-text-muted);font-style:italic">${this._esc(it.notes)}</span>` : '';
      const partial = it.qty < (it.qty_at_creation || it.qty) ? ` <span class="badge badge-amber" style="margin-left:0.2rem">PARZIALE</span>` : '';
      return `<div class="pick-cart-item" style="border-left:3px solid var(--sx-teal)">
        <div class="pci-num" style="background:var(--sx-teal)">${i+1}</div>
        <div class="pci-info">
          <div class="pci-code">${this._esc(it.article_code)} <span style="color:var(--sx-text-muted);font-weight:400;font-size:0.65rem">${this._esc(it.article_description || '')}</span>${partial}</div>
          <div class="pci-loc">L:${this._esc(it.lot_code)} · 📍 ${this._esc(it.location_code)} · <strong style="color:var(--sx-teal)">${it.qty} Coll.</strong>${expBadge}${notesBadge}</div>
        </div>
        <button class="btn btn-sm btn-ghost" style="color:var(--sx-danger)" onclick="App._resiRemoveFromCart(${i})">✕</button>
      </div>`;
    }).join('');
  },

  /* STATO 1 — Salva DDT come pendente. La merce NON viene scaricata.
     Ritorna il documento pendente creato. Ogni riga salvata come prenotazione
     della giacenza fino all'evasione. */
  async _saveResiPending() {
    if (!this._requireOperator('la registrazione del DDT di reso')) return;   // v2.0.1 [B7]
    if (!this._returnsCart.length) return this.toast('Carrello vuoto', 'error');
    this._persistResiHeader();
    if (!this._returnsDdtNum) { document.getElementById('pResDdt')?.focus(); return this.toast('N° DDT Reso obbligatorio', 'error'); }
    if (!this._returnsSupplier) { document.getElementById('pResSupplier')?.focus(); return this.toast('Destinatario / Fornitore obbligatorio', 'error'); }
    // Re-check: per ogni riga la giacenza deve essere ancora sufficiente
    for (let i = 0; i < this._returnsCart.length; i++) {
      const it = this._returnsCart[i];
      const cur = Store.getItemsAtLocation(it.location_code).find(x => x.item_key === it.item_key);
      if (!cur) return this.toast(`Riga ${i+1}: ${it.article_code}#${it.lot_code} non più in ${it.location_code}`, 'error');
      const totalQty = cur.qty || 1;
      const pendingQty = Store.getPendingQtyForItem(it.location_code, it.item_key);
      const otherCart = this._returnsCart
        .filter((x, j) => j !== i && x.location_code === it.location_code && x.item_key === it.item_key)
        .reduce((s, x) => s + x.qty, 0);
      const avail = totalQty - pendingQty - otherCart;
      if (it.qty > avail) return this.toast(`Riga ${i+1}: qty richiesta (${it.qty}) > disponibilità effettiva (${avail})`, 'error');
    }
    const totalColli = this._returnsCart.reduce((s, it) => s + (it.qty || 1), 0);
    // v2.0.0+ — warning se data ritiro è oggi/passata o non specificata
    let dateWarn = '';
    if (this._returnsExpectedDate) {
      const tmpDoc = { expected_pickup_date: this._returnsExpectedDate };
      const status = pickupAlertStatus(tmpDoc);
      if (status.level === 'overdue') dateWarn = `\n⚠ Data ritiro nel passato (${status.label})`;
      else if (status.level === 'today') dateWarn = `\n⚠ Data ritiro è OGGI`;
    } else {
      dateWarn = '\n⚠ Data ritiro non specificata (nessun alert sarà attivo)';
    }
    if (!await Dialog.confirm({
      title: 'Registrare il DDT reso come pendente?',
      message: `La merce RIMANE in giacenza, prenotata per l\u2019uscita. Al ritiro fisico del vettore usare "EVADI DDT".${dateWarn}`,
      details: Dialog.kv([
        ['N° DDT', this._returnsDdtNum],
        ['Destinatario', this._returnsSupplier],
        ['Vettore', this._returnsCarrier || null],
        ['Ritiro previsto', this._returnsExpectedDate ? new Date(this._returnsExpectedDate + 'T00:00:00').toLocaleDateString('it-IT') : 'non indicato'],
        ['Righe', this._returnsCart.length],
        ['Colli totali', totalColli]
      ]),
      confirmLabel: 'Registra DDT', icon: '\u{1F4E5}'
    })) return;
    try {
      const doc = await Store.savePendingOutbound({
        kind: 'RES',
        ddt_num: this._returnsDdtNum,
        destination: this._returnsSupplier,
        carrier: this._returnsCarrier,
        expected_pickup_date: this._returnsExpectedDate, // v2.0.0+
        operator: Store.getCurrentIdentity().initials,
        lines: this._returnsCart.slice()
      });
      this.toast(`✓ DDT Reso ${doc.ddt_num} registrato come pendente`, 'success');   // v2.2.1 [F4]
      this.updateSyncIndicator();
      // Reset carrello e testata (il DDT è stato salvato)
      this._returnsCart = [];
      this._returnsStartTime = null;
      this._returnsState = null;
      this._returnsDdtNum = '';
      this._returnsSupplier = '';
      this._returnsCarrier = '';
      this._returnsExpectedDate = '';   // v2.0.0+
      this._formResi(document.getElementById('movFormArea'));
    } catch (err) {
      this.toast(`Errore salvataggio: ${err.message || 'sconosciuto'}`, 'error');
    }
  },

  /* STATO 2 — EVASIONE: il vettore preleva la merce.
     Per ogni riga: removeItem dalla giacenza + log MOV.RET.
     In caso di errore: rollback + status documento resta 'pending'. */
  async _evadiResi(doc_id) {
    if (!this._requireOperator("l'evasione del DDT di reso")) return;   // v2.0.1 [B7]
    const doc = Store.getPendingDoc(doc_id);
    if (!doc || doc.status !== 'pending') return this.toast('Documento non trovato o già evaso', 'error');
    // Pre-check: tutte le righe devono avere giacenza sufficiente
    for (let i = 0; i < doc.lines.length; i++) {
      const l = doc.lines[i];
      const cur = Store.getItemsAtLocation(l.location_code).find(x => x.item_key === l.item_key);
      if (!cur) return this.toast(`Riga ${i+1}: ${l.article_code}#${l.lot_code} non più in giacenza in ${l.location_code} — annullare e ricreare il DDT`, 'error');
      if ((cur.qty || 1) < l.qty) return this.toast(`Riga ${i+1}: giacenza attuale (${cur.qty || 1}) < qty richiesta (${l.qty}) — verificare`, 'error');
    }
    const totalColli = doc.lines.reduce((s, l) => s + (l.qty || 1), 0);
    if (!await Dialog.confirm({
      title: 'Evadere il DDT reso?',
      message: 'La merce viene SCARICATA fisicamente dalla giacenza. Confermare solo a ritiro avvenuto.',
      details: Dialog.kv([
        ['N° DDT', doc.ddt_num],
        ['Destinatario', doc.destination],
        ['Righe', doc.lines.length],
        ['Colli totali', totalColli]
      ]),
      confirmLabel: 'Evadi e scarica', danger: true
    })) return;
    const reasonNotes = `RESO RITIRATO da ${doc.destination}${doc.carrier ? ' (vettore: ' + doc.carrier + ')' : ''}`;
    const performed = [];
    let failedAt = -1, failMsg = '';
    for (let i = 0; i < doc.lines.length; i++) {
      const l = doc.lines[i];
      try {
        // Snapshot pre-rimozione per rollback
        const before = Store.getItemsAtLocation(l.location_code).find(x => x.item_key === l.item_key);
        const backup = before ? { ...before } : null;
        const removed = await Store.removeItem(l.location_code, l.item_key, l.qty);
        if (!removed) { failedAt = i; failMsg = `Rimozione fallita (riga ${i+1})`; break; }
        performed.push({ backup, mode: removed._mode, location_code: l.location_code, item_key: l.item_key, qty_removed: l.qty, qty_before: removed._qty_before, qty_after: removed._qty_after });
      } catch (err) {
        failedAt = i;
        failMsg = `Errore riga ${i+1}: ${err.message || 'sconosciuto'}`;
        break;
      }
    }
    if (failedAt !== -1) {
      // Rollback
      for (let j = performed.length - 1; j >= 0; j--) {
        const p = performed[j];
        try {
          if (p.mode === 'full' && p.backup) await Store.restoreItem(p.backup);
          else if (p.backup) await Store.addItem(p.location_code, p.backup.article_code, p.backup.article_description, p.backup.lot_code, p.backup.expiry_date || '', p.backup.notes || '', p.qty_removed);
        } catch {}
      }
      return this.toast(`${failMsg} — rollback eseguito, DDT resta pendente`, 'error');
    }
    // Log movimenti
    for (let i = 0; i < doc.lines.length; i++) {
      const l = doc.lines[i];
      const p = performed[i];
      const itemNotes = l.notes ? `${reasonNotes} · ${l.notes}` : reasonNotes;
      await this._logMov(MOV.RET, l.article_code, l.article_description, l.lot_code, l.location_code, null, doc.operator || Store.getCurrentIdentity().initials, itemNotes, doc.ddt_num, p.qty_before, -p.qty_removed, p.qty_after);
    }
    // Aggiorna status documento → evaded
    await Store.updatePendingStatus(doc_id, 'evaded');
    this.toast(`✓ DDT ${doc.ddt_num} evaso · ${doc.lines.length} righe · ${totalColli} Coll. ritirati`, 'success');
    this.updateSyncIndicator();
    if (await Dialog.confirm({
      title: 'Stampare la ricevuta del reso?',
      confirmLabel: 'Stampa', cancelLabel: 'Non ora', icon: '\u{1F5A8}'
    })) this._printOutboundReport(doc_id);
    this._formResi(document.getElementById('movFormArea'));
    this._refreshSessionLog();
  },

  /* Annulla DDT pendente: status → cancelled, nessun movimento di giacenza. */
  async _cancelPendingResi(doc_id) {
    if (!this._requireOperator("l'annullamento del DDT")) return;   // v2.0.1 [B7]
    const doc = Store.getPendingDoc(doc_id);
    if (!doc) return this.toast('Documento non trovato', 'error');
    if (doc.status !== 'pending') return this.toast('Documento non più pendente', 'error');
    if (!await Dialog.confirm({
      title: 'Annullare il DDT reso?',
      message: 'Il documento viene chiuso senza movimentare la giacenza. La merce torna interamente disponibile.',
      details: Dialog.kv([['N° DDT', doc.ddt_num], ['Destinatario', doc.destination]]),
      confirmLabel: 'Annulla il DDT', cancelLabel: 'Mantieni', danger: true
    })) return;
    await Store.updatePendingStatus(doc_id, 'cancelled');
    this.toast(`✓ DDT ${doc.ddt_num} annullato`, 'success');
    this._formResi(document.getElementById('movFormArea'));
  },

  _renderPendingShipList(pending) {
    if (!pending.length) {
      return `<div style="padding:0.5rem 0.7rem;background:var(--sx-card-alt);border:1px dashed var(--sx-border);border-radius:var(--radius);font-size:0.74rem;color:var(--sx-text-muted);text-align:center">Nessun DDT spedizione pendente — registrane uno nuovo qui sotto</div>`;
    }
    // v2.0.0+ — sort by alert priority
    const sorted = pending.slice().sort((a, b) => {
      const sa = pickupAlertStatus(a).sortKey;
      const sb = pickupAlertStatus(b).sortKey;
      if (sa !== sb) return sa - sb;
      return b.created_at - a.created_at;
    });
    return sorted.map(d => this._renderPendingDocCard(d, 'SHIP')).join('');
  },

  /* Card DDT pendente — usata sia per RES che SHIP, con tema cromatico differente.
     v2.0.0+ — Integra badge alert per data ritiro prevista e bordo colorato per urgenza. */
  _renderPendingDocCard(doc, kind) {
    const themeColor = kind === 'RES' ? 'var(--sx-teal)' : 'var(--sx-orange)';
    const themeBg = kind === 'RES' ? 'var(--grad-soft-teal)' : 'var(--grad-soft-orange)';
    const themeBadge = kind === 'RES' ? 'badge-teal' : 'badge-orange';
    const targetLabel = kind === 'RES' ? 'Destinatario' : 'Cliente';
    const evadeFn = kind === 'RES' ? '_evadiResi' : '_evadiSpedizione';
    const cancelFn = kind === 'RES' ? '_cancelPendingResi' : '_cancelPendingShip';
    const totalColli = doc.lines.reduce((s, l) => s + (l.qty || 1), 0);
    const created = new Date(doc.created_at).toLocaleString('it-IT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const ageMs = Date.now() - doc.created_at;
    const ageH = Math.floor(ageMs / (1000 * 60 * 60));
    const ageStr = ageH < 1 ? 'pochi minuti' : (ageH < 24 ? `${ageH}h` : `${Math.floor(ageH/24)}g`);
    // v2.0.0+ — Alert data ritiro prevista
    const alert = pickupAlertStatus(doc);
    const isUrgent = alert.level === 'overdue' || alert.level === 'today' || alert.level === 'tomorrow';
    // Bordo "pulsante" per overdue/today, normale per gli altri
    const borderColor = isUrgent ? alert.color : themeColor;
    const borderWidth = isUrgent ? '2px' : '1px';
    const animation = (alert.level === 'overdue' || alert.level === 'today') ? 'animation:pendingPulse 2s ease-in-out infinite' : '';
    // Badge alert visibile in summary
    const alertBadgeSummary = alert.level === 'none'
      ? `<span class="badge" style="background:var(--sx-card-alt);color:var(--sx-text-muted);border:1px dashed var(--sx-border-strong);font-size:0.65rem">📅 da definire</span>`
      : `<span class="badge" style="background:${alert.bg};color:${alert.color};border-color:${alert.color};font-size:0.65rem;font-weight:700">📅 ${this._esc(alert.shortLabel)}</span>`;
    /* v2.0.1 [A-3] — Controllo di integrità delegato a Store.checkPendingDocIntegrity.
       Prima veniva rilevata solo la giacenza insufficiente; ora si distingue anche
       il caso «merce spostata altrove», che è l'esito tipico di un cambio ubicazione
       su merce impegnata (decisione A-3) e che prima passava come semplice assenza. */
    const integrity = Store.checkPendingDocIntegrity(doc);
    const warnings = integrity.issues.length;
    const issueByLine = new Map(integrity.issues.map(x => [x.lineIndex, x]));
    const warnBadge = warnings > 0 ? `<span class="badge" style="background:var(--sx-danger-soft);color:var(--sx-danger);border-color:var(--sx-danger);margin-left:0.3rem" title="${warnings} riga/e non allineata/e alla giacenza attuale">⚠ ${warnings}</span>` : '';
    const linesHtml = doc.lines.map((l, i) => {
      const issue = issueByLine.get(i);
      const rowStyle = issue ? 'background:var(--sx-danger-soft);' : '';
      const issueHtml = issue
        ? `<div style="font-size:0.66rem;color:var(--sx-danger);padding:0.15rem 0 0.25rem 1rem">⚠ ${this._esc(issue.message)}</div>`
        : '';
      return `<div style="${rowStyle}font-size:0.7rem;padding:0.2rem 0;border-bottom:1px dashed var(--sx-border)">
      <div style="display:flex;justify-content:space-between;gap:0.4rem">
        <span><span style="color:var(--sx-text-muted)">${i+1}.</span> <strong>${this._esc(l.article_code)}</strong> · L:${this._esc(l.lot_code)} · 📍${this._esc(l.location_code)}${l.notes ? ' · <em>' + this._esc(l.notes) + '</em>' : ''}</span>
        <strong style="color:${themeColor}">${l.qty} Coll.</strong>
      </div>${issueHtml}
    </div>`;
    }).join('');
    return `<details data-doc-id="${this._esc(doc.doc_id)}" style="background:${themeBg};border:${borderWidth} solid ${borderColor};border-radius:var(--radius-md);padding:0;margin-bottom:0.4rem;${animation}">
      <summary style="cursor:pointer;padding:0.5rem 0.7rem;font-size:0.78rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:0.5rem;flex-wrap:wrap">
        <span style="display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap">
          <strong style="color:${themeColor}">DDT ${this._esc(doc.ddt_num)}</strong> · ${this._esc(doc.destination)}${doc.carrier ? ' <span style="color:var(--sx-text-muted)">· ' + this._esc(doc.carrier) + '</span>' : ''}
          ${alertBadgeSummary}
          ${warnBadge}
        </span>
        <span class="badge ${themeBadge}">${doc.lines.length} righe · ${totalColli} Coll.</span>
      </summary>
      <div style="padding:0.5rem 0.7rem;background:#fff;border-top:1px solid ${borderColor};border-radius:0 0 var(--radius-md) var(--radius-md)">
        <div style="font-size:0.68rem;color:var(--sx-text-muted);margin-bottom:0.4rem">
          Registrato il ${created} <span style="color:var(--sx-text-secondary)">(${ageStr} fa)</span>
          ${doc.operator ? ' · <strong>' + this._esc(doc.operator) + '</strong>' : ''} · ${targetLabel}: <strong>${this._esc(doc.destination)}</strong>
        </div>
        ${alert.level !== 'none' ? `<div style="background:${alert.bg};color:${alert.color};font-weight:700;font-size:0.74rem;padding:0.35rem 0.55rem;border-radius:var(--radius);margin-bottom:0.4rem;border:1px solid ${alert.color}">${this._esc(alert.label)}</div>` : `<div style="background:var(--sx-card-alt);color:var(--sx-text-muted);font-size:0.7rem;padding:0.3rem 0.5rem;border-radius:var(--radius);margin-bottom:0.4rem;border:1px dashed var(--sx-border-strong)">📅 Data ritiro non specificata — nessun alert attivo per questo DDT</div>`}
        <div style="margin-bottom:0.5rem">${linesHtml}</div>
        ${warnings > 0 ? `<div style="background:var(--sx-danger-soft);color:var(--sx-danger);font-size:0.7rem;padding:0.4rem 0.55rem;border-radius:var(--radius);margin-bottom:0.4rem;border:1px solid var(--sx-danger)">
          <strong>⚠ ${warnings} riga/e NON ALLINEATA/E alla giacenza attuale.</strong><br>
          Il documento non è evadibile così com'è: usare <strong>📝 Modifica</strong> per riallinearlo, oppure <strong>✕</strong> per annullarlo e rifarlo.
        </div>` : ''}
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
          <button class="btn" style="flex:1;min-width:120px;padding:0.5rem;font-weight:700;background:${themeColor};color:#fff;border-color:${themeColor}" onclick="App.${evadeFn}('${this._esc(doc.doc_id)}')">✓ EVADI DDT</button>
          <button class="btn" style="background:var(--sx-accent-soft);color:var(--sx-accent);border-color:var(--sx-accent);font-weight:600" onclick="App._editPendingDoc('${this._esc(doc.doc_id)}')" title="Modifica DDT">📝 Modifica</button>
          <button class="btn" onclick="App._printOutboundReport('${this._esc(doc.doc_id)}')" title="Stampa documento">🖨</button>
          <button class="btn btn-ghost" style="color:var(--sx-danger)" onclick="App.${cancelFn}('${this._esc(doc.doc_id)}')" title="Annulla DDT">✕</button>
        </div>
      </div>
    </details>`;
  },

  _shipLookup() {
    const art = Validate.clean(document.getElementById('pShipArt')?.value, true);
    const lot = Validate.clean(document.getElementById('pShipLot')?.value);
    const info = document.getElementById('pShipInfo');
    const details = document.getElementById('pShipDetails');
    if (!art) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Scansiona prima il codice articolo</div>`; document.getElementById('pShipArt')?.focus(); return; }
    if (!lot) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Scansiona il codice lotto</div>`; document.getElementById('pShipLot')?.focus(); return; }
    const artErr = Validate.article(art);
    if (artErr) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ ${this._esc(artErr)}</div>`; details.classList.add('hidden'); return; }
    const lotErr = Validate.lot(lot);
    if (lotErr) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ ${this._esc(lotErr)}</div>`; details.classList.add('hidden'); return; }
    const allItems = Store.findItemLocations(art);
    const matched = allItems.filter(it => it.lot_code === lot);
    if (!matched.length) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-danger);margin-top:0.2rem">✗ Item ${this._esc(art)}#${this._esc(lot)} non trovato in magazzino</div>`; details.classList.add('hidden'); return; }
    const notQuar = matched.filter(it => !Store.isItemQuarantined(it.item_key));
    if (!notQuar.length) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-purple);margin-top:0.2rem">⚠ L'item ${this._esc(art)}#${this._esc(lot)} è in quarantena</div>`; details.classList.add('hidden'); return; }
    const inCartByKey = {};
    for (const c of this._shipCart) {
      const k = `${c.location_code}#${c.item_key}`;
      inCartByKey[k] = (inCartByKey[k] || 0) + c.qty;
    }
    const enriched = notQuar.map(it => {
      const totalQty = it.qty || 1;
      const pendingQty = Store.getPendingQtyForItem(it.location_code, it.item_key);
      const cartQty = inCartByKey[`${it.location_code}#${it.item_key}`] || 0;
      const availableQty = Math.max(0, totalQty - pendingQty - cartQty);
      return { ...it, _totalQty: totalQty, _pendingQty: pendingQty, _availableQty: availableQty };
    });
    const usable = enriched.filter(it => it._availableQty > 0);
    if (!usable.length) { info.innerHTML = `<div style="font-size:0.75rem;color:var(--sx-warning);margin-top:0.2rem">⚠ Tutta la giacenza di ${this._esc(art)}#${this._esc(lot)} è impegnata</div>`; details.classList.add('hidden'); return; }
    if (usable.length === 1) { this._shipSelectItem(usable[0]); return; }
    let html = '<div style="max-height:200px;overflow-y:auto;margin-top:0.3rem"><div style="font-size:0.68rem;color:var(--sx-text-muted);margin-bottom:0.3rem">Item presente in più ubicazioni — seleziona da quale prelevare:</div>';
    for (const it of usable) {
      const p = App._payload(it);
      const pendBadge = it._pendingQty > 0 ? ` <span class="badge badge-amber">${it._pendingQty} prenotati</span>` : '';
      html += `<div class="inv-item-row" style="cursor:pointer" onclick="App._shipSelectEnc('${p}')">
        <div class="inv-info">
          <div class="inv-code" style="color:var(--sx-orange)">${this._esc(it.article_code)} <span style="color:var(--sx-text-muted);font-weight:400;font-size:0.72rem">${this._esc(it.article_description || '')}</span></div>
          <div class="inv-lot">L:${this._esc(it.lot_code)} · 📍 ${this._esc(it.location_code)} · <strong>${it._availableQty}/${it._totalQty} Coll.</strong>${pendBadge}${it.expiry_date ? ` · scad. ${this._esc(it.expiry_date)}` : ''}</div>
        </div>
        <span style="color:var(--sx-orange);font-size:0.72rem">🚚 Seleziona</span>
      </div>`;
    }
    info.innerHTML = html + '</div>';
    details.classList.add('hidden');
  },

  _shipSelectEnc(p) { this._shipSelectItem(JSON.parse(decodeURIComponent(p))); },

  _shipSelectItem(item) {
    const full = Store.getItemsAtLocation(item.location_code).find(i => i.item_key === item.item_key);
    if (!full) return this.toast('Item non più disponibile in giacenza', 'error');
    const totalQty = full.qty || 1;
    const pendingQty = Store.getPendingQtyForItem(item.location_code, item.item_key);
    const cartQty = this._shipCart
      .filter(c => c.location_code === item.location_code && c.item_key === item.item_key)
      .reduce((s, c) => s + c.qty, 0);
    const availableQty = Math.max(0, totalQty - pendingQty - cartQty);
    if (availableQty <= 0) {
      document.getElementById('pShipInfo').innerHTML = `<div style="font-size:0.75rem;color:var(--sx-warning);margin-top:0.2rem">⚠ Giacenza tutta impegnata</div>`;
      return;
    }
    this._shipState = { item: full, availableQty, totalQty, pendingQty };
    const expBadge = full.expiry_date ? ` · scad. ${this._esc(full.expiry_date)}` : '';
    const pendBadge = pendingQty > 0 ? ` · <span style="color:var(--sx-warning)">${pendingQty} prenotati</span>` : '';
    document.getElementById('pShipInfo').innerHTML = '';
    document.getElementById('pShipItemPreview').innerHTML = `<div class="mov-preview" style="background:var(--grad-soft-orange);border-color:var(--sx-orange);margin-bottom:0.4rem">
      <strong style="color:var(--sx-orange)">${this._esc(full.article_code)}</strong>
      <span style="color:var(--sx-text-muted)">${this._esc(full.article_description || '')}</span><br>
      <span style="font-size:0.72rem;color:var(--sx-text-muted)">Lotto: <strong>${this._esc(full.lot_code)}</strong> · Ubic: <strong class="mono">${this._esc(full.location_code)}</strong> · Disp. effettiva: <strong style="color:var(--sx-orange)">${availableQty} Coll.</strong> (tot. ${totalQty}${pendBadge})${expBadge}</span>
    </div>`;
    const qe = document.getElementById('pShipQty');
    if (qe) { qe.value = availableQty; qe.max = availableQty; }
    const av = document.getElementById('pShipAvail'); if (av) av.textContent = availableQty;
    const notesEl = document.getElementById('pShipNotes'); if (notesEl) notesEl.value = '';
    document.getElementById('pShipDetails').classList.remove('hidden');
    qe?.focus();
    qe?.select();
  },

  _shipAddToCart() {
    if (!this._shipState?.item) return this.toast('Identifica prima un item in giacenza', 'error');
    const item = this._shipState.item;
    const availableQty = this._shipState.availableQty;
    const notes = Validate.clean(document.getElementById('pShipNotes')?.value);
    const qtyRaw = document.getElementById('pShipQty')?.value;
    const qty = parseInt(qtyRaw);
    if (!qty || qty < 1) return this.toast('Numero di colli non valido', 'error');
    if (qty > availableQty) return this.toast(`Qty richiesta (${qty}) supera disponibilità (${availableQty})`, 'error');
    if (Validate.notes(notes)) return this.toast(Validate.notes(notes), 'error');
    if (!this._shipCart.length && !this._shipStartTime) this._shipStartTime = Date.now();
    this._shipCart.push({
      article_code: item.article_code,
      article_description: item.article_description || '',
      lot_code: item.lot_code,
      location_code: item.location_code,
      item_key: item.item_key,
      expiry_date: item.expiry_date || '',
      qty,
      qty_at_creation: availableQty,
      notes
    });
    this.toast(`+ ${item.article_code}#${item.lot_code} (${qty}/${availableQty} Coll.) da ${item.location_code}`, 'success');
    for (const id of ['pShipArt','pShipLot','pShipNotes']) { const e = document.getElementById(id); if (e) e.value = ''; }
    const qe = document.getElementById('pShipQty'); if (qe) qe.value = '1';
    document.getElementById('pShipItemPreview').innerHTML = '';
    document.getElementById('pShipDetails')?.classList.add('hidden');
    this._shipState = null;
    this._persistShipHeader();
    this._updateShipCart();
    this.setPrimaryScanField('pShipArt');
  },

  _persistShipHeader() {
    this._shipDdtNum = Validate.clean(document.getElementById('pShipDdt')?.value) || this._shipDdtNum;
    this._shipCustomer = Validate.clean(document.getElementById('pShipCustomer')?.value) || this._shipCustomer;
    this._shipCarrier = Validate.clean(document.getElementById('pShipCarrier')?.value) || this._shipCarrier;
    // v2.0.0+ — data di ritiro prevista
    // v2.3.0 [D1] — il campo è in gg/mm/aaaa: lo stato interno resta ISO (pickupAlertStatus)
    const expectedEl = document.getElementById('pShipExpected');
    if (expectedEl) {
      const iso = this._dateITtoISO(expectedEl.value, 'Data ritiro');
      this._shipExpectedDate = iso === null ? '' : iso;
    }
  },

  _shipRemoveFromCart(idx) {
    this._shipCart.splice(idx, 1);
    this._persistShipHeader();
    this._updateShipCart();
  },

  async _shipClearCart() {
    if (!await Dialog.confirm({
      title: 'Svuotare il carrello bozza?',
      message: 'Le righe inserite vengono eliminate. La testata del DDT viene mantenuta.',
      confirmLabel: 'Svuota', danger: true
    })) return;
    this._shipCart = [];
    this._shipStartTime = null;
    this._shipState = null;
    this._persistShipHeader();
    this._updateShipCart();
  },

  /* v2.1.0 — contenuto della sola zona carrello spedizioni */

    const n = this._shipCart.length;
    const totalColli = this._shipCart.reduce((s, r) => s + (r.qty || 0), 0);
    return `<div style="display:flex;justify-content:space-between;align-items:center;margin:0.7rem 0 0.35rem">
        <strong style="font-size:0.92rem">🛒 Carrello Bozza <span style="color:var(--sx-orange)">(${n})</span>${n ? ` <span class="dlg-chip">${totalColli} Coll.</span>` : ''}</strong>
        ${n ? '<button class="btn btn-sm btn-ghost" onclick="App._shipClearCart()">Svuota</button>' : ''}
      </div>

      ${n ? `<button class="btn" style="width:100%;margin-top:0.6rem;font-weight:800;min-height:var(--md-touch);background:var(--sx-orange);color:#fff;border-color:var(--sx-orange)" onclick="App._saveShipPending()">📥 REGISTRA DDT PENDENTE (${n} righe)</button>` : ''}`;
  },

  _renderShipCart() {
    if (!this._shipCart.length) return '<div class="pick-cart-empty">Carrello vuoto — scansiona articolo e lotto, identifica in giacenza, poi aggiungi</div>';
    return this._shipCart.map((it, i) => {

      const notesBadge = it.notes ? ` · <span style="color:var(--sx-text-muted);font-style:italic">${this._esc(it.notes)}</span>` : '';
      const partial = it.qty < (it.qty_at_creation || it.qty) ? ` <span class="badge badge-amber" style="margin-left:0.2rem">PARZIALE</span>` : '';

          <div class="pci-code">${this._esc(it.article_code)} <span style="color:var(--sx-text-muted);font-weight:400;font-size:0.65rem">${this._esc(it.article_description || '')}</span>${partial}</div>
          <div class="pci-loc">L:${this._esc(it.lot_code)} · 📍 ${this._esc(it.location_code)} · <strong style="color:var(--sx-orange)">${it.qty} Coll.</strong>${expBadge}${notesBadge}</div>
        </div>
        <button class="btn btn-sm btn-ghost" style="color:var(--sx-danger)" onclick="App._shipRemoveFromCart(${i})">✕</button>
      </div>`;
    }).join('');
  },

  /* STATO 1 — Salva DDT spedizione come pendente. */
  async _saveShipPending() {
    if (!this._requireOperator('la registrazione della spedizione')) return;   // v2.0.1 [B7]
    if (!this._shipCart.length) return this.toast('Carrello vuoto', 'error');
    this._persistShipHeader();
    if (!this._shipDdtNum) { document.getElementById('pShipDdt')?.focus(); return this.toast('N° DDT Spedizione obbligatorio', 'error'); }
    if (!this._shipCustomer) { document.getElementById('pShipCustomer')?.focus(); return this.toast('Cliente obbligatorio', 'error'); }
    for (let i = 0; i < this._shipCart.length; i++) {
      const it = this._shipCart[i];
      const cur = Store.getItemsAtLocation(it.location_code).find(x => x.item_key === it.item_key);
      if (!cur) return this.toast(`Riga ${i+1}: ${it.article_code}#${it.lot_code} non più in ${it.location_code}`, 'error');
      const totalQty = cur.qty || 1;
      const pendingQty = Store.getPendingQtyForItem(it.location_code, it.item_key);
      const otherCart = this._shipCart
        .filter((x, j) => j !== i && x.location_code === it.location_code && x.item_key === it.item_key)
        .reduce((s, x) => s + x.qty, 0);
      const avail = totalQty - pendingQty - otherCart;
      if (it.qty > avail) return this.toast(`Riga ${i+1}: qty richiesta (${it.qty}) > disponibilità effettiva (${avail})`, 'error');
    }
    const totalColli = this._shipCart.reduce((s, it) => s + (it.qty || 1), 0);
    // v2.0.0+ — warning data ritiro
    let dateWarn = '';
    if (this._shipExpectedDate) {
      const tmpDoc = { expected_pickup_date: this._shipExpectedDate };
      const status = pickupAlertStatus(tmpDoc);
      if (status.level === 'overdue') dateWarn = `\n⚠ Data ritiro nel passato (${status.label})`;
      else if (status.level === 'today') dateWarn = `\n⚠ Data ritiro è OGGI`;
    } else {
      dateWarn = '\n⚠ Data ritiro non specificata (nessun alert sarà attivo)';
    }
    if (!await Dialog.confirm({
      title: 'Registrare il DDT spedizione come pendente?',
      message: `La merce RIMANE in giacenza, prenotata per l\u2019uscita. Al ritiro del vettore usare "EVADI DDT".${dateWarn}`,
      details: Dialog.kv([
        ['N° DDT', this._shipDdtNum],
        ['Cliente', this._shipCustomer],
        ['Vettore', this._shipCarrier || null],
        ['Ritiro previsto', this._shipExpectedDate ? new Date(this._shipExpectedDate + 'T00:00:00').toLocaleDateString('it-IT') : 'non indicato'],
        ['Righe', this._shipCart.length],
        ['Colli totali', totalColli]
      ]),
      confirmLabel: 'Registra DDT', icon: '\u{1F4E5}'
    })) return;
    try {
      const doc = await Store.savePendingOutbound({
        kind: 'SHIP',
        ddt_num: this._shipDdtNum,
        destination: this._shipCustomer,
        carrier: this._shipCarrier,
        expected_pickup_date: this._shipExpectedDate, // v2.0.0+
        operator: Store.getCurrentIdentity().initials,
        lines: this._shipCart.slice()
      });
      this.toast(`✓ DDT Spedizione ${doc.ddt_num} registrato come pendente`, 'success');   // v2.2.1 [F4]
      this.updateSyncIndicator();
      this._shipCart = [];
      this._shipStartTime = null;
      this._shipState = null;
      this._shipDdtNum = '';
      this._shipCustomer = '';
      this._shipCarrier = '';
      this._shipExpectedDate = '';   // v2.0.0+
      this._formSpedizioni(document.getElementById('movFormArea'));
    } catch (err) {
      this.toast(`Errore salvataggio: ${err.message || 'sconosciuto'}`, 'error');
    }
  },

  /* STATO 2 — EVASIONE spedizione. */
  async _evadiSpedizione(doc_id) {
    if (!this._requireOperator("l'evasione della spedizione")) return;   // v2.0.1 [B7]
    const doc = Store.getPendingDoc(doc_id);
    if (!doc || doc.status !== 'pending') return this.toast('Documento non trovato o già evaso', 'error');
    for (let i = 0; i < doc.lines.length; i++) {
      const l = doc.lines[i];
      const cur = Store.getItemsAtLocation(l.location_code).find(x => x.item_key === l.item_key);
      if (!cur) return this.toast(`Riga ${i+1}: ${l.article_code}#${l.lot_code} non più in giacenza in ${l.location_code} — annullare e ricreare il DDT`, 'error');
      if ((cur.qty || 1) < l.qty) return this.toast(`Riga ${i+1}: giacenza attuale (${cur.qty || 1}) < qty richiesta (${l.qty})`, 'error');
    }
    const totalColli = doc.lines.reduce((s, l) => s + (l.qty || 1), 0);
    if (!await Dialog.confirm({
      title: 'Evadere il DDT spedizione?',
      message: 'La merce viene SCARICATA fisicamente dalla giacenza con stato SPEDITO. Confermare solo a carico avvenuto.',
      details: Dialog.kv([
        ['N° DDT', doc.ddt_num],
        ['Cliente', doc.destination],
        ['Righe', doc.lines.length],
        ['Colli totali', totalColli]
      ]),
      confirmLabel: 'Evadi e scarica', danger: true
    })) return;
    const reasonNotes = `SPEDIZIONE a ${doc.destination}${doc.carrier ? ' (vettore: ' + doc.carrier + ')' : ''}`;
    const performed = [];
    let failedAt = -1, failMsg = '';
    for (let i = 0; i < doc.lines.length; i++) {
      const l = doc.lines[i];
      try {
        const before = Store.getItemsAtLocation(l.location_code).find(x => x.item_key === l.item_key);
        const backup = before ? { ...before } : null;
        const removed = await Store.removeItem(l.location_code, l.item_key, l.qty);
        if (!removed) { failedAt = i; failMsg = `Rimozione fallita (riga ${i+1})`; break; }
        performed.push({ backup, mode: removed._mode, location_code: l.location_code, item_key: l.item_key, qty_removed: l.qty, qty_before: removed._qty_before, qty_after: removed._qty_after });
      } catch (err) {
        failedAt = i;
        failMsg = `Errore riga ${i+1}: ${err.message || 'sconosciuto'}`;
        break;
      }
    }
    if (failedAt !== -1) {
      for (let j = performed.length - 1; j >= 0; j--) {
        const p = performed[j];
        try {
          if (p.mode === 'full' && p.backup) await Store.restoreItem(p.backup);
          else if (p.backup) await Store.addItem(p.location_code, p.backup.article_code, p.backup.article_description, p.backup.lot_code, p.backup.expiry_date || '', p.backup.notes || '', p.qty_removed);
        } catch {}
      }
      return this.toast(`${failMsg} — rollback eseguito, DDT resta pendente`, 'error');
    }
    for (let i = 0; i < doc.lines.length; i++) {
      const l = doc.lines[i];
      const p = performed[i];
      const itemNotes = l.notes ? `${reasonNotes} · ${l.notes}` : reasonNotes;
      await this._logMov(MOV.SHIP, l.article_code, l.article_description, l.lot_code, l.location_code, null, doc.operator || Store.getCurrentIdentity().initials, itemNotes, doc.ddt_num, p.qty_before, -p.qty_removed, p.qty_after);
    }
    await Store.updatePendingStatus(doc_id, 'evaded');
    this.toast(`✓ DDT ${doc.ddt_num} evaso · ${doc.lines.length} righe · ${totalColli} Coll. spediti`, 'success');
    this.updateSyncIndicator();
    if (await Dialog.confirm({
      title: 'Stampare la ricevuta della spedizione?',
      confirmLabel: 'Stampa', cancelLabel: 'Non ora', icon: '\u{1F5A8}'
    })) this._printOutboundReport(doc_id);
    this._formSpedizioni(document.getElementById('movFormArea'));
    this._refreshSessionLog();
  },

  async _cancelPendingShip(doc_id) {
    if (!this._requireOperator("l'annullamento del DDT")) return;   // v2.0.1 [B7]
    const doc = Store.getPendingDoc(doc_id);
    if (!doc) return this.toast('Documento non trovato', 'error');
    if (doc.status !== 'pending') return this.toast('Documento non più pendente', 'error');
    if (!await Dialog.confirm({
      title: 'Annullare il DDT spedizione?',
      message: 'Il documento viene chiuso senza movimentare la giacenza. La merce torna interamente disponibile.',
      details: Dialog.kv([['N° DDT', doc.ddt_num], ['Cliente', doc.destination]]),
      confirmLabel: 'Annulla il DDT', cancelLabel: 'Mantieni', danger: true
    })) return;
    await Store.updatePendingStatus(doc_id, 'cancelled');
    this.toast(`✓ DDT ${doc.ddt_num} annullato`, 'success');
    this._formSpedizioni(document.getElementById('movFormArea'));
  },

  // © Andrea Sacchetti — fine modulo Spedizioni v2.0.0

  // ═══════════════════════════════════════════════════════════════════
  // ═══ 8. MODIFICA DDT PENDENTI (v2.0.0+) ═══
  // © Andrea Sacchetti — Dietopack S.r.l.
  // Editing di DDT pendenti già registrati: testata, righe (qty/notes/rimozione),
  // aggiunta nuove righe. Apre un modal con form completo. Solo doc 'pending'.
  // Lo stato di editing è temporaneo (state-machine in _editState) e applicato
  // tramite Store.updatePendingDoc() solo al salvataggio finale.
  // ═══════════════════════════════════════════════════════════════════

  /* Apre il modal di edit per un DDT pendente. Crea uno snapshot mutabile in
     this._editState (NO mutazione diretta del cache fino al salvataggio). */
  _editPendingDoc(doc_id) {
    const doc = Store.getPendingDoc(doc_id);
    if (!doc) return this.toast('DDT non trovato', 'error');
    if (doc.status !== 'pending') return this.toast('Solo DDT pendenti possono essere modificati', 'error');
    // Snapshot mutabile (deep copy delle righe)
    this._editState = {
      doc_id: doc.doc_id,
      kind: doc.kind,
      ddt_num: doc.ddt_num,
      destination: doc.destination,
      carrier: doc.carrier || '',
      expected_pickup_date: doc.expected_pickup_date || '',
      lines: doc.lines.map(l => ({ ...l })),
      newLineState: null  // stato corrente per aggiungere una nuova riga
    };
    this._renderEditModal();
  },

          <label style="font-size:0.65rem">② Lotto</label>
          <input class="input input-mono" id="pEditLot" placeholder="Scansiona barcode lotto" maxlength="${Validate.MAX.LOT_CODE}"
            onkeydown="if(event.key==='Enter'){event.preventDefault();App._editLookupNewLine();}">
          <div id="pEditInfo"></div>
        </div>
        <div id="pEditDetails" class="hidden">
          <div id="pEditPreview"></div>
          <div style="display:flex;gap:0.4rem;margin-bottom:0.3rem;align-items:flex-end">
            <div class="form-group" style="width:120px;margin-bottom:0">
              <label style="font-size:0.65rem">Qty</label>
              <input class="input input-mono" id="pEditQty" type="number" min="1" step="1" value="1" style="text-align:center;font-weight:700;padding:0.2rem 0.3rem"
                onkeydown="if(event.key==='Enter'){event.preventDefault();App._editAddNewLine();}">
            </div>
            <div style="font-size:0.65rem;color:var(--sx-text-muted);padding-bottom:0.3rem">Disp.: <strong id="pEditAvail" style="color:${themeColor}">—</strong></div>

    // Persisti header attuale prima di re-render (se modal già aperta)
    const existing = document.getElementById('editPendingModal');

    // Crea overlay e appendi al body (pattern usato da operatorModal)

        <div style="background:${isRes ? 'var(--grad-soft-teal)' : 'var(--grad-soft-orange)'};border:1px solid ${themeColor};border-radius:var(--radius);padding:0.5rem 0.6rem;margin-bottom:0.6rem">
          <div style="font-size:0.7rem;color:${themeColor};font-weight:700;margin-bottom:0.3rem">📋 TESTATA DDT</div>
          <div class="form-row" style="margin-bottom:0.4rem">
            <div class="form-group">
              <label>N° DDT</label>
              <input class="input input-mono" id="pEditDdt" maxlength="40" value="${this._esc(s.ddt_num)}">

              <label>${targetLabel}</label>
              <input class="input" id="pEditDest" placeholder="${targetPlaceholder}" maxlength="${Validate.MAX.OPERATOR}" value="${this._esc(s.destination)}">
