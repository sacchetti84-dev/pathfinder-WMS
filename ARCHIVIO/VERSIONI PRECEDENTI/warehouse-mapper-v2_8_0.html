  getPrefs() { return { ...this._prefs }; },

  setPref(key, value) {
    if (!(key in this._prefs)) return;
    this._prefs[key] = key === 'volume'
      ? Math.min(1, Math.max(0, Number(value) || 0))
      : Boolean(value);
    try { localStorage.setItem(this.PREF_KEY, JSON.stringify(this._prefs)); }
    catch (err) { console.warn('Feedback: preferenze non salvabili', err); }
  },

  _ensureCtx() {
    if (this._ctx) { if (this._ctx.state === 'suspended') this._ctx.resume(); return this._ctx; }
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      this._ctx = new Ctor();
    } catch (err) {
      console.warn('Feedback: audio non disponibile su questo dispositivo', err);
      this._ctx = null;
    }
    return this._ctx;
  },

  /* Singolo tono sintetizzato. offsetMs consente di comporre sequenze. */
  _tone(freq, offsetMs, durMs, type = 'sine', peak = 0.22) {
    const ctx = this._ensureCtx();
    if (!ctx) return;
    const t0 = ctx.currentTime + offsetMs / 1000;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    const amp = peak * this._prefs.volume;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs / 1000);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + durMs / 1000 + 0.03);
  },

  /* Firme sonore distinte: l'operatore deve riconoscere l'esito
     SENZA guardare lo schermo. */
  sound(kind) {
    if (!this._prefs.audio) return;
    switch (kind) {
      case 'ok':      this._tone(1046, 0, 70, 'sine', 0.20); this._tone(1568, 65, 90, 'sine', 0.18); break;
      case 'warn':    this._tone(740, 0, 130, 'triangle', 0.24); this._tone(740, 190, 130, 'triangle', 0.24); break;
      case 'error':   this._tone(233, 0, 240, 'square', 0.16); this._tone(175, 250, 340, 'square', 0.16); break;
      case 'scan':    this._tone(1320, 0, 45, 'sine', 0.12); break;
      case 'info':
      default:        this._tone(880, 0, 80, 'sine', 0.16); break;
    }
  },

  vibrate(kind) {
    if (!this._prefs.vibration || !navigator.vibrate) return;
    const patterns = { ok: [35], info: [25], warn: [40, 70, 40], error: [90, 70, 90, 70, 160], scan: [15] };
    try { navigator.vibrate(patterns[kind] || patterns.info); } catch { /* non supportato */ }
  },

  flash(kind) {
    if (!this._prefs.flash) return;
    const el = document.getElementById('fbFlash');
    if (!el) return;
    const cls = kind === 'ok' ? 'on-ok' : kind === 'error' ? 'on-err' : kind === 'warn' ? 'on-warn' : null;
    if (!cls) return;
    el.classList.remove('on-ok', 'on-warn', 'on-err');
    void el.offsetWidth;   // forza il riavvio dell'animazione
    el.classList.add(cls);
  },

  /* Messaggio centrale. Non impila: un nuovo riscontro sostituisce il
     precedente, cosi' lo schermo resta pulito anche a raffica di scansioni. */
  popup(kind, title, detail = '', ms = null) {
    const host = document.getElementById('fbCenter');
    if (!host) return;
    const map = {
      ok:    { cls: 'fb-ok',   ico: '✓' },
      error: { cls: 'fb-err',  ico: '✕' },
      warn:  { cls: 'fb-warn', ico: '⚠' },
      info:  { cls: 'fb-info', ico: 'ℹ' }
    };
    const cfg = map[kind] || map.info;
    const dur = ms || this.DURATIONS[kind] || this.DURATIONS.info;

    clearTimeout(this._timer);
    clearTimeout(this._outTimer);
    host.textContent = '';

    const box = document.createElement('aside');
    box.className = `fb-popup ${cfg.cls}`;

    const ico = document.createElement('div');
    ico.className = 'fb-ico';
    ico.textContent = cfg.ico;

    const txt = document.createElement('div');
    txt.className = 'fb-txt';
    const h = document.createElement('div');
    h.className = 'fb-title';
    h.textContent = title;                      // textContent: nessuna iniezione HTML
    txt.appendChild(h);
    if (detail) {
      const d = document.createElement('div');
      d.className = 'fb-detail';
      d.textContent = detail;
      txt.appendChild(d);
    }

    const bar = document.createElement('div');
    bar.className = 'fb-bar';
    bar.style.width = '100%';
    bar.style.transition = `width ${dur}ms linear`;

    box.append(ico, txt, bar);
    host.appendChild(box);
    requestAnimationFrame(() => { bar.style.width = '0%'; });

    this._node = box;
    this._timer = setTimeout(() => {
      box.classList.add('fb-out');
      this._outTimer = setTimeout(() => { if (box.parentNode) box.remove(); }, 260);
    }, dur);
  },

  /* Punto d'ingresso unico: suono + vibrazione + flash + messaggio. */
  signal(kind, title, detail = '', ms = null) {
    const k = ['ok', 'error', 'warn', 'info'].includes(kind) ? kind : 'info';
    this.sound(k);
    this.vibrate(k);
    this.flash(k);
    this.popup(k, title, detail, ms);
  },

  clear() {
    clearTimeout(this._timer);
    clearTimeout(this._outTimer);
    const host = document.getElementById('fbCenter');
    if (host) host.textContent = '';
  }
};

// ═══════════════════════════════════════════════════════════════════
// © Andrea Sacchetti — Dietopack S.r.l.
// modulo Dialog — v2.1.0
// Sostituisce confirm() e prompt() nativi nei flussi operativi.
//
// MOTIVO DI SICUREZZA (principale intervento della v2.1.0):
// i lettori barcode emettono un ritorno a capo come suffisso. Un confirm()
// nativo aperto mentre l'operatore scansiona viene ACCETTATO da quel
// ritorno a capo, senza che il messaggio venga mai letto. Nella v2.0.2
// questo permetteva di superare inavvertitamente l'avviso NON-FEFO.
//
// Contromisure implementate:
//  1. finestra di guardia: i tasti Invio nei primi N ms dall'apertura sono
//     ignorati e segnalati a video;
//  2. modalita' requireClick: sulle conferme critiche il tasto Invio non
//     conferma MAI, serve un click o Tab sul pulsante;
//  3. fail-safe: nei dialoghi critici il fuoco parte sul pulsante di
//     annullamento, quindi un Invio accidentale ANNULLA, non conferma;
//  4. Esc annulla sempre;
//  5. i caratteri alfabetici (tipici di un codice scansionato) digitati su
//     un campo quantita' vengono scartati e segnalati.
// ═══════════════════════════════════════════════════════════════════

const Dialog = {
  GUARD_MS: 900,          // finestra anti-ritorno-a-capo del lettore
  _resolve: null,
  _openedAt: 0,
  _guardMs: 0,
  _requireClick: false,
  _kind: 'confirm',
  _keyHandler: null,
  _guardTimer: null,
  _restoreFocus: null,

  get isOpen() {
    const o = document.getElementById('dlgOverlay');
    return Boolean(o && o.classList.contains('open'));
  },

  _overlay() { return document.getElementById('dlgOverlay'); },

  /* Costruisce e apre il dialogo. Ritorna una Promise risolta alla chiusura. */
  _open({ icon = 'ℹ', title, bodyNode, actions, danger = false, kind = 'confirm', guardMs = null, focusTarget = null }) {
    const overlay = this._overlay();
    if (!overlay) return Promise.resolve(null);
    if (this.isOpen) this._finish(null);   // un dialogo per volta

    this._kind = kind;
    this._guardMs = guardMs === null ? this.GUARD_MS : guardMs;
    this._requireClick = danger;
    this._openedAt = Date.now();
    this._restoreFocus = document.activeElement && document.activeElement.id ? document.activeElement.id : null;

    overlay.textContent = '';
    const dlg = document.createElement('div');
    dlg.className = 'dlg' + (danger ? ' dlg-danger' : '');

    const head = document.createElement('header');
    head.className = 'dlg-head';
    const ic = document.createElement('span');
    ic.className = 'dlg-ico';
    ic.textContent = icon;
    const h2 = document.createElement('h2');
    h2.id = 'dlgTitle';
    h2.textContent = title;
    head.append(ic, h2);

    const body = document.createElement('div');
    body.className = 'dlg-body';
    if (bodyNode) body.appendChild(bodyNode);

    /* Indicatore visibile della finestra di guardia: l'operatore capisce
       perche' il primo Invio non ha effetto, invece di credere a un blocco. */
    const guard = document.createElement('div');
    guard.className = 'dlg-guard';
    guard.innerHTML = '';
    const guardTxt = document.createElement('span');
    guardTxt.textContent = danger
      ? 'Conferma solo con il pulsante — Invio disabilitato per sicurezza'
      : 'Protezione lettore barcode attiva…';
    const guardBar = document.createElement('div');
    guardBar.className = 'dlg-guard-bar';
    const guardFill = document.createElement('i');
    guardBar.appendChild(guardFill);
    guard.append(guardTxt, guardBar);

    const foot = document.createElement('footer');
    foot.className = 'dlg-actions';
    const btnNodes = [];
    for (const a of actions) {
      const b = document.createElement('button');
      b.className = `btn ${a.cls || ''}`.trim();
      b.textContent = a.label;
      b.addEventListener('click', () => {
        if (typeof a.onClick === 'function') a.onClick();
        else this._finish(a.value);
      });
      foot.appendChild(b);
      btnNodes.push({ node: b, spec: a });
    }

    dlg.append(head, body, guard, foot);
    overlay.appendChild(dlg);
    overlay.classList.add('open');

    // Animazione della barra di guardia
    if (!danger && this._guardMs > 0) {
      guardFill.style.transition = `width ${this._guardMs}ms linear`;
      requestAnimationFrame(() => { guardFill.style.width = '100%'; });
      clearTimeout(this._guardTimer);
      this._guardTimer = setTimeout(() => { guardTxt.textContent = 'Pronto — Invio abilitato'; }, this._guardMs);
    } else if (danger) {
      guardFill.style.width = '100%';
      guardFill.style.background = 'var(--sx-danger)';
    }

    // Fuoco iniziale: fail-safe sui dialoghi critici
    const defaultBtn = btnNodes.find(b => b.spec.autofocus) ||
                       btnNodes.find(b => danger ? b.spec.value === false : b.spec.value !== false);
    setTimeout(() => {
      if (focusTarget && !danger) {
        const t = typeof focusTarget === 'string' ? document.getElementById(focusTarget) : focusTarget;
        if (t) { t.focus(); if (t.select) t.select(); return; }
      }
      defaultBtn?.node.focus();
    }, 30);

    this._keyHandler = (e) => this._onKey(e);
    document.addEventListener('keydown', this._keyHandler, true);
    Feedback.sound(danger ? 'warn' : 'info');

    return new Promise(res => { this._resolve = res; });
  },

  _onKey(e) {
    if (!this.isOpen) return;
    if (e.key === 'Escape') {
      e.preventDefault(); e.stopPropagation();
      /* v2.5.0 — 'reason' annulla come 'qty': restituisce null, non false.
         Un false verrebbe letto come "confermato senza motivazione". */
      this._finish((this._kind === 'qty' || this._kind === 'reason') ? null : false);
      return;
    }
    if (e.key !== 'Enter') return;

    const elapsed = Date.now() - this._openedAt;
    // (1) finestra di guardia
    if (elapsed < this._guardMs) {
      e.preventDefault(); e.stopPropagation();
      Feedback.sound('warn');
      const g = this._overlay()?.querySelector('.dlg-guard span');
      if (g) g.textContent = 'Invio ignorato — probabile suffisso del lettore barcode';
      return;
    }
    // (2) conferme critiche: Invio non conferma mai
    if (this._requireClick) {
      e.preventDefault(); e.stopPropagation();
      Feedback.signal('warn', 'Conferma manuale richiesta',
        'Questa operazione richiede un click sul pulsante. Il tasto Invio è disabilitato.');
      return;
    }
    // (3) su un pulsante il comportamento nativo va bene
    if (document.activeElement?.tagName === 'BUTTON') return;
    e.preventDefault(); e.stopPropagation();
    if (this._kind === 'qty') this._submitQty();
    else if (this._kind === 'reason') this._submitReason(this._reasonMin);
    else this._finish(true);
  },

  _finish(value) {
    clearTimeout(this._guardTimer);
    if (this._keyHandler) {
      document.removeEventListener('keydown', this._keyHandler, true);
      this._keyHandler = null;
    }
    const overlay = this._overlay();
    if (overlay) { overlay.classList.remove('open'); overlay.textContent = ''; }
    const res = this._resolve;
    this._resolve = null;
    // Il fuoco torna al campo da cui si e' partiti: la scansione successiva
    // non finisce nel vuoto (causa nota di "scansioni perse" nella v2.0.x).
    const id = this._restoreFocus;
    this._restoreFocus = null;
    if (id) setTimeout(() => document.getElementById(id)?.focus(), 40);
    if (res) res(value);
  },

  _mkBody(message, extraNode = null) {
    const frag = document.createDocumentFragment();
    if (message) {
      const p = document.createElement('p');
      p.textContent = message;                // textContent: nessun HTML iniettabile
      frag.appendChild(p);
    }
    if (extraNode) frag.appendChild(extraNode);
    return frag;
  },

  /* Elenco chiave/valore opzionale, per i riepiloghi documento. */
  kv(pairs) {
    const dl = document.createElement('dl');
    dl.className = 'dlg-kv';
    for (const [k, v] of pairs) {
      if (v === null || v === undefined || v === '') continue;
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = String(v);
      dl.append(dt, dd);
    }
    return dl;
  },

  /* Conferma booleana. danger:true -> Invio disabilitato, fuoco su Annulla. */
  confirm({ title, message = '', details = null, confirmLabel = 'Conferma', cancelLabel = 'Annulla',
            danger = false, icon = null, guardMs = null, focusTarget = null }) {
    return this._open({
      icon: icon || (danger ? '⚠' : '❓'),
      title,
      bodyNode: this._mkBody(message, details),
      danger,
      kind: 'confirm',
      guardMs,
      focusTarget,
      actions: [
        { label: cancelLabel, value: false, cls: '' },
        { label: confirmLabel, value: true, cls: danger ? 'btn-danger' : 'btn-accent' }
      ]
    });
  },

  alert({ title, message = '', details = null, icon = 'ℹ', okLabel = 'Ho capito' }) {
    return this._open({
      icon, title,
      bodyNode: this._mkBody(message, details),
      kind: 'alert',
      actions: [{ label: okLabel, value: true, cls: 'btn-accent', autofocus: true }]
    });
  },

  /* ═══════════════════════════════════════════════════════════════════
     v2.5.0 — Dialogo di MOTIVAZIONE OBBLIGATORIA
     © Andrea Sacchetti — Dietopack S.r.l.

     Usato per forzare una scansione discordante e per marcare una tappa come
     non trovata. La motivazione non è cosmetica: finisce nelle note del
     movimento a registro. Per questo il pulsante di conferma resta inerte
     finché il testo non raggiunge la lunghezza minima — una motivazione
     vuota o di due caratteri non è una motivazione.

     Ritorna la stringa motivata, oppure null se annullato.
     ═══════════════════════════════════════════════════════════════════ */
  reason({ title, message = '', details = null, placeholder = 'Motivazione…',
           minLen = 5, icon = '\u270E', confirmLabel = 'Conferma', danger = false }) {
    const wrap = document.createElement('div');
    if (details) wrap.appendChild(details);

    const ta = document.createElement('textarea');
    ta.className = 'textarea';
    ta.id = 'dlgReasonInput';
    ta.placeholder = placeholder;
    ta.maxLength = 240;
    ta.rows = 3;
    ta.autocomplete = 'off';
    wrap.appendChild(ta);

    const hint = document.createElement('div');
    hint.className = 'dlg-guard';
    hint.style.margin = '0.5rem 0 0';
    hint.textContent = `Minimo ${minLen} caratteri — la motivazione viene registrata a log`;
    wrap.appendChild(hint);

    /* Il lettore barcode spara sempre un INVIO finale: in una textarea
       produrrebbe un a-capo invece di confermare. Si intercetta e si converte
       in conferma solo se il testo è già valido, altrimenti si ignora. */
    ta.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      e.preventDefault();
      if (ta.value.trim().length >= minLen) this._submitReason(minLen);
    });
    ta.addEventListener('input', () => {
      const len = ta.value.trim().length;
      hint.textContent = len >= minLen
        ? `${len} caratteri — pronto`
        : `Ancora ${minLen - len} caratteri — la motivazione viene registrata a log`;
    });

    this._reasonMin = minLen;
    return this._open({
      icon, title,
      bodyNode: this._mkBody(message, wrap),
      kind: 'reason',
      danger,
      focusTarget: 'dlgReasonInput',
      actions: [
        { label: 'Annulla', value: null },
        { label: confirmLabel, cls: danger ? 'btn-danger' : 'btn-accent',
          onClick: () => this._submitReason(minLen) }
      ]
    });
  },

  _submitReason(minLen) {
    const ta = document.getElementById('dlgReasonInput');
    const txt = (ta?.value || '').trim();
    if (txt.length < minLen) {
      Feedback.signal('error', 'Motivazione troppo breve',
        `Servono almeno ${minLen} caratteri: questo testo finisce nel registro movimenti.`);
      ta?.focus();
      return;
    }
    this._finish(txt);
  },

  _reasonMin: 5,

  /* Selezione quantita' senza tastiera: +/- a pollice, valore preimpostato al
     massimo disponibile. Restituisce un intero o null se annullato. */
  qty({ title, message = '', details = null, value = 1, min = 1, max = 9999, unit = 'Coll.' }) {
    const wrap = document.createElement('div');
    if (details) wrap.appendChild(details);

    const row = document.createElement('div');
    row.className = 'dlg-qty-row';

    const minus = document.createElement('button');
    minus.className = 'btn'; minus.type = 'button'; minus.textContent = '−';
    minus.setAttribute('aria-label', 'Diminuisci');

    const input = document.createElement('input');
    input.className = 'input input-mono dlg-qty';
    input.id = 'dlgQtyInput';
    input.type = 'text';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.value = String(value);
    input.setAttribute('aria-label', `Quantita' in ${unit}`);

    const plus = document.createElement('button');
    plus.className = 'btn'; plus.type = 'button'; plus.textContent = '+';
    plus.setAttribute('aria-label', 'Aumenta');

    const maxBtn = document.createElement('button');
    maxBtn.className = 'btn'; maxBtn.type = 'button';
    maxBtn.textContent = `Tutti (${max})`;
    maxBtn.style.minWidth = 'auto';
    maxBtn.style.fontSize = '0.85rem';

    const clamp = (v) => Math.min(max, Math.max(min, v));
    const setVal = (v) => { input.value = String(clamp(v)); Feedback.sound('scan'); };
    minus.addEventListener('click', () => setVal((parseInt(input.value, 10) || min) - 1));
    plus.addEventListener('click', () => setVal((parseInt(input.value, 10) || min) + 1));
    maxBtn.addEventListener('click', () => setVal(max));

    /* Se il lettore spara un codice dentro questo campo, i caratteri non
       numerici vengono scartati e l'operatore ne viene informato. */
    input.addEventListener('input', () => {
      const cleaned = input.value.replace(/\D+/g, '');
      if (cleaned !== input.value) {
        input.value = cleaned;
        Feedback.signal('warn', 'Scansione ignorata',
          'Il campo quantità accetta solo cifre. Confermare o annullare la quantità prima di scansionare.');
      }
      if (cleaned.length > 5) input.value = cleaned.slice(0, 5);
    });

    row.append(minus, input, plus, maxBtn);
    wrap.appendChild(row);

    const hint = document.createElement('div');
    hint.className = 'dlg-guard';
    hint.style.margin = '0.6rem 0 0';
    hint.textContent = `Minimo ${min} · Massimo ${max} ${unit}`;
    wrap.appendChild(hint);

    this._qtyBounds = { min, max };
    return this._open({
      icon: '\u{1F522}', title,
      bodyNode: this._mkBody(message, wrap),
      kind: 'qty',
      focusTarget: 'dlgQtyInput',
      actions: [
        { label: 'Annulla', value: null },
        { label: 'Conferma', cls: 'btn-accent', onClick: () => this._submitQty() }
      ]
    });
  },

  _submitQty() {
    const input = document.getElementById('dlgQtyInput');
    const { min, max } = this._qtyBounds || { min: 1, max: 9999 };
    const v = parseInt(input?.value, 10);
    if (!Number.isInteger(v) || v < min || v > max) {
      Feedback.signal('error', 'Quantità non valida', `Inserire un numero intero tra ${min} e ${max}.`);
      input?.focus(); input?.select();
      return;
    }
    this._finish(v);
  },

  _qtyBounds: null
};

// ═══════════════════════════════════════════════════════════════════
// © Andrea Sacchetti — Dietopack S.r.l.
// modulo OdpParser — v2.5.0
// Lettura dell'ordine di produzione esportato da Sage X3 (.xlsx)
//
// SCELTA DELLA SORGENTE. Il medesimo ordine è esportabile in PDF e in XLSX.
// Il confronto diretto sui due file ha dato: quantità a 3 decimali contro 6
// (14,790 contro 14.789618), date come testo contro seriale nativo, colonne
// ricostruite dal layout contro celle indirizzate. Il PDF è il documento di
// reparto; la sorgente dati è l'XLSX, che per giunta SheetJS — già caricato
// per l'import articoli — legge senza aggiungere alcuna dipendenza.
//
// ROBUSTEZZA. Il foglio contiene celle unite e colonne che si spostano fra
// una riga articolo e l'altra (le prime due righe del file di riferimento non
// hanno la colonna "quantità per unità"). Per questo il parser NON legge per
// indice fisso di colonna ma per ANCORE TESTUALI e per posizione relativa dei
// valori all'interno della riga.
// ═══════════════════════════════════════════════════════════════════

const OdpParser = {

  /* Etichette usate come ancore. Confronto normalizzato: maiuscolo, spazi
     multipli compressi, accenti irrilevanti perché mai in posizione utile. */
  _norm(v) {
    return String(v ?? '').replace(/\s+/g, ' ').trim().toUpperCase();
  },

  _isBlank(v) {
    return v === null || v === undefined || String(v).trim() === '';
  },

  /* Conversione seriale Excel → ISO YYYY-MM-DD.
     Epoca 1899-12-30 (compensa il 1900 bisestile inesistente di Excel).
     Si preferisce XLSX.SSF quando disponibile: è l'implementazione della
     libreria stessa e gestisce i casi limite meglio di un calcolo manuale.
     Ritorna '' se il valore non è una data plausibile. */
  excelSerialToISO(v) {
    if (this._isBlank(v)) return '';
    // Già in forma testuale gg/mm/aaaa
    const txt = String(v).trim();
    const it = txt.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (it) {
      const [, d, m, y] = it;
      return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
    }
    const n = Number(v);
    if (!Number.isFinite(n) || n < 1 || n > 2958465) return '';
    try {
      if (typeof XLSX !== 'undefined' && XLSX.SSF?.parse_date_code) {
        const d = XLSX.SSF.parse_date_code(n);
        if (d?.y) {
          return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
        }
      }
    } catch (err) {
      console.warn('[WM] OdpParser: SSF non disponibile, uso il calcolo manuale', err);
    }
    const ms = Date.UTC(1899, 11, 30) + Math.round(n) * 86400000;
    const dt = new Date(ms);
    if (Number.isNaN(dt.getTime())) return '';
    return dt.toISOString().slice(0, 10);
  },

  /* Estrae dalla riga i valori numerici con la loro posizione, per poter
     ragionare su "l'ultimo numero della riga" senza dipendere dall'indice. */
  _numericCells(row) {
    const out = [];
    row.forEach((cell, idx) => {
      if (typeof cell === 'number' && Number.isFinite(cell)) out.push({ idx, value: cell });
    });
    return out;
  },

  /* ─────────────────────────────────────────────────────────────────
     PARSE PRINCIPALE
     Riceve un ArrayBuffer, ritorna:
       { ok, error?, header:{...}, lines:[...], warnings:[...] }
     Ogni line: { article_code, category, description, um, qty_per_unit,
                  total_qty, lots:[{lot_code, supplier_lot, um, qty,
                  expiry_iso, state}] }
     ───────────────────────────────────────────────────────────────── */
  parse(arrayBuffer) {
    if (typeof XLSX === 'undefined') {
      return { ok: false, error: 'Libreria Excel non disponibile: ricaricare la pagina con connessione attiva.' };
    }
    let rows;
    try {
      const wb = XLSX.read(arrayBuffer, { type: 'array' });
      const sheetName = wb.SheetNames[0];
      if (!sheetName) return { ok: false, error: 'Il file non contiene alcun foglio di lavoro.' };
      rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: '' });
    } catch (err) {
      console.error('[WM] OdpParser.parse:', err);
      return { ok: false, error: 'File non leggibile come Excel: ' + err.message };
    }
    if (!rows?.length) return { ok: false, error: 'Il foglio di lavoro è vuoto.' };

    const warnings = [];
    const header = this._parseHeader(rows, warnings);
    if (!header.odp_num) {
      return { ok: false, error: 'Numero ordine di produzione non trovato nel file. Verificare che sia l\u2019export dell\u2019ODP e non un altro documento.' };
    }

    const lines = this._parseLines(rows, warnings);
    if (!lines.length) {
      return { ok: false, error: 'Nessuna riga materiale trovata. Il file potrebbe essere un export parziale.' };
    }

    return { ok: true, header, lines, warnings };
  },

  /* ─── TESTATA ─────────────────────────────────────────────────────
     Numero ordine e commessa si riconoscono dal loro stesso formato
     (ODP…/ODV…), più affidabile della posizione in un blocco di celle unite.
     L'articolo finito si legge dalla sezione "Articoli da Realizzare".      */
  _parseHeader(rows, warnings) {
    const h = { odp_num: '', commessa: '', article_code: '', article_desc: '', lot: '', qty_planned: '', um: '' };
    const scanLimit = Math.min(rows.length, 30);

    for (let r = 0; r < scanLimit; r++) {
      for (const cell of rows[r]) {
        const t = String(cell ?? '').trim();
        if (!h.odp_num && /^ODP\s*\d+$/i.test(t)) h.odp_num = t.toUpperCase();
        if (!h.commessa && /^ODV[\w\-_]+$/i.test(t)) h.commessa = t.toUpperCase();
      }
      if (h.odp_num && h.commessa) break;
    }

    // Sezione "Articoli da Realizzare": la riga utile è quella dopo l'intestazione
    for (let r = 0; r < scanLimit; r++) {
      const first = this._norm(rows[r][0]);
      if (first !== 'ARTICOLO') continue;
      const cols = rows[r].map(c => this._norm(c));
      if (!cols.includes('LOTTO')) continue;          // è l'altra intestazione (materiali)
      const next = rows[r + 1];
      if (!next) break;
      h.article_code = String(next[0] ?? '').trim();
      h.article_desc = String(next[1] ?? '').trim();
      h.lot          = String(next[2] ?? '').trim();
      const nums = this._numericCells(next);
      if (nums.length) h.qty_planned = String(nums[nums.length - 1].value);
      const umCell = next.find(c => ['KG', 'GR', 'PZ', 'LT'].includes(this._norm(c)));
      h.um = umCell ? this._norm(umCell) : '';
      break;
    }
    if (!h.article_code) warnings.push('Articolo finito non identificato in testata.');
    return h;
  },

  /* ─── RIGHE MATERIALI E BLOCCHI LOTTO ─────────────────────────────
     Si parte dall'intestazione che contiene "CONSERVAZIONE" (esclusiva della
     sezione materiali) e si scorre fino ai blocchi di fine documento.        */
  _parseLines(rows, warnings) {
    const STOP = ['N°OPERAZIONE', 'N.OPERAZIONE', 'PRELIEVO CAMPIONI', 'QUANTITÀ PRODOTTA', 'QUANTITA PRODOTTA'];
    let start = -1;
    for (let r = 0; r < rows.length; r++) {
      const cols = rows[r].map(c => this._norm(c));
      if (cols[0] === 'ARTICOLO' && cols.some(c => c === 'CONSERVAZIONE')) { start = r + 1; break; }
    }
    if (start === -1) return [];

    const lines = [];
    let current = null;

    for (let r = start; r < rows.length; r++) {
      const row = rows[r];
      const first = this._norm(row[0]);
      if (STOP.includes(first)) break;
      if (row.every(c => this._isBlank(c))) continue;

      // ── Riga LOTTO ──
      if (first === 'LOTTO') {
        if (!current) {
          warnings.push(`Riga ${r + 1}: blocco lotto senza riga articolo di riferimento, ignorato.`);
          continue;
        }
        const lotCode = String(row[1] ?? '').trim();
        if (!lotCode) continue;
        const nums = this._numericCells(row);
        /* La riga lotto porta due numeri: quantità e seriale di scadenza.
           La quantità precede l'etichetta "Scad.", la scadenza la segue.
           Si individua l'etichetta invece di fidarsi dell'ordine. */
        const scadIdx = row.findIndex(c => this._norm(c).startsWith('SCAD'));
        let qty = null, expSerial = null;
        for (const n of nums) {
          if (scadIdx !== -1 && n.idx > scadIdx) { if (expSerial === null) expSerial = n.value; }
          else if (qty === null) qty = n.value;
        }
        const stateIdx = row.findIndex(c => this._norm(c) === 'STATO');
        current.lots.push({
          lot_code: lotCode,
          supplier_lot: String(row[3] ?? '').trim(),
          um: (row.slice(4, 7).map(c => this._norm(c)).find(c => ['KG', 'GR', 'PZ', 'LT'].includes(c))) || current.um,
          qty: qty ?? 0,
          expiry_iso: this.excelSerialToISO(expSerial),
          state: stateIdx !== -1 ? String(row[stateIdx + 1] ?? '').trim() : ''
        });
        continue;
      }

      // ── Riga ARTICOLO ──
      // Un codice articolo è la prima cella non vuota di una riga che porta
      // almeno un numero (il totale) e una descrizione.
      const code = String(row[0] ?? '').trim();
      if (!code) continue;
      const nums = this._numericCells(row);
      if (!nums.length) continue;

      const total = nums[nums.length - 1].value;
      const totalIdx = nums[nums.length - 1].idx;
      /* Unità di misura del totale: l'etichetta immediatamente precedente. */
      let um = '';
      for (let c = totalIdx - 1; c >= 0; c--) {
        const t = this._norm(row[c]);
        if (['KG', 'GR', 'PZ', 'LT'].includes(t)) { um = t; break; }
        if (!this._isBlank(row[c])) break;
      }
      const qtyPerUnit = nums.length > 1 ? nums[nums.length - 2].value : null;

      current = {
        article_code: code,
        category: String(row[1] ?? '').trim(),
        description: String(row[2] ?? '').trim(),
        um: um || 'KG',
        qty_per_unit: qtyPerUnit,
        total_qty: total,
        lots: []
      };
      lines.push(current);
    }

    this._checkMissingLots(lines, warnings);
    return lines;
  },

  /* ─── RIGHE SENZA LOTTO ASSEGNATO ─────────────────────────────────
     v2.5.1 — Il controllo di coerenza sulla somma dei lotti e' stato RIMOSSO.

     Motivo, verificato sul campo: generava un avviso per ogni riga in cui i
     decimali non tornavano al millesimo, cioe' costantemente. L'export Sage
     arrotonda a sei decimali e i granulati sono espressi in grammi mentre il
     totale di riga e' in chilogrammi: la differenza residua era quasi sempre
     rumore di conversione, non un errore reale. Un avviso che scatta sempre
     smette di essere un avviso e insegna a ignorare anche quelli veri.

     Resta il solo controllo che porta informazione utile: una riga senza
     alcun lotto assegnato non e' prelevabile e va risolta a monte.
     ───────────────────────────────────────────────────────────────── */
  _checkMissingLots(lines, warnings) {
    for (const line of lines) {
      if (!line.lots.length) {
        warnings.push(`${line.article_code} — ${line.description}: nessun lotto assegnato nell\u2019ordine.`);
      }
    }
  }
};

// ═══════════════════════════════════════════════════════════════════
// © Andrea Sacchetti — Dietopack S.r.l.
// modulo PickRoute — v2.5.0
// Costruzione del percorso di prelievo a serpentina
//
// REGOLE FISSATE IN SEDE DI ANALISI, qui rese esecutive:
//  · i lotti dell'ODP si rispettano sempre; il FEFO non si applica, perché
//    l'assegnazione del lotto è già stata decisa a monte da Sage X3;
//  · un percorso per sito, siti nell'ordine configurato dall'operatore;
//  · dentro il sito: zone in ordine di configurazione, corsie crescenti,
//    campate a serpentina (crescenti sulle dispari, decrescenti sulle pari),
//    livelli dal basso verso l'alto;
//  · articolo+lotto in più ubicazioni: UNA tappa sulla più conveniente, le
//    altre elencate come alternative e accettate in scansione;
//  · quarantena e impegno su DDT: segnalati, mai percorsi;
//  · la quantità non è un criterio di esclusione — Warehouse Mapper traccia la
//    presenza dei colli, i kg stanno su Sage.
// ═══════════════════════════════════════════════════════════════════

const PickRoute = {

  SITE_ORDER_KEY: 'wm_pick_site_order',

  /* Ordine dei siti: preferenza dell'operatore, ripulita dai siti non più
     esistenti e completata con quelli nuovi in coda. */
  getSiteOrder() {
    const existing = Store.getSites().map(s => s.id);
    let saved = [];
    try {
      const raw = localStorage.getItem(this.SITE_ORDER_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (err) {
      console.warn('[WM] PickRoute: ordine siti non leggibile, si usa quello predefinito', err);
    }
    if (!Array.isArray(saved)) saved = [];
    const ordered = saved.filter(id => existing.includes(id));
    for (const id of existing) if (!ordered.includes(id)) ordered.push(id);
    return ordered;
  },

  setSiteOrder(order) {
    try { localStorage.setItem(this.SITE_ORDER_KEY, JSON.stringify(order)); }
    catch (err) { console.warn('[WM] PickRoute: ordine siti non salvabile', err); }
  },

  /* ─── COMPARATORE A SERPENTINA ────────────────────────────────────
     Opera su coordinate reali fornite da Store.buildLocationGeometry(),
     non sul testo del codice ubicazione.                                 */
  _serpentineCompare(geo, siteRank) {
    return (a, b) => {
      const ga = geo.get(a.location_code);
      const gb = geo.get(b.location_code);
      // Ubicazione priva di geometria (zona rimossa dopo il posizionamento):
      // in coda, senza far fallire l'ordinamento.
      if (!ga && !gb) return a.location_code.localeCompare(b.location_code);
      if (!ga) return 1;
      if (!gb) return -1;

      const ra = siteRank.get(ga.site_id) ?? 999;
      const rb = siteRank.get(gb.site_id) ?? 999;
      if (ra !== rb) return ra - rb;
      if (ga.zone_idx !== gb.zone_idx) return ga.zone_idx - gb.zone_idx;
      if (ga.aisle !== gb.aisle) return ga.aisle - gb.aisle;
      // Serpentina: sulle corsie pari si torna indietro
      if (ga.bay !== gb.bay) {
        return (ga.aisle % 2 === 1) ? ga.bay - gb.bay : gb.bay - ga.bay;
      }
      if (ga.level_idx !== gb.level_idx) return ga.level_idx - gb.level_idx;
      return a.location_code.localeCompare(b.location_code);
    };
  },

  /* ─── COSTRUZIONE ─────────────────────────────────────────────────
     Ritorna { stops, offroute, notes }.
       stops    — tappe percorribili, già ordinate
       offroute — righe che finiscono in coda al percorso
       notes    — segnalazioni conoscitive (quarantena, DDT pendenti)
     ───────────────────────────────────────────────────────────────── */
  build(parsedLines) {
    const geo = Store.buildLocationGeometry();
    const siteOrder = this.getSiteOrder();
    const siteRank = new Map(siteOrder.map((id, i) => [id, i]));

    const stops = [];
    const offroute = [];
    const notes = [];

    for (const line of parsedLines) {
      if (!line.lots.length) {
        offroute.push({
          article_code: line.article_code,
          description: line.description,
          lot_code: '—',
          kg_required: line.total_qty,
          um: line.um,
          reason: 'no_lot_in_odp',
          detail: 'L\u2019ordine non assegna alcun lotto a questa riga.'
        });
        continue;
      }

      for (const lot of line.lots) {
        const itemKey = `${String(line.article_code).toUpperCase().trim()}#${String(lot.lot_code).trim()}`;
        const found = Store.getItemByKey(itemKey);

        const base = {
          article_code: line.article_code,
          description: line.description,
          lot_code: lot.lot_code,
          kg_required: lot.qty,
          um: lot.um || line.um
        };

        if (!found.length) {
          /* Il lotto non c'è. L'articolo però potrebbe esserci con altri lotti:
             è informazione che costa nulla e dice all'operatore se cercare
             altrove o se è l'ODP a essere disallineato. */
          const otherLots = Store.getLotsForArticle(line.article_code);
          offroute.push({
            ...base,
            reason: otherLots.length ? 'lot_absent_other_lots' : 'not_mapped',
            detail: otherLots.length
              ? `Articolo presente a sistema con altri lotti: ${otherLots.join(', ')}.`
              : 'Articolo/lotto non mappato — stoccato fuori dalle aree gestite.',
            other_lots: otherLots
          });
          continue;
        }

        /* Quarantena e impegno su DDT: si escludono dalle ubicazioni
           percorribili, ma si dice all'operatore che la merce esiste. */
        const usable = [];
        for (const it of found) {
          if (Store.isItemQuarantined(it.item_key)) {
            notes.push({
              ...base,
              location_code: it.location_code,
              reason: 'quarantine',
              detail: 'In quarantena — non prelevabile.'
            });
            continue;
          }
          if (Store.getAvailableQty(it.location_code, it.item_key) <= 0) {
            notes.push({
              ...base,
              location_code: it.location_code,
              reason: 'pending_outbound',
              detail: 'Impegnata su DDT di reso/spedizione non ancora evaso — non prelevabile.'
            });
            continue;
          }
          usable.push(it);
        }

        if (!usable.length) {
          offroute.push({
            ...base,
            reason: 'all_blocked',
            detail: 'Tutte le ubicazioni sono in quarantena o impegnate su DDT pendenti.'
          });
          continue;
        }

        const cmp = this._serpentineCompare(geo, siteRank);
        const sorted = [...usable].sort(cmp);
        const chosen = sorted[0];
        const g = geo.get(chosen.location_code);

        stops.push({
          seq: 0,                               // assegnato dopo l'ordinamento globale
          site_id: g?.site_id || '',
          location_code: chosen.location_code,
          item_key: chosen.item_key,
          article_code: chosen.article_code,
          article_description: chosen.article_description || line.description,
          lot_code: chosen.lot_code,
          expiry_iso: chosen.expiry_date || lot.expiry_iso || '',
          kg_required: lot.qty,
          um: lot.um || line.um,
          alternatives: sorted.slice(1).map(a => ({
            location_code: a.location_code,
            item_key: a.item_key,
            qty_available: Store.getAvailableQty(a.location_code, a.item_key)
          })),
          qty_available: Store.getAvailableQty(chosen.location_code, chosen.item_key),
          status: 'pending',
          reason: '',
          forced_note: '',
          qty_picked: 0,
          done_at: null
        });
      }
    }

    stops.sort(this._serpentineCompare(geo, siteRank));
    stops.forEach((s, i) => { s.seq = i + 1; });

    return { stops, offroute, notes };
  },

  /* Etichette dei motivi, in un solo posto: usate da UI e report. */
  REASON_LABELS: Object.freeze({
    not_mapped:            'Fuori mappatura',
    lot_absent_other_lots: 'Lotto assente',
    no_lot_in_odp:         'Nessun lotto nell\u2019ordine',
    all_blocked:           'Non prelevabile',
    quarantine:            'In quarantena',
    pending_outbound:      'Impegnata su DDT',
    marked_missing:        'Non trovato dall\u2019operatore'
  })
};

// ═══════════════════════════════════════════════════════════════════
// © Andrea Sacchetti — Dietopack S.r.l.
// modulo ScanGuard — v2.1.0
// Protezione dalla doppia scansione involontaria.
//
// Nella v2.0.2 due scansioni identiche ravvicinate in Posiziona sommavano
// silenziosamente la giacenza: l'operatore che non vedeva il riscontro
// d'angolo ripeteva la scansione e raddoppiava i colli. Qui ogni operazione
// registra una firma; una firma ripetuta entro la finestra richiede una
// conferma esplicita.
// ═══════════════════════════════════════════════════════════════════

const ScanGuard = {
  WINDOW_MS: 3000,
  _last: new Map(),

  /* Ritorna i millisecondi trascorsi se la stessa firma e' recente, altrimenti null. */
  check(signature) {
    const prev = this._last.get(signature);
    if (prev === undefined) return null;
    const elapsed = Date.now() - prev;
    return elapsed <= this.WINDOW_MS ? elapsed : null;
  },

  mark(signature) {
    this._last.set(signature, Date.now());
    // Pulizia opportunistica: la mappa non deve crescere per tutta la sessione
    if (this._last.size > 200) {
      const cutoff = Date.now() - this.WINDOW_MS;
      for (const [k, v] of this._last) if (v < cutoff) this._last.delete(k);
    }
  },

  clear(signature = null) {
    if (signature === null) this._last.clear();
    else this._last.delete(signature);
  }
};

// © Andrea Sacchetti — Dietopack S.r.l.
// modulo Auth — Pathfinder Warehouse Mapper v2.7.0 [G6]
//
// Verifica del PIN operatore. Tre righe di sostanza e una lunga premessa,
// perche' la premessa e' cio' che impedisce di usare questo modulo per
// qualcosa che non puo' reggere.
//
// CHE COSA GARANTISCE. Che il PIN in chiaro non venga mai scritto: ne' in
// IndexedDB, ne' in localStorage, ne' nel registro movimenti, ne' negli
// export. Sul disco resta lo SHA-256 di salt+':'+pin con un salt casuale
// diverso per ogni operatore, quindi due persone con lo stesso PIN hanno
// hash diversi e una tabella precalcolata non serve a nulla.
//
// CHE COSA NON GARANTISCE. Sei cifre sono un milione di combinazioni: un
// attaccante con accesso al file del database e tempo macchina le prova
// tutte. Questo non e' un difetto da correggere con piu' iterazioni, e'
// il livello giusto per cio' che il PIN deve fare — dire QUALE operatore
// sta lavorando su un terminale di reparto, non difendere un segreto da
// chi ha gia' in mano il computer. Se un domani i dati staranno su un
// server condiviso, l'autenticazione sara' quella del server e questo
// modulo diventera' un ricordo. Nessuno lo scambi per crittografia.
//
// crypto.subtle e' nativo e funziona offline: nessuna libreria, nessuna
// rete. Richiede pero' un contesto sicuro — https o file:// o localhost.
// Su http:// verso un host remoto non esiste, e in quel caso l'app lo dice
// invece di far finta di verificare qualcosa.
// ═══════════════════════════════════════════════════════════════════

const Auth = {
  PIN_LENGTH: 6,

  /* PIN palesemente indovinabili. Non e' una policy di sicurezza: e' un
     paracadute contro il "tanto tengo 000000", che vanificherebbe l'intera
     tracciabilita' senza che nessuno se ne accorga. */
  _TRIVIAL: new Set(['000000', '123456', '654321', '111111', '112233', '123123']),

  available() {
    return Boolean(globalThis.crypto?.subtle && globalThis.crypto?.getRandomValues);
  },

  /* Ritorna null se il PIN va bene, altrimenti il motivo del rifiuto. */
  validatePin(pin) {
    const v = String(pin ?? '');
    if (!/^\d{6}$/.test(v)) return 'Il PIN deve essere di esattamente 6 cifre.';
    if (this._TRIVIAL.has(v)) return 'PIN troppo semplice: scegline uno non prevedibile.';
    if (/^(\d)\1{5}$/.test(v)) return 'PIN troppo semplice: sei cifre uguali.';
    return null;
  },

  _hex(buffer) {
    return [...new Uint8Array(buffer)].map(b => b.toString(16).padStart(2, '0')).join('');
  },

  newSalt() {
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return this._hex(bytes.buffer);
  },

  async hashPin(pin, salt) {
    const data = new TextEncoder().encode(`${salt}:${pin}`);
    return this._hex(await crypto.subtle.digest('SHA-256', data));
  },

  /* Confronto a tempo costante. Su un applicativo locale il timing attack e'
     teorico, ma il costo di scriverlo bene e' due righe. */
  _equal(a, b) {
    if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
    let diff = 0;
    for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return diff === 0;
  },

  async verifyPin(operator, pin) {
    if (!operator?.pin_hash || !operator?.pin_salt) return false;
    const h = await this.hashPin(pin, operator.pin_salt);
    return this._equal(h, operator.pin_hash);
  },

  /* Prepara i campi da scrivere sul record operatore. Il chiamante non vede
     mai il PIN dopo questa chiamata: entra qui e ne esce solo l'hash. */
  async buildPinFields(pin) {
    const salt = this.newSalt();
    return { pin_salt: salt, pin_hash: await this.hashPin(pin, salt), pin_set_at: Date.now() };
  }
};

// ═══════════════════════════════════════════════════════════════════
// © Andrea Sacchetti — Dietopack S.r.l.
// modulo Session — Pathfinder Warehouse Mapper v2.7.0 [G6]
//
// Chi lavora al terminale si allontana: va a prendere un pallet, risponde
// al telefono, finisce il turno. Il terminale resta acceso con la sessione
// di qualcun altro aperta, e il movimento successivo viene firmato dalla
// persona sbagliata. In un sistema che deve reggere un audit questa non e'
// una scomodita': e' un record falso.
//
// Allo scadere dell'inattivita' l'applicazione SALVA — perche' il lavoro
// fatto fin li' e' buono e non va perso — e si blocca dietro un popup che
// non si puo' aggirare. Non un avviso: un blocco.
//
// Il timeout e' preferenza di DISPOSITIVO (localStorage), non dato
// aziendale: un tablet in reparto e un PC in ufficio hanno esigenze
// diverse e non c'e' ragione perche' la scelta viaggi negli export.
// ═══════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════
// © Andrea Sacchetti — Dietopack S.r.l.
// modulo Vault — Pathfinder Warehouse Mapper v2.8.0 [H4]
//
// COPIA ESTERNA DEI DATI.
//
// Il problema che risolve e' il piu' semplice e il piu' grave di tutti:
// fino alla v2.7.0 esisteva UNA sola copia dei dati, su UNA sola macchina.
// I backup automatici OPFS stanno nello stesso profilo browser di IndexedDB
// e se ne vanno con lo stesso clic; un guasto al disco li porta via insieme.
// Per una tracciabilita' che deve reggere sei anni non e' abbastanza.
//
// Qui l'operatore sceglie UNA VOLTA una cartella — tipicamente dentro
// OneDrive, quindi replicata fuori dall'edificio — e da quel momento
// l'applicativo ci scrive da solo.
//
// PERCHE' NON UN UNICO FILE. A 500 movimenti al giorno l'export completo
// arriva a ~370 MB al sesto anno. Riscriverlo ogni giorno significherebbe
// far transitare centinaia di MB su una cartella sincronizzata, ogni giorno,
// per riscrivere in massima parte dati identici a quelli del giorno prima.
// Il formato e' quindi incrementale, e sfrutta l'unica proprieta' davvero
// utile del registro: un movimento passato NON CAMBIA PIU'.
//
//   wm-stato-AAAA-MM-GG.json        fotografia del presente (giacenze,
//                                   anagrafiche, ubicazioni, quarantene,
//                                   DDT, operatori). Pochi MB. Se ne
//                                   conservano 30.
//   movimenti/wm-mov-AAAA-MM.jsonl  un file per mese, una riga JSON per
//                                   movimento. Viene riscritto SOLO il mese
//                                   in corso: i mesi chiusi si scrivono una
//                                   volta e non si toccano mai piu'.
//   wm-manifest.json                conteggi, intervallo di date coperto e
//                                   impronta SHA-256 dell'ultimo stato.
//                                   Serve ad accorgersi che un backup e'
//                                   incompleto PRIMA di averne bisogno.
//
// Sei anni occupano ~320 MB distribuiti su 72 file mensili, e nessuna
// singola scrittura supera i pochi MB.
//
// JSONL e non JSON per i movimenti: una riga per record si appende, si
// legge a pezzi e sopravvive a un troncamento — se l'ultima riga e' rotta si
// perde quella, non l'intero mese.
//
// NOTA SUI PERMESSI. Il permesso sulla cartella non sopravvive alla chiusura
// del browser: al riavvio Chrome lo rimette in stato "prompt" e serve un
// gesto dell'utente per riattivarlo. Non e' aggirabile ed e' giusto che sia
// cosi'. L'applicativo se ne accorge e lo chiede con un pulsante, invece di
// fallire in silenzio.
// ═══════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════
// © Andrea Sacchetti — Dietopack S.r.l.
// modulo Tabs — Pathfinder Warehouse Mapper v2.8.0 [H6]
//
// UNA SOLA ISTANZA PUO' SCRIVERE.
//
// L'applicativo tiene una cache in memoria e la usa per rispondere a ogni
// lettura. Due schede aperte significano due cache che non si parlano: la
// seconda non vede le scritture della prima e continua a mostrare — e a
// usare per i propri calcoli — uno stato superato. Su un terminale di
// reparto, dove le finestre non si chiudono mai e qualcuno riapre il file
// "per sicurezza", e' una perdita di dati che non lascia traccia.
//
// La soluzione non e' sincronizzare le cache (sarebbe un piccolo sistema
// distribuito, con tutti i suoi modi di sbagliare): e' stabilire che a
// scrivere sia una sola istanza. Le altre restano utilizzabili in lettura,
// con una fascia che dice chiaramente cosa sta succedendo, e possono
// prendere il comando solo con un atto esplicito di chi le sta guardando.
//
// BroadcastChannel non e' un lock e non pretende di esserlo: e' un annuncio.
// Basta, perche' il caso da evitare non e' la corsa di due millisecondi, e'
// la finestra dimenticata aperta da ieri.
// ═══════════════════════════════════════════════════════════════════

const Tabs = {
  CHANNEL: 'wm-instances',
  _ch: null,
  _id: Math.random().toString(36).slice(2) + Date.now().toString(36),
  readOnly: false,
  _onChange: null,

  init(onChange) {
    if (typeof BroadcastChannel !== 'function') return;   // niente supporto: si prosegue come prima
    this._onChange = onChange;
    this._ch = new BroadcastChannel(this.CHANNEL);
    this._ch.onmessage = (e) => this._receive(e.data);
    /* Ci si annuncia e si aspetta un attimo: se qualcuno risponde "ci sono
       gia' io e sto scrivendo", questa istanza si mette in sola lettura. */
    this._post({ type: 'hello', id: this._id });
    window.addEventListener('pagehide', () => this._post({ type: 'bye', id: this._id }));
  },

  _post(msg) { try { this._ch?.postMessage(msg); } catch {} },

  _receive(msg) {
    if (!msg || msg.id === this._id) return;
    switch (msg.type) {
      case 'hello':
        /* Un nuovo arrivato: se comando io, glielo dico. */
        if (!this.readOnly) this._post({ type: 'iam-writer', id: this._id });
        break;
      case 'iam-writer':
        if (!this.readOnly) this._setReadOnly(true);
        break;
      case 'released':
        /* Chi scriveva ha ceduto o e' uscito: chi resta puo' riprendere. */
        if (this.readOnly) this._setReadOnly(false);
        break;
      case 'bye':
        if (this.readOnly) this._post({ type: 'hello', id: this._id });
        break;
    }
  },

  _setReadOnly(v) {
    this.readOnly = v;
    this._onChange?.(v);
  },

  /* Presa di comando esplicita: le altre istanze passano in sola lettura. */
  takeOver() {
    this._setReadOnly(false);
    this._post({ type: 'iam-writer', id: this._id });
  },

  release() {
    this._post({ type: 'released', id: this._id });
  }
};

const Vault = {
  HANDLE_KEY: 'vaultDirHandle',      // in meta (IndexedDB: i handle sono clonabili)
  LAST_KEY: 'vaultLastBackup',
  STATE_KEEP: 30,                    // fotografie giornaliere conservate
  INTERVAL_MS: 20 * 60 * 60 * 1000,  // ~1 volta al giorno
  MOV_SUBDIR: 'movimenti',

  _handle: null,
  _busy: false,

  supported() {
    return typeof window.showDirectoryPicker === 'function';
  },

  /* ── Handle della cartella ─────────────────────────────────────── */
  async loadHandle() {
    if (this._handle) return this._handle;
    try {
      const row = await Persistence.get('meta', this.HANDLE_KEY);
      this._handle = row?.value || null;
    } catch { this._handle = null; }
    return this._handle;
  },

  async chooseFolder() {
    if (!this.supported()) throw new Error('Il browser non consente di scegliere una cartella di destinazione.');
    const handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'wm-vault' });
    /* Verifica subito di poterci scrivere: scoprirlo al primo backup
       notturno significherebbe scoprirlo quando non serve a niente. */
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') throw new Error('Permesso di scrittura negato sulla cartella scelta.');
    this._handle = handle;
    await Persistence.put('meta', { key: this.HANDLE_KEY, value: handle });
    return handle;
  },

  async forgetFolder() {
    this._handle = null;
    await Persistence.put('meta', { key: this.HANDLE_KEY, value: null });
  },

  /* 'granted' | 'prompt' | 'denied' | 'none' (nessuna cartella scelta) */
  async permissionState() {
    const h = await this.loadHandle();
    if (!h) return 'none';
    try { return await h.queryPermission({ mode: 'readwrite' }); }
    catch { return 'denied'; }
  },

  /* Richiede il permesso. Va invocata da un gesto dell'utente. */
  async requestPermission() {
    const h = await this.loadHandle();
    if (!h) return 'none';
    try { return await h.requestPermission({ mode: 'readwrite' }); }
    catch { return 'denied'; }
  },

  /* ── Scrittura ─────────────────────────────────────────────────── */
  async _writeFile(dirHandle, name, contents) {
    const fh = await dirHandle.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    try { await w.write(contents); } finally { await w.close(); }
  },

  async _sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  },

  _monthKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  },

  /* Esegue il backup completo secondo la politica descritta in testa.
     `onProgress(testo)` serve a non lasciare l'operatore davanti a una
     finestra ferma mentre si scrivono decine di MB. */
  async runBackup({ force = false, onProgress = null } = {}) {
    if (this._busy) throw new Error('Un backup è già in corso.');
    const dir = await this.loadHandle();
    if (!dir) throw new Error('Nessuna cartella di backup configurata.');
    const perm = await this.permissionState();
    if (perm !== 'granted') throw new Error('Permesso sulla cartella non attivo: riattivarlo dal pulsante in Configurazione → Dati.');
    if (!force && !(await this.isDue())) return null;

    this._busy = true;
    const say = (t) => { onProgress?.(t); };
    try {
      const oggi = new Date().toISOString().slice(0, 10);

      // ── 1. Fotografia del presente, senza il registro ──
      say('Preparazione della fotografia dello stato…');
      const stato = await Store.exportAll({ includeMovLog: false });
      stato._kind = 'stato';
      const statoJson = JSON.stringify(stato);
      await this._writeFile(dir, `wm-stato-${oggi}.json`, statoJson);

      // ── 2. Movimenti, un file per mese ──
      say('Lettura del registro movimenti…');
      const movDir = await dir.getDirectoryHandle(this.MOV_SUBDIR, { create: true });
      const perMese = new Map();
      let totMov = 0;
      await Store.eachMovement(rows => {
        for (const m of rows) {
          const k = this._monthKey(m.ts);
          let arr = perMese.get(k);
          if (!arr) { arr = []; perMese.set(k, arr); }
          arr.push(m);
          totMov++;
        }
        say(`Lettura del registro movimenti… ${totMov.toLocaleString('it-IT')}`);
      });

      /* Si riscrivono solo i mesi che non risultano gia' presenti con lo
         stesso numero di righe. I mesi chiusi vengono cosi' scritti una
         volta sola nella vita del backup, e OneDrive non si vede passare
         sotto lo stesso identico file ogni notte. */
      const attesi = {};
      let scritti = 0;
      for (const [mese, righe] of [...perMese.entries()].sort()) {
        attesi[mese] = righe.length;
        const nome = `wm-mov-${mese}.jsonl`;
        let esistenti = -1;
        try {
          const fh = await movDir.getFileHandle(nome);
          const testo = await (await fh.getFile()).text();
          esistenti = testo ? testo.trimEnd().split('\n').length : 0;
        } catch { /* non esiste ancora */ }
        if (esistenti === righe.length) continue;
        righe.sort((a, b) => a.ts - b.ts);
        say(`Scrittura di ${nome} (${righe.length.toLocaleString('it-IT')} movimenti)…`);
        await this._writeFile(movDir, nome, righe.map(r => JSON.stringify(r)).join('\n') + '\n');
        scritti++;
      }

      // ── 3. Manifest di verifica ──
      say('Scrittura del manifest…');
      const manifest = {
        _format: 'warehouse-mapper-vault-1',
        _app: 'Pathfinder Warehouse Mapper',
        _appVersion: '2.8.0',
        aggiornato: new Date().toISOString(),
        stato_file: `wm-stato-${oggi}.json`,
        stato_sha256: await this._sha256(statoJson),
        stato_counts: stato._counts,
        movimenti_totali: totMov,
        movimenti_per_mese: attesi,
        mesi: Object.keys(attesi).length
      };
      await this._writeFile(dir, 'wm-manifest.json', JSON.stringify(manifest, null, 2));

      // ── 4. Rotazione delle fotografie ──
      await this._rotateStates(dir);

      const now = Date.now();
      await Persistence.put('meta', { key: this.LAST_KEY, value: now });
      Store._applyToCache('meta', 'put', { key: this.LAST_KEY, value: now });
      return { ts: now, movimenti: totMov, mesiScritti: scritti, mesi: Object.keys(attesi).length, statoBytes: statoJson.length };
    } finally {
      this._busy = false;
    }
  },

  /* Le fotografie sono ridondanti fra loro: ne bastano trenta per poter
     tornare indietro di un mese. I file dei movimenti non si toccano MAI. */
  async _rotateStates(dir) {
    const nomi = [];
    for await (const [name, h] of dir.entries()) {
      if (h.kind === 'file' && /^wm-stato-\d{4}-\d{2}-\d{2}\.json$/.test(name)) nomi.push(name);
    }
    nomi.sort().reverse();
    for (const n of nomi.slice(this.STATE_KEEP)) {
      try { await dir.removeEntry(n); } catch (e) { console.warn('[WM] rotazione stato:', n, e); }
    }
    return Math.max(0, nomi.length - this.STATE_KEEP);
  },

  async lastBackupTs() {
    try {
      const row = await Persistence.get('meta', this.LAST_KEY);
      return row?.value || null;
    } catch { return null; }
  },

  async isDue() {
    const last = await this.lastBackupTs();
    return !last || (Date.now() - last) >= this.INTERVAL_MS;
  },

  /* ── Lettura, per il ripristino ─────────────────────────────────── */
  async readManifest() {
    const dir = await this.loadHandle();
    if (!dir) return null;
    try {
      const fh = await dir.getFileHandle('wm-manifest.json');
      return JSON.parse(await (await fh.getFile()).text());
    } catch { return null; }
  },

  /* Ricompone un pacchetto di import completo dalla cartella: fotografia
     piu' scelta dei mesi. E' l'operazione inversa di runBackup, e l'unica
     ragione per cui il backup ha senso di esistere. */
  async buildRestorePackage({ statoFile = null, onProgress = null } = {}) {
    const dir = await this.loadHandle();
    if (!dir) throw new Error('Nessuna cartella di backup configurata.');
    const say = (t) => onProgress?.(t);

    let nome = statoFile;
    if (!nome) {
      const manifest = await this.readManifest();
      nome = manifest?.stato_file;
    }
    if (!nome) {
      const nomi = [];
      for await (const [n, h] of dir.entries()) {
        if (h.kind === 'file' && /^wm-stato-\d{4}-\d{2}-\d{2}\.json$/.test(n)) nomi.push(n);
      }
      nomi.sort().reverse();
      nome = nomi[0];
    }
    if (!nome) throw new Error('Nella cartella non è stata trovata alcuna fotografia dello stato.');

    say(`Lettura di ${nome}…`);
    const fh = await dir.getFileHandle(nome);
    const data = JSON.parse(await (await fh.getFile()).text());

    say('Lettura dei movimenti…');
    const mov = [];
    let fileMensili = 0;
    try {
      const movDir = await dir.getDirectoryHandle(this.MOV_SUBDIR);
      const files = [];
      for await (const [n, h] of movDir.entries()) {
        if (h.kind === 'file' && /^wm-mov-\d{4}-\d{2}\.jsonl$/.test(n)) files.push(n);
      }
      files.sort();
      fileMensili = files.length;
      for (const f of files) {
        say(`Lettura di ${f}…`);
        const testo = await (await (await movDir.getFileHandle(f)).getFile()).text();
        for (const riga of testo.split('\n')) {
          const t = riga.trim();
          if (!t) continue;
          try { mov.push(JSON.parse(t)); }
          catch { /* riga troncata: si perde quella, non il mese */ }
        }
      }
    } catch { /* sottocartella assente */ }

    /* Se non e' stato trovato NEMMENO UN file mensile, il registro non viene
       messo nel pacchetto: l'assenza dei file e' molto piu' probabilmente una
       cartella incompleta che un magazzino senza storia, e nel dubbio non si
       cancellano sei anni di movimenti. Con la chiave omessa, importAll lascia
       il registro dov'e'. */
    if (fileMensili > 0) {
      data.mov_log = mov;
    } else {
      delete data.mov_log;
      say('Nessun file mensile trovato: il registro esistente NON verrà toccato.');
    }
    data._counts = Store._countsOf(data);
    if (fileMensili === 0) delete data._counts.mov_log;
    data._movFileMensili = fileMensili;
    say(`Pacchetto pronto: ${mov.length.toLocaleString('it-IT')} movimenti da ${fileMensili} file mensili.`);
    return data;
  },

  async listStates() {
    const dir = await this.loadHandle();
    if (!dir) return [];
    const out = [];
    for await (const [name, h] of dir.entries()) {
      if (h.kind === 'file' && /^wm-stato-\d{4}-\d{2}-\d{2}\.json$/.test(name)) {
        const f = await h.getFile();
        out.push({ name, size: f.size, modified: f.lastModified });
      }
    }
    return out.sort((a, b) => b.name.localeCompare(a.name));
  }
};

const Session = {
  KEY: 'wm_session_timeout_min',
  DEFAULT_MIN: 10,
  MIN_MIN: 1,
  MAX_MIN: 120,

  _timer: null,
  _minutes: null,
  _onExpire: null,
  _armed: false,

  /* 0 = disattivato. Valori fuori scala vengono riportati nell'intervallo:
     un file di preferenze manipolato non deve poter disattivare il blocco
     scrivendo "0.0001". */
  getTimeoutMinutes() {
    if (this._minutes !== null) return this._minutes;
    let v = this.DEFAULT_MIN;
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw !== null) {
        const n = parseInt(raw, 10);
        if (Number.isFinite(n)) v = n === 0 ? 0 : Math.min(this.MAX_MIN, Math.max(this.MIN_MIN, n));
      }
    } catch { /* localStorage disabilitato → default */ }
    this._minutes = v;
    return v;
  },

  setTimeoutMinutes(min) {
    const n = parseInt(min, 10);
    const v = !Number.isFinite(n) || n === 0 ? 0 : Math.min(this.MAX_MIN, Math.max(this.MIN_MIN, n));
    this._minutes = v;
    try { localStorage.setItem(this.KEY, String(v)); } catch {}
    this.reset();
    return v;
  },

  /* onExpire e' asincrona: deve poter salvare prima di bloccare. */
  init(onExpire) {
    this._onExpire = onExpire;
    const bump = () => this.reset();
    for (const ev of ['mousedown', 'keydown', 'touchstart', 'wheel']) {
      document.addEventListener(ev, bump, { capture: true, passive: true });
    }
    this._armed = true;
    this.reset();
  },

  /* Sospende il conto alla rovescia: mentre il popup di sblocco e' aperto
     non ha senso far scadere di nuovo la sessione. */
  suspend() {
    this._armed = false;
    clearTimeout(this._timer);
    this._timer = null;
  },

  resume() {
    this._armed = true;
    this.reset();
  },

  reset() {
    if (!this._armed) return;
    clearTimeout(this._timer);
    const min = this.getTimeoutMinutes();
    if (min <= 0) return;                       // disattivato
    this._timer = setTimeout(() => { this._onExpire?.(); }, min * 60000);
  }
};
