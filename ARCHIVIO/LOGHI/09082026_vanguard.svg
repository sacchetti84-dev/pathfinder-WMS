<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="100%" height="100%">
  <defs>
    <!-- Gradienti Sfumati Multicolore Fluidi -->
    <linearGradient id="vanGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="vanGradTopDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>

    <linearGradient id="vanGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="vanGradLeftDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0991B1" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="vanGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="vanGradRightDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <linearGradient id="vanGradMicro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <style>
      .bg-light { fill: #F4F7F6; rx: 16px; }
      .title-vanguard { font-family: 'Geist', 'Inter', 'SF Pro Display', sans-serif; font-weight: 800; font-size: 46px; fill: #12171A; letter-spacing: 9px; }
      .subtitle-vanguard { font-family: 'Geist', 'Inter', 'SF Pro Text', sans-serif; font-weight: 600; font-size: 11px; fill: #8B5CF6; letter-spacing: 5px; }
      
      .fine-grid-van-light { stroke: #D0DCD7; stroke-width: 0.75; stroke-dasharray: 2 3; }
      .fine-axis-van-light { stroke: #8B5CF6; stroke-width: 0.8; opacity: 0.35; }
      .cube-edge-van-light { stroke: #F4F7F6; stroke-width: 1.2; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Container Sfondo Chiaro -->
  <rect width="820" height="250" class="bg-light" />

  <!-- RETICOLO CAD SFUMATO -->
  <g transform="translate(115, 125)">
    <line x1="-80" y1="-46" x2="80" y2="46" class="fine-grid-van-light" />
    <line x1="-80" y1="46" x2="80" y2="-46" class="fine-grid-van-light" />
    <line x1="0" y1="-90" x2="0" y2="90" class="fine-grid-van-light" />
    
    <line x1="0" y1="-80" x2="0" y2="80" class="fine-axis-van-light" />
    <line x1="-69" y1="40" x2="69" y2="-40" class="fine-axis-van-light" />
    <line x1="-69" y1="-40" x2="69" y2="40" class="fine-axis-van-light" />

    <!-- CUBE 1: TOP (Viola / Magenta) -->
    <g transform="translate(0, -42)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#vanGradTop)" class="cube-edge-van-light" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#vanGradTopDark)" class="cube-edge-van-light" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#vanGradTop)" opacity="0.85" class="cube-edge-van-light" />
    </g>

    <!-- CUBE 2: LEFT (Cyan / Blu) -->
    <g transform="translate(-36, 20)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#vanGradLeft)" class="cube-edge-van-light" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#vanGradLeftDark)" class="cube-edge-van-light" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#vanGradLeft)" opacity="0.85" class="cube-edge-van-light" />
    </g>

    <!-- CUBE 3: RIGHT (Smeraldo / Cyan) -->
    <g transform="translate(36, 20)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#vanGradRight)" class="cube-edge-van-light" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#vanGradRightDark)" class="cube-edge-van-light" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#vanGradRight)" opacity="0.85" class="cube-edge-van-light" />
    </g>

    <!-- MICRO CUBI SATELLITE -->
    <g transform="translate(0, -68) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#vanGradMicro)" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#BE185D" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#F59E0B" />
    </g>
    <g transform="translate(-58, 32) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#vanGradMicro)" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#BE185D" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#F59E0B" />
    </g>
    <g transform="translate(58, 32) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#vanGradMicro)" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#BE185D" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#F59E0B" />
    </g>

    <circle cx="0" cy="-2" r="4.5" fill="#EC4899" />
  </g>

  <!-- TESTO VANGUARD -->
  <g transform="translate(255, 118)">
    <text x="0" y="10" class="title-vanguard">VANGUARD</text>
    <text x="4" y="36" class="subtitle-vanguard">MULTI-GRADIENT EDITION • WAREHOUSE MAPPING</text>
  </g>

  <!-- Accento Sfumato UI -->
  <line x1="260" y1="168" x2="310" y2="168" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
  <line x1="315" y1="168" x2="345" y2="168" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <line x1="350" y1="168" x2="365" y2="168" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
</svg>
