<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="100%" height="100%">
  <defs>
    <!-- Gradienti Oro Metallico & Champagne -->
    <linearGradient id="goldTopLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <linearGradient id="goldLeftLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#785200" />
    </linearGradient>

    <linearGradient id="goldRightLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>

    <style>
      .bg-light { fill: #F4F7F6; rx: 16px; }
      .title-commodore { font-family: 'Geist', 'Inter', 'SF Pro Display', sans-serif; font-weight: 800; font-size: 46px; fill: #12171A; letter-spacing: 9px; }
      .subtitle-commodore { font-family: 'Geist', 'Inter', 'SF Pro Text', sans-serif; font-weight: 600; font-size: 11px; fill: #AA7C11; letter-spacing: 5px; }
      
      .fine-grid-gold { stroke: #E2D7B5; stroke-width: 0.75; stroke-dasharray: 2 3; }
      .fine-axis-gold { stroke: #C5A059; stroke-width: 0.8; opacity: 0.4; }
      .cube-edge-gold { stroke: #F4F7F6; stroke-width: 1.2; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Container Sfondo Chiaro -->
  <rect width="820" height="250" class="bg-light" />

  <!-- RETICOLO CAD ORO -->
  <g transform="translate(115, 125)">
    <line x1="-80" y1="-46" x2="80" y2="46" class="fine-grid-gold" />
    <line x1="-80" y1="46" x2="80" y2="-46" class="fine-grid-gold" />
    <line x1="0" y1="-90" x2="0" y2="90" class="fine-grid-gold" />
    
    <line x1="0" y1="-80" x2="0" y2="80" class="fine-axis-gold" />
    <line x1="-69" y1="40" x2="69" y2="-40" class="fine-axis-gold" />
    <line x1="-69" y1="-40" x2="69" y2="40" class="fine-axis-gold" />

    <!-- FRATTALE CUBI ORO -->
    <g transform="translate(0, -42)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#goldRightLight)" class="cube-edge-gold" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#goldLeftLight)" class="cube-edge-gold" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#goldTopLight)" class="cube-edge-gold" />
    </g>

    <g transform="translate(-36, 20)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#goldRightLight)" class="cube-edge-gold" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#goldLeftLight)" class="cube-edge-gold" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#goldTopLight)" class="cube-edge-gold" />
    </g>

    <g transform="translate(36, 20)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#goldRightLight)" class="cube-edge-gold" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#goldLeftLight)" class="cube-edge-gold" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#goldTopLight)" class="cube-edge-gold" />
    </g>

    <!-- MICRO CUBI SATELLITE -->
    <g transform="translate(0, -68) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="#F3E5AB" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#785200" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#D4AF37" />
    </g>
    <g transform="translate(-58, 32) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="#F3E5AB" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#785200" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#D4AF37" />
    </g>
    <g transform="translate(58, 32) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="#F3E5AB" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#785200" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#D4AF37" />
    </g>

    <circle cx="0" cy="-2" r="4" fill="#AA7C11" />
  </g>

  <!-- TESTO COMMODORE -->
  <g transform="translate(255, 118)">
    <text x="0" y="10" class="title-commodore">COMMODORE</text>
    <text x="4" y="36" class="subtitle-commodore">GOLD EDITION • WAREHOUSE MAPPING</text>
  </g>
  <line x1="260" y1="168" x2="310" y2="168" stroke="#C5A059" stroke-width="1.5" stroke-linecap="round" />
</svg>
