     ===============================================================================
     1.1.0 — LA QUARANTENA DIVENTA UN'OPERAZIONE COME LE ALTRE
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)

     -- [N1] L'AVVISO CHE FINIVA SOPRA IL DOCUMENTO ------------------------
     * PRIMA. `#fbCenter`, il riquadro del riscontro operativo, e' position:fixed
       con inset:0 e z-index 900: sta esattamente al centro dell'area
       stampabile. Non compariva nell'elenco degli elementi esclusi da
       @media print. La quarantena stampa il cartello NC da sola, un istante
       dopo aver annunciato "trasferire FISICAMENTE la merce da X a Y": quel
       messaggio usciva stampato sopra il cartello. Non era una scelta, era un
       elemento dimenticato in una riga di CSS.
     * ORA #fbCenter, #dlgOverlay e la barra di annullamento sono esclusi dalla
       stampa, e i tre punti che stampano spengono il riscontro prima di
       chiamare window.print(). L'istruzione di trasferire la merce non e' piu'
       un messaggio da sei secondi: e' scritta SUL CARTELLO, che segue la merce
       e sopravvive alla sessione.
     * La finestra di stampa del browser NON si puo' togliere da qui: nessuna
       pagina web puo' sopprimerla. Si toglie avviando Chrome con
       --kiosk-printing sui terminali. E' una modifica al collegamento, non al
       codice, ed e' scritta in INSTALLAZIONE.

     -- [N2] IL BLOCCO SEGUE I COLLI, NON L'ARTICOLO -----------------------
     * PRIMA. `isItemQuarantined(itemKey)` rispondeva per TUTTO il magazzino, e
       la quarantena era per forza totale. Bloccare un collo ammaccato in una
       corsia rendeva intoccabile lo stesso lotto ovunque, comprese le casse
       sane in un'altra zona. Finche' non si poteva bloccare una parte, il
       difetto non si vedeva: l'item bloccato era l'unico che esistesse.
     * ORA la quarantena e' PARZIALE: si dichiara quanti colli bloccare, quelli
       vanno in area NC e gli altri restano dove sono, conformi e utilizzabili.
       `isItemQuarantined(itemKey, locationCode)` chiede anche DOVE. L'ubicazione
       e' opzionale e, omessa, torna alla domanda globale: e' la direzione
       prudente, un punto di chiamata dimenticato blocca troppo, non troppo poco.
     * `isItemQuarantinedAnywhere()` e `quarantinedLocationsOf()` restano per gli
       AVVISI, che sono un'altra cosa dai divieti.
     * Il RILASCIO sposta i colli del suo record, non tutto cio' che si trova in
       area NC: due blocchi parziali dello stesso articolo e lotto li' si
       sommano, e rilasciarne uno portava fuori anche i colli dell'altro.
     * Campi additivi sul record (`qty`, `qty_left_at_origin`, `partial`): i
       record scritti prima restano leggibili, il ripiego a 1 vale perche' fino
       alla 1.0 il blocco era per definizione totale. Nessuna migrazione.

     -- [N3] L'AREA NC DIVENTA OBBLIGATORIA --------------------------------
     * PRIMA (decisione 3-c, v2.0.1 [B1]). Senza un'ubicazione BLOCCATA la merce
       restava dov'era e veniva bloccata l'ubicazione INTERA.
     * ORA quella via non regge piu': bloccare l'ubicazione per cinque colli su
       quaranta immobilizzerebbe trentacinque colli conformi — esattamente il
       danno che il blocco parziale esiste per evitare. E dividere la giacenza
       dentro la stessa ubicazione darebbe un record che a scaffale nessuno puo'
       verificare: davanti c'e' un bancale solo e non dice quali cinque.
     * Si preferisce fermarsi e chiederlo. Un'ubicazione BLOCCATA si configura in
       Mappa in un minuto; una giacenza che dichiara il falso dura sei anni.

     -- [N4] LA QUARANTENA PRENDE LA FORMA DEGLI ALTRI FLUSSI --------------
     * PRIMA era l'unica operazione che non chiedeva di dimostrare di essere
       davanti alla merce: articolo e lotto, due campi che si compilano da
       seduti, e il sistema spostava un bancale. L'ubicazione non veniva mai
       scansionata.
     * ORA: ricerca articolo+lotto, elenco FEFO delle ubicazioni, tappa guidata,
       tripla scansione con lo stesso motore di sblocco motivato degli altri
       flussi (`_scanBlock`), colli e informazioni. La nota di sblocco entra nel
       motivo del blocco e finisce sul cartello, come sul verbale di smaltimento.
     * Anche la scheda ubicazione (Mappa -> item -> Quarantena) chiede i colli.

     -- [N5] ARCHIVIO DOCUMENTI --------------------------------------------
     * PRIMA. Gli elenchi mostrano il LAVORO DA FARE, quindi filtrano sui
       documenti aperti: `getPendingOutbound()` su status 'pending', le liste
       quarantena su `getActiveQuarantine()`. Un DDT evaso o un cartello NC
       rilasciato sparivano da ogni vista. Il record restava e le funzioni di
       stampa sapevano ancora stamparlo: mancava il posto da cui chiederglielo.
       Un documento che esiste e non si puo' ristampare e' un documento perso.
     * ORA una vista sola con i quattro tipi — DDT, verbali di smaltimento,
       cartelli NC, report di prelievo — filtrabili per tipo, testo e date.
       NESSUNA stampa nuova: usa le quattro che c'erano gia'. Sola lettura e
       sola stampa: evasioni e rilasci restano nei flussi operativi, dove ci
       sono le conferme e i controlli di disponibilita'.

     -- [N6] LA SCHEDA DATI E BACKUP NON SI APRIVA SUL SERVIZIO ------------
     * PRIMA. `RemotePersistence.estimateUsage()` restituiva `percent`, mentre
       il contratto — cioe' cio' che restituisce l'adapter locale e cio' che la
       UI legge — parla di `pct`. Con l'adapter remoto `est.pct.toFixed(1)`
       trovava undefined e l'INTERA scheda Configurazione -> Dati e Backup non
       si disegnava: restava vuota, con un messaggio d'errore. Dentro quella
       scheda c'e' il pulsante «Importa da JSON», cioe' il passo con cui si
       porta un magazzino locale sul servizio: il difetto rendeva impossibile
       la migrazione.
     * ORA l'adapter parla la lingua del contratto. `quota` e `pct` restano
       NULL, e non e' una svista: su un servizio non esiste una quota del
       browser da riempire. I tre punti che mostravano lo spazio passano da un
       formatore solo, che distingue "non applicabile" da "zero per cento".
     * Con il servizio dati spariscono anche i due riquadri che parlavano di un
       database dentro il browser — archiviazione persistente e copie OPFS —
       perche' li' descrivevano il falso e i loro pulsanti fallivano
       (supportsLocalBackup e' false). Al loro posto: dove sta il file e come si
       fa il backup vero. In locale nulla cambia.

     -- [N7] IL MERGE SU UN DATABASE VUOTO PERDEVA GLI OPERATORI -----------
     * PRIMA. Il dialogo d'importazione proponeva il MERGE come modalita'
       «consigliata», e il merge importa QUATTRO collezioni: siti, zone,
       articoli, giacenze. Registro movimenti, quarantene, DDT, verbali, report
       di prelievo, ANAGRAFICA OPERATORI e dati del mittente venivano ignorati
       in silenzio, con un riscontro finale che diceva comunque "importati".
     * Sul database pieno per cui il merge e' nato quel comportamento e' giusto.
       Ma il caso piu' frequente di quel pulsante e' l'opposto — un database
       VUOTO in cui si travasa un magazzino — e li' il merge portava le giacenze
       e lasciava fuori gli operatori: nessuno poteva piu' entrare ne' registrare
       movimenti, perche' ogni movimento vuole la sigla di un operatore
       identificato. Il magazzino sembrava importato ed era inutilizzabile.
     * ORA il dialogo guarda la destinazione. Se e' vuota lo dice, propone
       l'importazione COMPLETA (che li' non e' distruttiva, non c'e' niente da
       distruggere) ed elenca cosa il merge lascerebbe indietro. Se e' piena,
       resta il percorso prudente della v2.2.1 [F2][F3], ma ora dichiara anche
       lui cosa il merge NON porta. Entrambi i dialoghi mostrano il contenuto
       del file, collezione per collezione.

     1.0 — PRIMA VERSIONE STABILE
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)

     Il numero riparte da uno perche' riparte il conto: fin qui c'e' stato uno
     sviluppo, da qui c'e' un applicativo in uso in magazzino. Il codice e' lo
     stesso della v3.0.0 e lo schema pure (v7): cambia che questa versione e'
     stata messa in ordine per starci dentro tutti i giorni.

     -- TIPOGRAFIA SU UNA SCALA SOLA ---------------------------------------
     * PRIMA. Cinquecentosessanta dichiarazioni di corpo del testo, di cui 57
       su token e le altre scritte a mano: QUARANTATRE gradini diversi fra
       0,52rem e 2,5rem, nati uno alla volta a occhio. E una base di 13px che
       litigava con i token in rem, misurati sulla radice a 16: due scale
       parallele nello stesso foglio.
     * ORA la scala MD3 e' dichiarata tutta — quindici ruoli, cinque famiglie
       per tre grandezze — e ogni corpo dell'interfaccia ci cade sopra. Nessun
       `font-size` in rem fuori dai token. La base e' Body Medium, che e' il
       ruolo del testo d'interfaccia, con la sua interlinea e la sua spaziatura.
     * I documenti di stampa restano in `pt` e `mm`, dichiaratamente: la carta
       non ha un rem, e MD3 e' un sistema per lo schermo.

     -- UN SOLO FOGLIO PER QUATTRO DOCUMENTI -------------------------------
     * PRIMA. Quattro documenti, quattro testate diverse: il DDT col marchio,
       il report di prelievo con una scritta "Dietopack S.r.l." in Times, il
       cartello NC con una fascia rossa e il nome dell'azienda dentro, il
       verbale a se'. Stampati insieme non sembravano della stessa ditta.
     * ORA la testata e' UNA: marchio, mittente, natura e numero del documento.
       Sotto, un blocco d'identificazione che cambia — le parti sul DDT,
       l'ordine sul report di prelievo, l'articolo bloccato sul cartello, la
       merce uscita sul verbale — e si prende il residuo della fascia. Il
       piede e' uno: firme e riga di emissione.
     * Le tre fasce (20% testata, 70% corpo, 10% piede) valgono per tutti.

     v3.0.0 changelog (MAJOR - DUE MERGE E UN DOCUMENTO CHE VALE COME DOCUMENTO)
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)
     SCHEMA DB: v6 -> v7. Un solo store nuovo (disposal_archive). Nessun dato
     riscritto, nessuna migrazione dei record esistenti.

     PREMESSA — PERCHE' UN MAJOR. Non si aggiungono funzioni: se ne TOLGONO.
     La vista Movimenta passa da sette card a cinque, e due coppie di funzioni
     che erano sempre state due diventano una ciascuna. Chi apre questa
     versione trova un'interfaccia diversa da quella che conosceva, e questo
     e' esattamente cio' che un numero MAJOR serve a dichiarare.

     -- [M1] POSIZIONA E SMALTISCI SONO LA STESSA OPERAZIONE ----------------
     * PRIMA. Due card, due colori, due moduli, due flussi di scansione
       diversi. Posiziona chiedeva UBICAZIONE -> ARTICOLO -> LOTTO e scriveva.
       Smaltire chiedeva ARTICOLO -> LOTTO, mostrava un elenco di ubicazioni e
       si accontentava di un click su "Rimuovi": nessuno doveva dimostrare di
       essere davanti alla merce. Sono la stessa operazione con il segno
       invertito, e tenerle separate faceva pagare due volte l'apprendimento.
     * ORA una sola card CARICO / SCARICO, con un selettore in testa. Il
       carico e' identico a prima, riga per riga. Lo scarico eredita la
       disciplina del carico — la merce non si tocca finche' UBICAZIONE,
       ARTICOLO e LOTTO non sono stati scansionati — arrivandoci per la strada
       che gli e' propria: ricerca, scelta dell'ubicazione fra quelle in
       giacenza ordinate FEFO, TAPPA GUIDATA verso quella ubicazione, e li'
       la tripla scansione di verifica. Il motore della tappa non e' nuovo:
       e' lo stesso del percorso di prelievo da ordine (v2.5.0), scansione
       errata e forzatura motivata comprese.
     * LA MOTIVAZIONE E' OBBLIGATORIA. Fino alla v2.8.0 un movimento di
       smaltimento andava a registro con il campo note VUOTO: a distanza di
       mesi il registro diceva che dodici colli erano usciti, e non perche'.
       Ora si sceglie fra motivazioni configurabili — di serie NON CONFORME e
       SCADUTO/OBSOLETO — o si scrive un motivo esteso, e senza una delle due
       cose il pulsante di conferma non fa niente.

     -- [M2] IL VERBALE DI SMALTIMENTO -------------------------------------
     * Ogni smaltimento produce un verbale numerato, con articolo, lotto,
       ubicazione, colli, motivazione, operatore, data e spazio per la firma.
       Viene ARCHIVIATO su `disposal_archive` e resta ristampabile identico
       dalla sezione Documenti, sullo stesso principio dei report di prelievo
       introdotto dalla v2.5.1: la ristampa rilegge, non ricostruisce.

     -- [M3] RESI E SPEDIZIONI SONO LO STESSO DOCUMENTO ---------------------
     * PRIMA. Due moduli gemelli di circa cinquecento righe l'uno, con la
       stessa card, la stessa modale di modifica e la stessa stampa. L'unica
       differenza vera era una parola: "fornitore" invece di "cliente".
     * ORA resta la sola card SPEDIZIONI, e la differenza sta dove e' sempre
       stata nella realta': nella CAUSALE DEL TRASPORTO. E' la causale a
       decidere il tipo di movimento a registro — le causali di reso scrivono
       MOV.RET, tutte le altre MOV.SHIP — cosi' cruscotto, grafici ed export
       continuano a distinguere resi e spedizioni, e i movimenti scritti
       prima di questa versione restano confrontabili con quelli scritti
       dopo. I DDT di reso rimasti pendenti al momento dell'aggiornamento
       compaiono nella lista unica e si evadono come sempre.

     -- [M4] IL DDT DIVENTA UN DDT ------------------------------------------
     * PRIMA. Il documento stampato si chiamava DDT ma era una ricevuta
       interna: numero, destinatario, vettore, data di ritiro. Nessun
       mittente, nessuna partita IVA, nessuna causale, nessun luogo di
       destinazione, nessun peso. Su un automezzo fermato non sarebbe stato
       un documento di trasporto.
     * ORA la testata raccoglie cio' che un documento di trasporto deve
       portare: causale, numero e data del documento, mittente completo,
       destinatario con indirizzo e partita IVA, luogo di destinazione se
       diverso, vettore e trasporto a cura di chi, porto, aspetto esteriore
       dei beni, peso lordo e netto, data e ora di inizio trasporto,
       annotazioni. Righe con lotto e scadenza — che per un alimentare non
       sono un vezzo ma la tracciabilita' del Reg. CE 178/2002.
     * I DATI DEL MITTENTE NON SONO CABLATI NEL FILE. Stanno in
       Configurazione -> DDT e Documenti, si scrivono una volta e si
       correggono senza toccare il codice. Finche' sono vuoti la stampa esce
       segnalando cosa manca, invece di uscire monca e sembrare valida.
     * PESI E QUANTITA' si calcolano dall'anagrafica articoli, che guadagna
       peso netto per collo e pezzi per collo, e restano correggibili a mano
       in testata: la tara di un bancale in anagrafica non c'e' e non ci deve
       stare.
     * FILIGRANA. Un DDT ancora pendente e' una bozza: la merce non e'
       partita. Finche' non e' evaso il foglio esce con una filigrana che lo
       dichiara, e sparisce all'evasione.

     -- [M5] IL MARCHIO NATURACARE -----------------------------------------
     * Il logo sta in alto a sinistra su tutti i documenti, come SVG inline:
       stessa scelta fatta per il marchio Pathfinder nella v2.7.0, per le
       stesse ragioni — nessun PNG in base64, nessuna richiesta di rete,
       nitido a ogni zoom e in stampa.

     v2.8.0 changelog (MINOR - TENUTA DEL DATO SU ORIZZONTE SEI ANNI)
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)
     SCHEMA DB INVARIATO: resta v6. Nessuna migrazione, nessun dato riscritto.

     PREMESSA — IL REQUISITO. Il registro movimenti deve reggere SEI ANNI di
     tracciabilita' con un volume dichiarato di 300-500 movimenti al giorno:
     fra 650.000 e 1.100.000 record. La v2.7.0 registrava correttamente ma
     conservava male, e alcune scelte accettabili a poche migliaia di record
     diventavano guasti certi a un milione. Questa versione non aggiunge
     funzioni all'operativita': mette in sicurezza cio' che c'e'.

     MISURE PRESE SUL CAMPO (IndexedDB reale, non stime):
       · 340 byte per movimento su disco, indici compresi
       · 1.100.000 movimenti = ~370 MB, contro una quota di ~2.600 MB
       · query indicizzata su intervallo di date: 0,26 s su 60.000 record
       · caricamento integrale in memoria: 2,7 s ogni 60.000 record
     CONCLUSIONE: lo spazio non e' il vincolo. Lo sono il tempo di avvio, la
     memoria occupata e la riscrittura integrale del checkpoint.

     -- [H1] IL CHECKPOINT SMETTE DI RISCRIVERE L'ARCHIVIO ------------------
     * PRIMA. forceSave() cancellava e riscriveva OTTO tabelle intere, registro
       movimenti compreso. A regime significava, a ogni click su "Salva ora" e
       a ogni blocco per inattivita', riscrivere un milione di record: minuti
       di applicazione ferma. Il tutto per NESSUN guadagno di durabilita', dato
       che ogni scrittura era gia' andata su disco in transazione propria nel
       momento in cui era avvenuta.
     * ORA il checkpoint VERIFICA invece di riscrivere: confronta i conteggi
       della cache con quelli del database, aggiorna i metadati e, se i due
       divergono, riallinea la cache dal disco — che e' la copia che
       sopravvive a un riavvio, quindi la sola che possa fare da riferimento.
       Costo costante, indipendente dagli anni di storico.
     * Come effetto secondario il checkpoint e' diventato utile davvero: prima
       spingeva alla cieca la memoria sul disco e una cache disallineata
       avrebbe SOVRASCRITTO dati buoni. Ora quel disallineamento lo segnala.

     -- [H2] IL REGISTRO NON VIENE PIU' CARICATO TUTTO IN MEMORIA -----------
     * PRIMA. _loadCache() faceva mov_log.toArray() a ogni avvio e teneva
       l'intero archivio in un array JavaScript. A un milione di record sono
       una decina di secondi di avvio e diverse centinaia di MB di heap, per
       dati che servono quando si apre il Registro e in nessun altro momento.
     * ORA in memoria resta una FINESTRA (predefinita 120 giorni, configurabile
       da Configurazione -> Dati). Cruscotto, KPI e ultimi movimenti leggono
       quella, ed e' esattamente cio' che mostravano gia'. Registro completo,
       export Excel, export JSON e purge interrogano il database per intervallo
       di date sull'indice ts, senza materializzare nulla di superfluo.
     * L'avvio smette di dipendere dagli anni di storico: costante per sempre.

     -- [H3] IL DISCO PIENO NON PUO' PIU' PERDERE UN MOVIMENTO IN SILENZIO ---
     * PRIMA. QuotaExceededError non era gestito in nessun punto del file e non
       esisteva alcun handler globale. In _moveItemCore la sequenza e': togli
       dall'origine, metti a destinazione, registra il movimento. Se l'ultima
       falliva, la merce risultava spostata e a registro non c'era scritto
       niente, con l'eccezione persa nella console. Non un dato mancante: un
       dato FALSO, che e' molto peggio in sede di audit.
     * ORA ogni scrittura passa da una guardia che riconosce l'esaurimento
       dello spazio. Un movimento che non riesce ad andare a registro finisce
       in una CODA DI RECUPERO su localStorage, l'operatore vede un avviso
       bloccante invece di non vedere nulla, e al riavvio successivo la coda
       viene ritentata prima di ogni altra cosa.

     -- [H4] UNA COPIA CHE ESCE DALLA MACCHINA -----------------------------
     * IL PROBLEMA VERO, quello che nessuna delle altre correzioni risolve:
       fino alla v2.7.0 esisteva UNA SOLA copia dei dati, su UNA SOLA macchina.
       I backup automatici OPFS stanno sullo stesso disco e nello stesso
       profilo browser di IndexedDB: lo stesso pulsante "Cancella dati di
       navigazione" li porta via insieme. Non erano una copia di sicurezza,
       erano una seconda copia nello stesso punto di guasto. E per giunta
       listOPFSBackups() e readOPFSBackup() non erano richiamati da nessuna
       parte dell'interfaccia: backup scritti e non ripristinabili.
     * ORA backup automatico su una CARTELLA ESTERNA scelta una volta
       (tipicamente OneDrive, quindi replicata fuori dall'edificio), via File
       System Access API. Il formato e' incrementale, perche' riversare 370 MB
       di JSON ogni giorno non sarebbe sostenibile:
         · wm-stato-AAAA-MM-GG.json  — fotografia di giacenze, anagrafiche,
           ubicazioni, quarantene e operatori. Pochi MB. Ne restano 30.
         · movimenti/wm-mov-AAAA-MM.jsonl — un file per mese, una riga per
           movimento. Solo il mese in corso viene riscritto; i mesi chiusi si
           scrivono una volta e non si toccano mai piu'.
         · wm-manifest.json — conteggi, intervallo di date e impronta SHA-256,
           per accorgersi che un backup e' incompleto PRIMA di averne bisogno.
       Sei anni occupano circa 320 MB distribuiti su 72 file mensili, e nessuna
       singola scrittura supera i pochi MB.
     * I backup OPFS restano come rete locale, ma adesso si possono ELENCARE e
       RIPRISTINARE dall'interfaccia.

     -- [H5] PERSISTENZA DELL'ARCHIVIO: DETTA COM'E' ------------------------
     * navigator.storage.persist() non era mai stato chiamato: il database era
       in modalita' "best-effort", cioe' il browser aveva il diritto di
       cancellarlo sotto pressione di spazio senza chiedere niente a nessuno.
     * ORA viene richiesta all'avvio. Con una CONTROINDICAZIONE che va detta e
       non nascosta: aperta come file locale (file://) Chrome NEGA la
       persistenza, e nessuna riga di codice puo' forzarla. Configurazione ->
       Dati riporta lo stato reale e, quando e' negata, dice perche' e come si
       rimedia (servire l'applicativo da http://localhost o da un indirizzo
       https interno). Finche' resta un file locale, la difesa vera e' [H4].

     -- [H6] DUE SCHEDE APERTE NON SI SOVRASCRIVONO PIU' --------------------
     * Ogni scheda teneva la propria cache in memoria e non sapeva nulla delle
       altre: la seconda non vedeva le scritture della prima, e un checkpoint
       dalla scheda rimasta indietro riportava sul database uno stato superato.
       Su un terminale di reparto, dove le finestre non si chiudono mai, e' una
       perdita di dati che non lascia traccia.
     * ORA le istanze si annunciano su un BroadcastChannel: la seconda entra in
       SOLA LETTURA con una fascia di avviso, e puo' prendere il comando solo
       con un atto esplicito.

     -- [H7] UN BACKUP SI VERIFICA PRIMA DI FIDARSENE -----------------------
     * Gli export JSON portano conteggi per collezione e impronta SHA-256.
       All'import il file viene verificato e le difformita' vengono dichiarate
       prima di scrivere qualunque cosa.

     v2.7.0 changelog (MINOR - PLANCIA DI COMANDO, RICERCA E IDENTITA' VERIFICATA)
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)
     SCHEMA DB: da v5 a v6. Una sola collezione aggiunta ('operators'). Nessun
     dato esistente viene toccato, riscritto o migrato: le dodici collezioni
     precedenti restano identiche, byte per byte.

     PREMESSA. La v2.6.0 ha chiuso il disaccoppiamento della persistenza e ha
     lasciato in eredita' due cose non finite: una barra superiore cresciuta per
     accumulo (cinque schede di pari peso, marchio segnaposto "WM", ricerca
     relegata a una vista a se', indicatore di salvataggio decorativo) e
     l'identita' dell'operatore ridotta a un'etichetta di due-quattro lettere
     digitate all'avvio, che nessuno verifica. Questa versione chiude entrambe.

     -- [G1] LA BARRA SUPERIORE DIVENTA UNA PLANCIA -------------------------
     * PRIMA. Cinque schede allineate (Dashboard, Mappa, Movimenta, Ricerca,
       Configurazione) davano lo stesso peso visivo a tre destinazioni operative
       e a due strumenti. Il marchio era un quadratino con dentro "WM".
     * ORA. A sinistra il marchio Pathfinder come SVG inline (~4 KB, nitido a
       ogni zoom e in stampa, nessun PNG in base64 a gonfiare il file) affiancato
       dalla versione. Al centro le tre sole destinazioni operative. Subito dopo
       il campo di ricerca. A destra l'ingranaggio di configurazione, ridotto a
       icona. All'estrema destra operatore e stato di salvataggio.

     -- [G2] LA RICERCA SI COMPORTA COME QUELLA DI UN BROWSER ---------------
     * PRIMA. Una vista intera per cercare: si perdeva il contesto, si tornava
       indietro a mano, e i risultati riempivano lo schermo per poi essere
       abbandonati al primo click.
     * ORA. Campo in barra, risultati in un pannello a tendina largo quanto
       serve a leggere articolo, descrizione, lotto, ubicazione, colli e
       scadenza su una riga sola. Frecce per scorrere, Invio per aprire, Esc per
       chiudere, click fuori per abbandonare. I CRITERI DI RICERCA SONO GLI
       STESSI della v2.6.0: la funzione e' stata spezzata in _searchAll() e
       _renderSearchPopup(), non riscritta.
     * Ogni risultato apre la posizione sulla mappa in una SCHEDA: zona e
       livello giusti, cella evidenziata con un lampeggio breve, pannello di
       dettaglio gia' aperto. Gli articoli in anagrafica, prima inerti,
       diventano cliccabili.

     -- [G3] L'INDICATORE DI SALVATAGGIO DIVENTA UN COMANDO -----------------
     * "Salvato / Non salvato" era un semaforo che non si poteva premere,
       mentre "Salva ora" ed "Export JSON" occupavano la testata della
       dashboard, dove non serviva a nessuno guardarli venti volte al giorno.
     * ORA il semaforo e' il pulsante: un click esegue il checkpoint. I due
       comandi spariscono dalla dashboard e restano in Configurazione -> Dati,
       che e' il posto in cui si va quando si cercano.

     -- [G4] LA TENDINA SITI E ZONE SI CHIUDE -------------------------------
     * Su schermo di reparto la mappa e' cio' che conta. La colonna di sinistra
       si ritrae verso sinistra e lascia una linguetta per riaprirla. Lo stato
       resta memorizzato per dispositivo.

     -- [G5] DALLA SCHEDA UBICAZIONE SI LAVORA, NON SI GUARDA SOLTANTO ------
     * PRIMA. Aprendo un'ubicazione si potevano modificare i dati di un item e
       rimuoverlo con una crocetta. Per spostarlo o metterlo in quarantena
       bisognava andare in Movimenta e riscansionare articolo e lotto: dati che
       il sistema aveva gia' sotto gli occhi.
     * ORA ogni item ha Modifica, Sposta e Quarantena direttamente li'. La
       crocetta di rimozione E' STATA TOLTA: l'uscita di giacenza e' un atto
       deliberato e passa solo da Movimenta -> Smaltire, che genera il
       movimento OUT tracciato.
     * NOTA DI SOSTANZA. Le due azioni nuove non sono una seconda
       implementazione. La logica di _execCambio e _execQuarantena e' stata
       estratta in _moveItemCore() e _quarantineItemCore(), chiamate sia dal
       form di Movimenta sia dai nuovi modali. Esiste UN SOLO percorso di
       spostamento e UN SOLO percorso di blocco qualita': mappa e Movimenta non
       possono divergere, ne' oggi ne' fra sei mesi.

     -- [G6] L'OPERATORE SMETTE DI ESSERE UN'ETICHETTA ----------------------
     * PRIMA. Due-quattro lettere in localStorage. Nessuno poteva dire se
       corrispondessero a chi aveva in mano il tablet. In sede di audit GMP la
       firma su un movimento valeva quanto un pennarello su un cartone.
     * ORA anagrafica operatori con nome, cognome, iniziali e ruolo (Operatore
       o Team Leader), PIN a 6 cifre conservato come SHA-256 con salt casuale
       per operatore. Il PIN in chiaro non tocca mai IndexedDB, localStorage,
       il registro movimenti o gli export.
     * Accesso all'avvio. Dopo N minuti di inattivita' l'applicazione SALVA e
       si blocca dietro un popup non aggirabile: si rientra con operatore e PIN.
       Se rientra un operatore diverso, i carrelli aperti vengono azzerati con
       avviso — un prelievo iniziato da un'altra persona non si eredita.
     * PIN smarrito: lo rinnova un Team Leader, autorizzando con il proprio PIN.
       L'evento finisce a registro come PINRESET; il PIN no, ne' in chiaro ne'
       come hash.
     * Store.getCurrentIdentity(), predisposto vuoto in v2.6.0 [F1-5], viene
       finalmente popolato. Era esattamente lo scopo di quella predisposizione:
       l'identita' verificata entra nel file TOCCANDO UN SOLO PUNTO, e le
       decine di chiamate che scrivono l'operatore sui record non sono state
       sfiorate.
     * Migrazione: le sigle gia' note diventano schede operatore da completare
       (ruolo Operatore, senza PIN). Le iniziali NON cambiano, quindi lo storico
       dei movimenti resta leggibile e attribuibile come prima.
     * Nessun operatore e' cancellabile: chi ha firmato dei movimenti si
       disattiva. Stesso principio gia' applicato ai record di non conformita'.

     -- [G7] MAI CHIUSI FUORI -----------------------------------------------
     * Se l'anagrafica e' vuota, o se non resta alcun Team Leader attivo,
       l'applicazione impone la creazione di un Team Leader prima di procedere.
       Non esiste una combinazione di stati che lasci l'applicativo inaccessibile.

     v2.6.0 changelog (MINOR - DISACCOPPIAMENTO DEL LAYER DI PERSISTENZA)
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)
     Fase 1 del percorso verso il backend centralizzato (HND-WM-F1 Rev. 01).
     SCHEMA DB INVARIATO: resta v5. Nessuna migrazione. Nessuna modifica a UI,
     CSS, logica di percorso, FEFO, quarantena, DDT a due stati, undo 120s,
     parser ODP o template di stampa.

     PREMESSA. Warehouse Mapper deve diventare il client di un database
     centralizzato (PocketBase, server interno). Questa versione NON introduce
     il server: introduce lo strato che rendera' additiva la sua introduzione.
     A parita' di comportamento visibile, tutta la persistenza passa ora per
     un'unica interfaccia sostituibile.

     -- [F1-1] LA SCRITTURA ATOMICA DELLA TAPPA TORNA A CASA ----------------
     * PROBLEMA. App._routeConfirmStop() apriva Dexie in proprio e nominava
       quattro tabelle nello scope della transazione. Era l'unico punto in cui
       la UI conosceva la struttura del database, e riguardava l'operazione
       piu' delicata dell'applicativo: la conferma di una tappa di prelievo.
       Con un backend remoto quella riga non avrebbe avuto alcun significato.
     * SOLUZIONE. Nuovo Store.commitPickStop(): scarico giacenza, movimento a
       registro e avanzamento della tappa restano una cosa sola, ma dentro
       Store. In App restano i re-check sullo stato attuale della merce, il
       dialogo delle quantita', il riscontro all'operatore, la finestra di
       storno e il registro di sessione: la logica di percorso non e' toccata.
     * In caso di errore la cache viene riallineata al disco prima di risalire
       al chiamante, come faceva App: il disco resta la verita'.

     -- [F1-2] LA CACHE SMETTE DI ESSERE PUBBLICA --------------------------
     * PROBLEMA. Dodici punti fuori da Store leggevano Store._cache
       direttamente, ricevendo il RIFERIMENTO agli array interni. Un .sort()
       di troppo dentro un ciclo di rendering avrebbe riordinato la giacenza
       in memoria senza che nulla lo segnalasse. Non e' mai successo: era
       comunque possibile. E ogni punto che conosce la forma della cache e'
       un punto da riscrivere quando la cache sara' alimentata dal server.
     * SOLUZIONE. Accessor pubblici che restituiscono COPIE: getMeta()
       (congelato), hasUnsavedChanges(), getInventoryCount(),
       getInventorySnapshot(), getLotsForArticle(), reloadCache().
       getPendingOutbound(kind) accetta ora kind opzionale: omesso restituisce
       i pendenti di entrambi i tipi, che e' cio' che serve al calcolo
       dell'anti-doppia-prenotazione.
     * Le copie sono superficiali: proteggono la collezione, non i singoli
       record. Clonare a fondo dentro i cicli di rendering costerebbe caro e
       romperebbe i confronti per identita' gia' presenti nel file.

     -- [F1-3] PERSISTENCE ADAPTER -----------------------------------------
     * Nuovo modulo LocalPersistence + const Persistence, subito prima di
       Store. Store non nomina piu' Dexie in nessun punto: 162 riferimenti
       db.* sostituiti da chiamate all'adapter.
     * La costante db e la catena db.version(1..5) restano dove sono, con
       tutti i commenti di migrazione: sono documentazione storica, e sono
       diventate un dettaglio interno dell'adapter.
     * LETTURE SINCRONE INVARIATE. I 44 getter che leggono dalla cache non
       sono stati toccati, ne' e' stato aggiunto un solo await nella UI: un
       backend remoto non puo' servire chiamate sincrone, quindi la cache
       diventa il read model e l'adapter la sola via di scrittura. Quando
       arrivera' il RemotePersistence, i delta realtime entreranno nella
       cache dallo stesso punto da cui oggi entrano quelli locali.
     * CONTRATTO. Oltre a open/loadAll/put/bulkPut/delete/clear/transaction/
       count sono stati necessari cinque metodi generici in piu':
         - add / bulkAdd : put genera la chiave ma SOVRASCRIVE in silenzio
                           invece di fallire su record esistente. E' un
                           controllo, non un dettaglio.
         - update        : modifica PARZIALE per chiave. Ricostruirla come
                           read-modify-put trasformerebbe, contro un server,
                           una PATCH in una PUT: due operatori che toccano
                           campi diversi dello stesso record smetterebbero di
                           poter convivere.
         - deleteWhere / count con criterio dichiarativo { field, op, value }:
                           le uniche query reali sono cancellazioni per
                           prefisso di ubicazione, per uguaglianza e per
                           soglia temporale. Una funzione di filtro
                           JavaScript non attraversa la rete; il criterio si
                           traduce in una where() Dexie oggi e in un filtro
                           PocketBase domani.
         - clearMany     : reset e import azzerano tutto insieme. Con un
                           backend sara' una chiamata, non dodici.
     * CAPABILITY FLAG: supportsTransactions, supportsRealtime,
       supportsLocalBackup. Store li interroga invece di dare per scontato
       cio' che il supporto sa fare.
     * BACKUP OPFS: separata la POLITICA dal SUPPORTO. In Store restano
       intervallo, numero di copie, nome del file e la regola di saltare il
       backup a database vuoto; l'accesso al file system e navigator.storage
       sono passati all'adapter. I nomi pubblici (writeOPFSBackup,
       listOPFSBackups, cleanupOldOPFSBackups, readOPFSBackup,
       shouldAutoBackup, checkAutoBackup, isOPFSSupported) sono invariati:
       App non e' stata toccata. In Fase 5 il backup diventera' un compito
       del servizio: cambiera' l'adapter, non la politica.

     -- [F1-4] PUNTO UNICO DI MUTAZIONE DELLA CACHE ------------------------
     * PROBLEMA. Ogni metodo di scrittura aggiornava la cache a modo suo: chi
       con push, chi con unshift, chi con splice, e chi si ricordava — o si
       dimenticava — di toccare anche gli indici.
     * SOLUZIONE. Store._applyToCache(collection, op, record) con op
       'put' | 'delete' | 'clear'. Gli indici _invByLoc, _invByKey e
       _artByCode sono ora una conseguenza automatica: nessun chiamante li
       nomina piu'. E' il punto in cui, in Fase 3, entreranno i delta SSE.
     * SEMANTICA INVARIATA: dove la cache veniva aggiornata prima della
       scrittura sul supporto, continua a esserlo. Vedi il TODO F1-REVIEW su
       removeItem().
     * TRE ECCEZIONI DICHIARATE, tutte su INSIEMI e non su singoli record:
       _loadCache() (idratazione), deleteSite/deleteZone (cancellazione per
       prefisso) e purgeMovementsBefore() (purga per soglia). Tutte e tre
       terminano ricostruendo gli indici.

     -- [F1-5] IDENTITA': SOLO PREDISPOSIZIONE -----------------------------
     * Nuovo Store.getCurrentIdentity() -> { id, initials, role }. Oggi
       restituisce esattamente cio' che il file scriveva prima: il valore
       memorizzato su movimenti, quarantene, DDT e sessioni di prelievo NON
       cambia di un carattere.
     * Tredici punti che leggevano App.currentOperator per SCRIVERE
       l'attribuzione sui record ora passano di li'. Restano invariati gli
       undici punti in cui currentOperator e' stato di interfaccia: badge,
       campi precompilati, guardia _requireOperator.
     * NESSUN login, NESSUN ruolo, NESSUN permesso: role vale 'full' per
       tutti ed e' un segnaposto. La vista ridotta per gli operatori dovra'
       essere imposta dalle API rules di PocketBase, lato server:
       nasconderla nel client sarebbe cosmesi, non controllo accessi.

     -- [F1-REVIEW] rilievi annotati e NON corretti -------------------------
     * removeItem(): svuota la cache prima che la cancellazione sia
       confermata dal supporto. Gia' compensato dal riallineamento in
       commitPickStop(). Ordine mantenuto: centralizzare, non correggere.
     * resetAll(): ricostruisce gia' gli indici al proprio interno, quindi il
       riallineamento che App esegue subito dopo e' ridondante.

     v2.5.1 changelog (PATCH - AVVISI DI PERCORSO E REPORT DI PRELIEVO)
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)
     SCHEMA DB: v4 -> v5 (nuovo store `pick_archive`, vedi [A3]). Migrazione
     automatica, nessun dato esistente viene toccato. Nessuna modifica alla
     logica di percorso, di scansione o di commit.

     -- [A3] REPORT DI PRELIEVO: UN SOLO TEMPLATE, RISTAMPA CONFORME --------
     * PROBLEMA. Lo stesso fatto aziendale ("questo ordine e' stato
       prelevato") produceva tre fogli diversi: chiusura del percorso
       guidato, flusso a carrello, ristampa dal registro. Layout, colonne e
       calcolo della durata differivano. Soprattutto: la ristampa NON poteva
       coincidere con l'originale, perche' `pick_session` viene cancellato
       alla chiusura e il `mov_log` non conosce numero di tappa, kg
       d'ordine, righe fuori percorso, segnalazioni e avvisi d'import.
     * SOLUZIONE. Un unico template — App._buildPickReportHTML() — che legge
       uno SNAPSHOT normalizzato. Tre normalizzatori alimentano lo stesso
       template: _pickSnapFromSession() (percorso guidato),
       _pickSnapFromCart() (carrello), _pickSnapFromLog() (ripiego).
     * NUOVO STORE `pick_archive`. Alla chiusura dell'ordine lo snapshot
       viene congelato su IndexedDB. Non e' una seconda verita' sul
       magazzino — giacenze e audit trail restano su `inventory` e
       `mov_log` — ma la fotografia del foglio stampato. E' cio' che rende
       la ristampa IDENTICA all'originale, tempi compresi: durata e tempo
       medio si calcolano sui timestamp congelati, mai su "adesso".
     * L'archiviazione avviene anche se l'operatore rinvia la stampa: la
       stampa e' una sua decisione, l'esistenza del documento no.
     * RISTAMPA. Marcata da una fascia "COPIA CONFORME" con la data
       dell'originale e quella della copia; per il resto il foglio coincide
       riga per riga, DOC ID compreso. Un documento GMP ristampabile senza
       traccia non e' accettabile, uno diverso dall'originale nemmeno.
     * ORDINI PRE-v2.5.1. Non hanno snapshot: la ristampa ricade sulla
       ricostruzione dal registro movimenti, e il foglio DICHIARA in testa
       quali sezioni non sono disponibili invece di lasciarle vuote.

     -- [A4] REPORT DI PRELIEVO: REVISIONE DEL FOGLIO -----------------------
     * FOCUS SUI TEMPI. Nuova banda dedicata: Inizio, Fine, Durata totale e
       Tempo medio di prelievo (durata / righe prelevate, in negativo).
       Prima l'ora di inizio e fine erano due celle qualsiasi della griglia
       anagrafica e il tempo medio non c'era.
     * RIGHE PRELEVATE, colonne fissate a: # · Tappa · Codice · Descrizione ·
       Lotto · Ubicazione · Kg ordine · Colli prelevati. Rimossa la colonna
       Note, che in 3 cm troncava frasi intere: le note confluiscono nelle
       Segnalazioni, dove si leggono per intero.
     * DA RECUPERARE FUORI PERCORSO: aggiunta la colonna con casella da
       barrare a conferma del recupero. La riga esce dal foglio solo quando
       qualcuno l'ha materialmente recuperata.
     * Restano Segnalazioni e Avvisi sui dati dell'ordine.
     * ELIMINATA la zona firme da tutti i report di prelievo (resta sui
       documenti di uscita e sul cartello NC, che non sono toccati).
     * L'anteprima stampata dal carrello PRIMA della conferma esce marcata
       come parziale e non viene archiviata: descrive un'intenzione, non un
       prelievo avvenuto. Stessa marcatura per il "Report parziale" del
       percorso guidato ancora aperto.

     -- [A1] RIMOSSO il controllo di coerenza sulla somma dei lotti ----------
     * Il controllo introdotto in v2.5.0 [P1] confrontava la somma delle
       quantita' dei lotti con il totale di riga e marcava la riga come
       "LOTTI DA VERIFICARE" oltre il millesimo di scarto.
     * Alla prova sul campo scattava su quasi ogni ordine. La causa non era un
       errore dei dati ma la precisione della sorgente: l'export Sage arrotonda
       a sei decimali e i granulati sono espressi in grammi mentre il totale di
       riga e' in chilogrammi, cosi' la conversione lasciava sempre un residuo.
     * Un avviso che compare sempre non e' un avviso: abitua a scorrere oltre e
       finisce per coprire anche le segnalazioni che contano. Rimosso del tutto,
       insieme al badge sulle tappe e al riquadro di avviso sulla tappa corrente.
     * Resta il solo controllo che porta informazione: riga senza alcun lotto
       assegnato nell'ordine.
     * Rimossi: OdpParser._checkLotCoherence(), i campi lots_mismatch e
       lots_sum, il campo warn_lots delle tappe. Sostituito da
       OdpParser._checkMissingLots().

     -- [A2] Materiale non reperibile PROMOSSO in cima al pannello -----------
     * Le righe non prelevabili dalle aree mappate stavano in fondo, sotto
       l'anteprima del percorso. Ora aprono il pannello, subito sotto la
       testata dell'ordine e prima del pulsante di avvio, in un contenitore sul
       ruolo error: sono la verifica da fare su Sage o con l'Ufficio Produzione
       PRIMA di muoversi, non una scoperta da fare a meta' corsia.
     * Ordinate per gravita': non mappato, lotto assente, nessun lotto
       nell'ordine, tutto bloccato da quarantena o DDT pendenti.
     * Il contatore "In coda" e' stato rinominato "Da verificare".
     * Invariato invece il comportamento a percorso concluso: li' la stessa
       lista resta in fondo, perche' in quel momento e' un residuo di lavoro e
       non piu' una verifica preliminare.

     v2.5.0 changelog (MINOR - PRELIEVO GUIDATO DA ORDINE DI PRODUZIONE)
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)
     SCHEMA DB: v3 -> v4 (nuovo store `pick_session`). Migrazione automatica,
     nessun dato esistente viene toccato.

     -- [P1] IMPORT DELL'ORDINE DI PRODUZIONE (XLSX) --------------------------
     * Nuova sotto-scheda "Da Ordine (XLSX)" dentro Movimenta > Prelievo.
     * Sorgente dati: SOLO il file .xlsx esportato da Sage X3. Il PDF dello
       stesso ordine e' stato scartato dopo confronto diretto: espone le
       quantita' arrotondate a 3 decimali (14,790) contro le 6 dell'XLSX
       (14.789618) e richiederebbe un parser posizionale su testo, cioe' dati
       meno precisi ottenuti con piu' fragilita'. SheetJS 0.18.5 era gia'
       caricato: nessuna dipendenza nuova introdotta.
     * OdpParser legge testata (n. ordine, commessa, articolo finito, lotto,
       quantita' prevista), righe materiali e blocchi lotto. Le date di
       scadenza arrivano come seriale Excel e vengono convertite in ISO.
     * CONTROLLO DI COERENZA DEI LOTTI: introdotto qui, RIMOSSO in v2.5.1 [A1]
       perche' generava avvisi costanti dovuti all'arrotondamento della
       sorgente anziche' a errori reali. Resta valida la scelta di non tentare
       alcuna riallocazione automatica dei lotti: i lotti dell'ordine sono
       importati e usati come sono.

     -- [P2] PERCORSO DI PRELIEVO A SERPENTINA -------------------------------
     * PickRoute costruisce una tappa per ogni coppia articolo+lotto trovata in
       giacenza. Un percorso PER SITO; l'ordine dei siti e' configurabile e
       persistito (chiave wm_pick_site_order).
     * Ordinamento serpentina: zone nell'ordine di configurazione, corsie
       crescenti, campate crescenti sulle corsie dispari e decrescenti sulle
       pari, livelli dal basso verso l'alto. La geometria NON e' dedotta dal
       testo del codice ubicazione ma dai metadati restituiti da
       Store.generateLocations(): niente parsing di stringhe, niente ipotesi.
     * Articolo+lotto presente in piu' ubicazioni: UNA tappa sull'ubicazione
       piu' conveniente in ordine serpentina, le altre elencate come
       alternative sulla tappa stessa e accettate in scansione.
     * I lotti dell'ODP sono rispettati sempre. Il FEFO non viene applicato:
       l'assegnazione del lotto e' governata a monte da Sage X3.

     -- [P3] CODA DI FINE PERCORSO -------------------------------------------
     * In coda al percorso, mai dentro di esso:
         - fuori mappatura (articolo/lotto non a sistema, inclusi i
           semilavorati interni finche' non saranno mappati)
         - lotto assente ma articolo presente: vengono elencati i lotti
           alternativi effettivamente in giacenza
         - tappe marcate "non trovato" dall'operatore
     * Quarantena e impegno su DDT di reso/spedizione: SEGNALATI come nota
       conoscitiva, ESCLUSI dal percorso e non prelevabili.
     * La quantita' insufficiente non e' un criterio: Warehouse Mapper traccia
       la presenza dei colli, i kg sono su Sage. Il valore in kg dell'ODP e'
       riportato come dato informativo sulla tappa e sul report.

     -- [P4] ESECUZIONE GUIDATA CON TRIPLA SCANSIONE -------------------------
     * Ogni tappa richiede UBICAZIONE -> ARTICOLO -> LOTTO. Inserimento manuale
       ammesso quando l'etichetta non e' leggibile: il campo e' lo stesso.
     * Scansione discordante: blocco con riscontro sonoro e visivo. Lo sblocco
       e' possibile solo motivando per iscritto; la motivazione finisce nelle
       note del movimento a registro, non solo a video.
     * "Non trovato": la tappa viene marcata e il percorso prosegue. Confluisce
       in coda con motivo distinto da quello dei fuori mappatura.

     -- [P5] PROTEZIONE DEL LAVORO IN CORSO (due livelli) --------------------
     * Livello 1 - COMMIT PER TAPPA. La conferma di una tappa esegue una
       transazione Dexie atomica: scarico giacenza + record mov_log + stato
       della tappa. O passa tutto, o non passa nulla. Cio' che e' stato
       prelevato e' su IndexedDB nell'istante della conferma, non in memoria:
       chiusura della scheda, crash o riavvio non lo toccano.
     * Livello 2 - SESSIONE RIPRISTINABILE. Lo store `pick_session` conserva
       una sola sessione attiva con l'avanzamento del cammino. Alla riapertura
       l'app propone RIPRENDI o CHIUDI. A percorso concluso il record viene
       ELIMINATO: sopravvive solo il mov_log, che resta l'unica fonte di
       verita' per l'audit trail. L'ODP non viene quindi mai archiviato.
     * La finestra di storno di 120 secondi resta e agisce sull'ultima tappa
       confermata, che torna in stato "da fare".
     * LIMITE NOTO E DICHIARATO: IndexedDB e' locale al browser e al
       dispositivo. Questa architettura protegge da chiusura, crash e riavvio,
       NON da cancellazione dati del browser, navigazione in incognito o
       ripresa da un altro tablet. Per quello serve il backend multiutente,
       fuori dal perimetro di questa versione.

     -- [P6] PULIZIA DEL FILE (nessun cambio di comportamento) ---------------
     * Rimosso codice irraggiungibile verificato uno per uno:
         JS  - Store.getAllSites(), Validate.nonNegative(): zero riferimenti.
         DOM - <div id="toastContainer">: nessun codice vi appende piu' nulla
               da quando toast() delega a Feedback.signal().
         CSS - regole .toast/.toast-* e #toastContainer (contenitore rimosso);
               .app-sidebar.mobile-open (la classe non e' mai applicata: su
               mobile la navigazione e' .mob-tabs); .field-error, .fefo-badge,
               .fefo-badge-soft, .fefo-info, .btn-link, .input-invalid,
               .badge-purple, .flex-col, .items-center, .justify-between,
               .gap-md, .gap-lg, .flex-1, .text-center, .uppercase,
               .text-muted, .text-secondary: nessun riscontro nel markup ne'
               nei template. Le classi generate dinamicamente (s-*, fp-*,
               status-*, zone-type-*, badge-green/red/amber/muted) sono state
               verificate e CONSERVATE.
     * Store.getItemByKey() era anch'esso senza riferimenti: non e' stato
       rimosso perche' e' ora il punto di aggancio del nuovo modulo.
     * Store.readOPFSBackup() e' senza riferimenti ma CONSERVATO di proposito:
       e' l'unica primitiva di lettura dei backup automatici OPFS. Toglierla
       renderebbe quei backup illeggibili.
     * Changelog compattato alle ultime tre versioni; lo storico precedente e'
       ridotto a indice. Nessuna riga di codice attiva e' stata riscritta.

     v2.4.5 changelog (PATCH — SCORCIATOIE OPERAZIONI PRINCIPALI)
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)
     Nessun cambio di schema DB (resta v3). Nessuna funzione operativa nuova:
     i flussi richiamati sono quelli esistenti, invariati.

     -- [Q1] BARRA SCORCIATOIE IN TESTA ALLA DASHBOARD ------------------------
     * Tre comandi per le operazioni piu' frequenti, posti sopra gli
       indicatori: le azioni vengono prima della misura.
         - Posiziona        -> Movimenta > Posiziona            (tasto F2)
         - Sposta           -> Movimenta > Prelievo > Cambio Ubicazione (F3)
         - Prelievo ordini  -> Movimenta > Prelievo > Produzione       (F3)
     * Gli ultimi due richiedevano finora tre passaggi (vista Movimenta,
       scheda Prelievo, scelta della sotto-scheda): ora sono a un tocco.
     * Aggiunta _goOp(mode, sub): richiama switchView() e startMov() gia'
       esistenti, piu' _pickSub() quando serve selezionare la sotto-scheda
       del Prelievo. Nessuna delle funzioni richiamate e' stata modificata.
     * COLORE COERENTE: ogni comando usa il token --ct-cat-* del proprio tipo
       di movimento, cioe' lo stesso colore che quel movimento ha nella
       ciambella di ripartizione e nell'elenco degli ultimi movimenti. Verde
       ingresso, blu cambio ubicazione, ambra prelievo: un'operazione ha un
       solo colore in tutta l'applicazione.
     * PERIMETRO: le altre operazioni (smaltimento, inventario, quarantena,
       resi, spedizioni) NON sono in barra e restano nella vista Movimenta.
       Sono meno frequenti e piu' delicate, e per esse la scelta consapevole
       conta piu' della rapidita'; una barra che le contenesse tutte non
       sarebbe piu' una scorciatoia.
     * Comandi realizzati con <button> nativi: raggiungibili da tastiera,
       con anello di focus visibile ed etichetta accessibile. Il suggerimento
       del tasto funzione e' nascosto sotto i 700px, dove non c'e' tastiera.
     * Tipografia sui quattro gradini gia' definiti in v2.4.3: nessuna misura
       nuova introdotta. Il blocco @media print resta invariato — in stampa
       .app-main e' gia' nascosto, quindi le scorciatoie non compaiono nei
       report.
     ===============================================================================

     v2.4.4 changelog (PATCH — DIMENSIONE OMOGENEA DEI GRAFICI)
     (c) Andrea Sacchetti - Dietopack S.r.l. (Naturacare Group)
     Intervento di sola presentazione. Nessun cambio di schema DB (resta v3),
     nessuna modifica a dati, calcoli o logica operativa.

     -- [N1] GRAFICI RESI 1:1 IN UN RIQUADRO CONDIVISO ------------------------
     * Difetto: la regola .chart era width:100% SENZA limite superiore. La
       ciambella era vincolata da max-width al proprio viewBox e restava
       percio' resa 1:1 (168 px); il grafico ad area, privo di vincolo,
       cresceva con la larghezza della card. Su un pannello da 700 px
       arrivava a 700x313 px, cioe' quasi il doppio dell'altezza della
       ciambella, con ogni testo interno ingrandito di 2,06 volte. Le due
       card della stessa riga avevano quindi altezza e peso tipografico
       molto diversi, e il divario cambiava con la larghezza della finestra.
     * Correzione: introdotto il token --ct-size (196 px) come altezza del
       riquadro grafico. La ciambella passa da 168 a 196 px (spessore da 26
       a 30). Il grafico ad area passa da un viewBox 340x152 a 440x196, cioe'
       esattamente il rapporto dichiarato in .chart--area, e viene limitato
       in larghezza e altezza: entrambi i grafici sono ora resi 1:1 e
       occupano riquadri di pari altezza.
     * Soglia di impilamento allineata: .panels-row passa da minmax(320px) a
       minmax(420px). Con la soglia precedente due card potevano stare
       affiancate a 340 px ciascuna, larghezza alla quale il grafico ad area
       si riduce a 340x151 mentre la ciambella resta 196x196 e lo scarto di
       altezza ricompare. La classe e' usata esclusivamente nella dashboard
       (4 occorrenze, tutte in renderDashboard): nessun'altra vista e'
       raggiunta dalla modifica.
     * Conseguenza sui testi: con la resa 1:1 i px del viewBox sono i px
       effettivi a schermo. Prima l'ingrandimento li portava a dimensioni
       leggibili quasi per caso, e diverse da una card all'altra. I valori
       sono stati rialzati di conseguenza: testo base dei grafici da 9 a
       10,5 px, etichette d'asse da 8,5 a 10 px, etichetta sotto il totale
       da 8 a 9 px. Il totale al centro resta a 21 px, sotto ai valori KPI
       (24 px) come stabilito in v2.4.3.

<div id="bootScreen" class="boot-screen">
  <div class="boot-spinner"></div>
  <div class="boot-text">Inizializzazione Pathfinder 1.2…</div>
</div>

<div class="app" id="appRoot" style="display:none">
  <!-- Header -->
  <header class="app-header">
    <div class="app-brand">
      <!-- v2.7.0 [G1] — Marchio Pathfinder, SVG inline. Definizioni in #pfLogoSprite.
           Simbolo e wordmark sono due <svg> distinti: sotto i 1280px il secondo
           sparisce senza lasciare la riquadratura vuota di un viewBox troppo largo. -->
      <svg class="pf-logo pf-logo--light pf-logo-symbol" viewBox="0 0 120 120" role="img" aria-label="Pathfinder Warehouse Mapper"><use href="#pfLogoMark"/></svg>
      <svg class="pf-logo pf-logo--light pf-logo-word" viewBox="0 0 400 120" aria-hidden="true" focusable="false"><use href="#pfLogoWord"/></svg>
      <span class="app-version">1.2</span>
    </div>
    <div class="app-center">
      <nav class="app-nav">
        <button class="nav-btn active" data-view="dashboard" onclick="App.switchView('dashboard')" title="Dashboard"><span>🏠</span><span class="nav-lbl">Dashboard</span></button>
        <button class="nav-btn" data-view="map" onclick="App.switchView('map')" title="Mappa"><span>🗺</span><span class="nav-lbl">Mappa</span></button>
        <button class="nav-btn" data-view="movimenta" onclick="App.switchView('movimenta')" title="Movimenta"><span>📦</span><span class="nav-lbl">Movimenta</span></button>
        <!-- v1.1.0 [N5] — Archivio: la ristampa e' un gesto di magazzino,
             e sta accanto agli altri gesti di magazzino. -->
        <button class="nav-btn" data-view="archive" onclick="App.switchView('archive')" title="Archivio documenti"><span>🗂</span><span class="nav-lbl">Archivio</span></button>
      </nav>
      <!-- v2.7.0 [G2] — Ricerca in barra: il campo resta, i risultati scendono -->
      <div class="hdr-search" id="hdrSearch">
        <div class="hdr-search-box">
          <span class="hdr-search-icon" aria-hidden="true">🔍</span>
          <input class="hdr-search-input" id="hdrSearchInput" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Cerca articolo, lotto, ubicazione o descrizione…"
                 aria-label="Ricerca in magazzino" aria-expanded="false" aria-controls="searchPop"
                 oninput="App._onSearchInput()" onkeydown="App._onSearchKeydown(event)" onfocus="App._onSearchFocus()">
          <button class="hdr-search-clear" type="button" title="Pulisci (Esc)" onclick="App.clearSearch()">✕</button>
        </div>
        <div class="search-pop" id="searchPop" role="listbox" aria-label="Risultati della ricerca" hidden></div>
      </div>
    </div>
    <div class="app-header-right">
      <button class="hdr-icon-btn" id="configIconBtn" data-view="config" onclick="App.switchView('config')" title="Configurazione" aria-label="Configurazione">⚙</button>
      <button id="operatorBadge" class="op-badge op-badge-empty" onclick="App.showOperatorMenu()" title="Operatore corrente">👤 —</button>
      <button type="button" class="sync-indicator" id="syncIndicator" onclick="App.manualSave()" title="Stato del salvataggio — clicca per salvare ora">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">Salvato</span>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <span>Siti e Zone</span>
      <button class="sidebar-collapse-btn" type="button" onclick="App.toggleSidebar()" title="Riduci la colonna (Ctrl+B)" aria-label="Riduci la colonna Siti e Zone">«</button>
    </div>
    <div id="sidebarContent"></div>
  </aside>

  <!-- Main area -->
  <main class="app-main">
    <!-- v2.7.0 [G4] — Linguetta di riapertura, visibile solo a colonna chiusa -->
    <button class="sidebar-rail" type="button" onclick="App.toggleSidebar()" title="Mostra Siti e Zone (Ctrl+B)" aria-label="Mostra la colonna Siti e Zone">
      <span class="sidebar-rail-label">» Siti e Zone</span>
    </button>
    <section class="view" id="viewDashboard"></section>
    <section class="view hidden" id="viewMap">
      <div id="mapToolbar"></div>
      <div class="map-container" id="mapContainer"></div>
    </section>
    <section class="view hidden" id="viewMovimenta"></section>
    <section class="view hidden" id="viewArchive"></section>
    <section class="view hidden" id="viewConfig"></section>
  </main>

  <!-- Mobile tabs -->
  <nav class="mob-tabs">
    <button class="mob-tab active" data-view="dashboard" onclick="App.switchView('dashboard')"><span>🏠</span>Dash</button>
    <button class="mob-tab" data-view="map" onclick="App.switchView('map')"><span>🗺</span>Mappa</button>
    <button class="mob-tab" data-view="movimenta" onclick="App.switchView('movimenta')"><span>📦</span>Movim.</button>
    <button class="mob-tab" data-view="archive" onclick="App.switchView('archive')"><span>🗂</span>Archivio</button>
    <button class="mob-tab" data-view="config" onclick="App.switchView('config')"><span>⚙</span>Conf.</button>
  </nav>

  <!-- Footer -->
  <footer class="app-footer">
    <span>© Andrea Sacchetti — Dietopack S.r.l. / Naturacare Group</span>
    <span>Pathfinder 1.2</span>
  </footer>

  <!-- Detail panel -->
  <aside class="detail-panel collapsed" id="detailPanel">
    <div class="detail-header">
      <h2 id="detailTitle">—</h2>
      <button class="btn btn-sm btn-icon btn-ghost" onclick="App.closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </aside>
</div>

<!-- Overlay containers -->
<!-- v2.1.0 — Feedback centrale, flash perimetrale e dialogo applicativo -->
<div id="fbFlash" aria-hidden="true"></div>
<div id="fbCenter" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="dlgOverlay" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div>
<div id="printReport"></div>
<input type="file" id="fileImport" accept=".json" style="display:none" onchange="App.handleImport(event)">
<input type="file" id="fileImportExcel" accept=".xlsx,.xls" style="display:none" onchange="App.handleImportExcel(event)">
<!-- v2.5.0 — Import dell'ordine di produzione Sage X3 per il prelievo guidato -->
<input type="file" id="fileImportOdp" accept=".xlsx,.xls" style="display:none" onchange="App.handleImportOdp(event)">

<script type="module" src="/src/main.js"></script>
</body>
</html>
