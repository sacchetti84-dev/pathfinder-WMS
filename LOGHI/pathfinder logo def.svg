<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="100%" height="100%">
  <defs>
    <!-- Gradiente Sfumato per i Cubi Chiari (Luce Principale) -->
    <linearGradient id="lightCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A8E7D" />
      <stop offset="100%" stop-color="#2A6F62" />
    </linearGradient>

    <linearGradient id="lightCubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A6F62" />
      <stop offset="100%" stop-color="#1F4E45" />
    </linearGradient>

    <linearGradient id="lightCubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56C8B1" />
      <stop offset="100%" stop-color="#3A8E7D" />
    </linearGradient>

    <style>
      .bg-light { fill: #F4F7F6; rx: 16px; }
      .brand-title-dark { font-family: 'Geist', 'Inter', 'SF Pro Display', sans-serif; font-weight: 800; font-size: 48px; fill: #12171A; letter-spacing: 9px; }
      .brand-subtitle-dark { font-family: 'Geist', 'Inter', 'SF Pro Text', sans-serif; font-weight: 600; font-size: 12px; fill: #2A6F62; letter-spacing: 6px; }
      
      /* Linee Sottili di Costruzione Isometrica (CAD / Fine Grid) */
      .fine-grid { stroke: #D0DCD7; stroke-width: 0.75; stroke-dasharray: 2 3; }
      .fine-axis { stroke: #2A6F62; stroke-width: 0.8; opacity: 0.4; }
      
      .cube-edge-light { stroke: #F4F7F6; stroke-width: 1.2; stroke-linejoin: round; }
      .glow-node-light { fill: #2A6F62; filter: drop-shadow(0px 2px 6px rgba(42, 111, 98, 0.3)); }
    </style>
  </defs>

  <!-- Container Sfondo Chiaro (Schiarito / Slate Minimal) -->
  <rect width="820" height="250" class="bg-light" />

  <!-- RETICOLO A LINEE SOTTILI (Fine Line Construction Grid) -->
  <g transform="translate(115, 125)">
    <!-- Rete Isometrica di Sfondo -->
    <line x1="-80" y1="-46" x2="80" y2="46" class="fine-grid" />
    <line x1="-80" y1="46" x2="80" y2="-46" class="fine-grid" />
    <line x1="0" y1="-90" x2="0" y2="90" class="fine-grid" />
    
    <line x1="-60" y1="-70" x2="60" y2="-1" class="fine-grid" />
    <line x1="-60" y1="-1" x2="60" y2="-70" class="fine-grid" />
    <line x1="-60" y1="1" x2="60" y2="70" class="fine-grid" />
    <line x1="-60" y1="70" x2="60" y2="1" class="fine-grid" />

    <!-- Assi Portanti Sottili -->
    <line x1="0" y1="-80" x2="0" y2="80" class="fine-axis" />
    <line x1="-69" y1="40" x2="69" y2="-40" class="fine-axis" />
    <line x1="-69" y1="-40" x2="69" y2="40" class="fine-axis" />

    <!-- LEVEL 0: CUBO GUIDA A LINEE SOTTILI (Wireframe) -->
    <g transform="scale(1.9)">
      <polygon points="0,-30 26,-15 0,0 -26,-15" fill="none" stroke="#2A6F62" stroke-width="0.75" opacity="0.35" />
      <polygon points="-26,-15 0,0 0,30 -26,15" fill="none" stroke="#2A6F62" stroke-width="0.75" opacity="0.35" />
      <polygon points="0,0 26,-15 26,15 0,30" fill="none" stroke="#2A6F62" stroke-width="0.75" opacity="0.35" />
    </g>

    <!-- LEVEL 1: CUBI PRIMARI (Struttura Piena Schiarita) -->
    
    <!-- Cubo Principale In Alto -->
    <g transform="translate(0, -42)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#lightCubeRight)" class="cube-edge-light" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#lightCubeLeft)" class="cube-edge-light" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#lightCubeTop)" class="cube-edge-light" />
    </g>

    <!-- Cubo Principale Basso Sinistra -->
    <g transform="translate(-36, 20)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#lightCubeRight)" class="cube-edge-light" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#lightCubeLeft)" class="cube-edge-light" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#lightCubeTop)" class="cube-edge-light" />
    </g>

    <!-- Cubo Principale Basso Destra -->
    <g transform="translate(36, 20)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="url(#lightCubeRight)" class="cube-edge-light" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="url(#lightCubeLeft)" class="cube-edge-light" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="url(#lightCubeTop)" class="cube-edge-light" />
    </g>

    <!-- LEVEL 2: MICRO-CUBI FRATTALI (Sub-nodi leggeri) -->
    
    <g transform="translate(0, -68) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="#2A6F62" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#1F4E45" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#56C8B1" />
    </g>

    <g transform="translate(-58, 32) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="#2A6F62" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#1F4E45" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#56C8B1" />
    </g>

    <g transform="translate(58, 32) scale(0.45)">
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="#2A6F62" />
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#1F4E45" />
      <polygon points="0,0 17,-10 17,10 0,20" fill="#56C8B1" />
    </g>

    <!-- Punto Focale Centrale -->
    <circle cx="0" cy="-2" r="4" class="glow-node-light" />
  </g>

  <!-- TIPOGRAFIA SCURA PER SFONDO CHIARO -->
  <g transform="translate(265, 122)">
    <text x="0" y="10" class="brand-title-dark">PATHFINDER</text>
    <text x="4" y="38" class="brand-subtitle-dark">INSTANT WAREHOUSE MAPPING</text>
  </g>

  <!-- Accento di Interfaccia UI Minimal -->
  <circle cx="269" cy="172" r="3" fill="#2A6F62" />
  <line x1="280" y1="172" x2="330" y2="172" stroke="#D0DCD7" stroke-width="1.5" stroke-linecap="round" />
</svg>
